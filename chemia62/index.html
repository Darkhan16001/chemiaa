<script>
"use strict";

/* =====================================
  §62 ОРГАНИКАЛЫҚ ЗАТТАРДЫҢ
  ҚҰРЫЛЫСЫ МЕН ҚҰРАМЫ. ИЗОМЕРЛЕНУІ
  БАРЛЫҒЫ БІР INDEX.HTML
===================================== */

const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
}[c]));

const KEY="darkhan_chem62_onefile_v1";

function newState(){
 return{
  levels:{},
  board:0,
  boardOpen:false,
  game:0,
  gameOpen:false,
  scores:[0,0,0],
  homeOpen:false
 };
}

let state=newState();

try{
 const old=JSON.parse(localStorage.getItem(KEY));
 if(old && Array.isArray(old.scores)){
  state={...newState(),...old};
 }
}catch(e){console.warn(e);}

function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(state));
 }catch(e){console.warn(e);}
}

/* 80 МИНУТ ЖӘНЕ АЛМАТЫ УАҚЫТЫ */

const TIME_KEY=KEY+"_timer";
let deadline=Number(localStorage.getItem(TIME_KEY))||null;

function remaining(){
 return deadline===null
  ?4800
  :Math.max(0,Math.ceil((deadline-Date.now())/1000));
}

function updateClock(){
 const t=remaining();

 $("timer").textContent=
  String(Math.floor(t/60)).padStart(2,"0")+
  ":"+String(t%60).padStart(2,"0");

 $("timer").style.color=t===0?"#ffb5bd":"#ffdc90";

 $("clock").textContent=
  new Intl.DateTimeFormat("en-GB",{
   timeZone:"Asia/Almaty",
   hour:"2-digit",
   minute:"2-digit",
   second:"2-digit",
   hourCycle:"h23"
  }).format(new Date());
}

function startTimer(){
 if(deadline && remaining()>0)return;

 deadline=Date.now()+4800000;
 localStorage.setItem(TIME_KEY,String(deadline));
 updateClock();render();
}

function resetTimer(){
 if(!confirm("Таймерді жаңартамыз ба?"))return;

 deadline=null;
 localStorage.removeItem(TIME_KEY);
 updateClock();render();
}

setInterval(updateClock,1000);

/* СЛАЙДТАР */

const slides=[];
let page=0;

function add(title,section,content){
 slides.push({title,section,content});
}
function dynamic(title,section,renderer){
 slides.push({title,section,renderer});
}
function render(){
 const s=slides[page];
 if(!s)return;

 $("slide").innerHTML=
  s.renderer?s.renderer():s.content;
 $("sectionName").textContent=s.section;
 $("slideTitle").textContent=s.title;
 $("pageCounter").textContent=
  `${page+1} / ${slides.length}`;
 $("prev").disabled=page===0;
 $("next").disabled=page===slides.length-1;
 $("main").scrollTop=0;
}
function goTo(title){
 const i=slides.findIndex(s=>s.title===title);
 if(i>=0){page=i;render();}
}
$("prev").onclick=()=>{
 if(page>0){page--;render();}
};
$("next").onclick=()=>{
 if(page<slides.length-1){page++;render();}
};

/* =====================================
   ИЗОМЕРЛЕРДІҢ КӨРНЕКІ СЫЗБАСЫ
===================================== */

function structureSVG(kind="butane"){
 const models={
  butane:{
   title:"Бутан",
   formula:"C₄H₁₀",
   atoms:[
    ["CH₃",67,99],
    ["CH₂",172,99],
    ["CH₂",280,99],
    ["CH₃",385,99]
   ],
   bonds:[[0,1],[1,2],[2,3]]
  },
  methylpropane:{
   title:"2-метилпропан",
   formula:"C₄H₁₀",
   atoms:[
    ["CH₃",67,115],
    ["CH",220,115],
    ["CH₃",374,115],
    ["CH₃",220,27]
   ],
   bonds:[[0,1],[1,2],[1,3]]
  },
  pentane:{
   title:"Пентан",
   formula:"C₅H₁₂",
   atoms:[
    ["CH₃",36,100],
    ["CH₂",130,100],
    ["CH₂",224,100],
    ["CH₂",318,100],
    ["CH₃",412,100]
   ],
   bonds:[[0,1],[1,2],[2,3],[3,4]]
  },
  methylbutane:{
   title:"2-метилбутан",
   formula:"C₅H₁₂",
   atoms:[
    ["CH₃",45,115],
    ["CH",152,115],
    ["CH₂",273,115],
    ["CH₃",397,115],
    ["CH₃",152,27]
   ],
   bonds:[[0,1],[1,2],[2,3],[1,4]]
  },
  dimethylpropane:{
   title:"2,2-диметилпропан",
   formula:"C₅H₁₂",
   atoms:[
    ["CH₃",50,112],
    ["C",220,112],
    ["CH₃",390,112],
    ["CH₃",220,25],
    ["CH₃",220,198]
   ],
   bonds:[[0,1],[1,2],[1,3],[1,4]]
  },
  ethanol:{
   title:"Этанол",
   formula:"C₂H₆O",
   atoms:[
    ["CH₃",85,100],
    ["CH₂",222,100],
    ["OH",365,100]
   ],
   bonds:[[0,1],[1,2]]
  },
  ether:{
   title:"Диметил эфирі",
   formula:"C₂H₆O",
   atoms:[
    ["CH₃",83,100],
    ["O",224,100],
    ["CH₃",365,100]
   ],
   bonds:[[0,1],[1,2]]
  }
 };

 const m=models[kind]||models.butane;

 const lines=m.bonds.map(([a,b])=>{
  const x=m.atoms[a],y=m.atoms[b];

  const dx=y[1]-x[1];
  const dy=y[2]-x[2];
  const length=Math.hypot(dx,dy)||1;
  const ux=dx/length,uy=dy/length;

  const gapA=x[0]==="C"?20:39;
  const gapB=y[0]==="C"?20:39;

  return `
   <line
    x1="${x[1]+ux*gapA}"
    y1="${x[2]+uy*gapA}"
    x2="${y[1]-ux*gapB}"
    y2="${y[2]-uy*gapB}"
    stroke="#86e9bb"
    stroke-width="6"
    stroke-linecap="round"
   />
  `;
 }).join("");

 const atoms=m.atoms.map(a=>`
  <text x="${a[1]}" y="${a[2]+8}"
   text-anchor="middle"
   fill="#f4fbff"

/* ҚАУІПСІЗ ЕСЕПТЕУ */

function calculate(src){
 if(!/^[0-9+\-*/(). ]+$/.test(src)){
  throw Error("Қате өрнек");
 }

 let pos=0;
 function skip(){while(src[pos]===" ")pos++;}

 function factor(){
  skip();

  if(src[pos]==="+"){
   pos++;
   return factor();
  }
  if(src[pos]==="-"){
   pos++;
   return -factor();
  }
  if(src[pos]==="("){
   pos++;
   const v=expression();
   skip();

   if(src[pos]!==")")throw Error("Жақша");
   pos++;
   return v;
  }

  const m=/^(?:\d+\.?\d*|\.\d+)/
   .exec(src.slice(pos));

  if(!m)throw Error("Сан");

  pos+=m[0].length;
  return Number(m[0]);
 }

 function term(){
  let v=factor();

  while(true){
   skip();
   const op=src[pos];

   if(op!=="*"&&op!=="/")break;
   pos++;

   const b=factor();
   v=op==="*"?v*b:v/b;
  }

  return v;
 }

 function expression(){
  let v=term();

  while(true){
   skip();
   const op=src[pos];

   if(op!=="+"&&op!=="-")break;
   pos++;

   const b=term();
   v=op==="+"?v+b:v-b;
  }

  return v;
 }

 const result=expression();
 skip();

 if(pos!==src.length||!Number.isFinite(result)){
  throw Error("Есептеу қатесі");
 }

 return Number(result.toPrecision(12));
}

 }else{

 }

});

 if(e.pointerType==="mouse"&&e.button!==0)return;

 const r=calculator.getBoundingClientRect();

 drag={
  id:e.pointerId,
  x:e.clientX,y:e.clientY,
  left:r.left,top:r.top,
  moved:false
 };
});

window.addEventListener("pointermove",e=>{
 if(!drag||drag.id!==e.pointerId)return;

 const dx=e.clientX-drag.x;
 const dy=e.clientY-drag.y;

 if(!drag.moved&&Math.hypot(dx,dy)>7){
  drag.moved=true;
  calculator.classList.add("dragging");
 }

 if(!drag.moved)return;
 if(e.cancelable)e.preventDefault();

 calculator.style.left=clamp(
  drag.left+dx,
  0,
  Math.max(0,innerWidth-calculator.offsetWidth)
 )+"px";

 calculator.style.top=clamp(
  drag.top+dy,
  0,
  Math.max(0,innerHeight-calculator.offsetHeight)
 )+"px";

 calculator.style.right="auto";
 calculator.style.bottom="auto";
},{passive:false});

function stopDrag(e){
 if(!drag||drag.id!==e.pointerId)return;

 const moved=drag.moved;
 drag=null;

 calculator.classList.remove("dragging");

 if(moved){
  skipClick=true;
  setTimeout(()=>{skipClick=false;},150);
 }
}

 .split("\n")
 .map((line,i)=>{
  const [symbol,name,mass]=line.trim().split("|");

const periodColumns=[
 [1,18],
 [1,2,13,14,15,16,17,18],
 [1,2,13,14,15,16,17,18],
 Array.from({length:18},(_,i)=>i+1),
 Array.from({length:18},(_,i)=>i+1)
];

function elementPosition(z){
 if(z<=54){
  let k=z-1;

  for(let p=0;p<5;p++){
   const columns=periodColumns[p];

   if(k<columns.length){
    return{row:p+1,col:columns[k]};
   }
   k-=columns.length;
  }
 }

 if(z<=56)return{row:6,col:z-54};
 if(z<=71)return{row:9,col:z-54};
 if(z<=86)return{row:6,col:z-68};

 if(z<=88)return{row:7,col:z-86};
 if(z<=103)return{row:10,col:z-86};
 return{row:7,col:z-100};
}

const highlighted=new Set(["C","H","O","N"]);
const noble=new Set([
 "He","Ne","Ar","Kr","Xe","Rn","Og"
]);

function elementClass(e){
 if(highlighted.has(e.symbol))return"highlight";
 if(noble.has(e.symbol))return"noble";
 if(e.z>=57&&e.z<=71)return"lanth";
 if(e.z>=89&&e.z<=103)return"act";
 return"";
}

function buildPeriodic(){
 let html="";

 for(let g=1;g<=18;g++){
  html+=`
   <div class="group-label"
    style="grid-row:1;grid-column:${g+1}">
    ${g}
   </div>
  `;
 }

 for(let p=1;p<=7;p++){
  html+=`
   <div class="period-label"
    style="grid-row:${p+1};grid-column:1">
    ${p}
   </div>
  `;
 }

 html+=`
  <div class="period-label"
   style="grid-row:10;grid-column:1;font-size:11px">
   Лантаноид
  </div>
  <div class="period-label"
   style="grid-row:11;grid-column:1;font-size:11px">
   Актиноид
  </div>
  <div class="group-label"
   style="grid-row:7;grid-column:4">
   57–71
  </div>
  <div class="group-label"
   style="grid-row:8;grid-column:4">
   89–103
  </div>
 `;

 elements.forEach((e,i)=>{
  const p=elementPosition(e.z);

  html+=`
   <button class="element ${elementClass(e)}"
    style="grid-row:${p.row+1};grid-column:${p.col+1}"
    data-element="${i}">
    <span class="number">${e.z}</span>
    <span class="symbol">${esc(e.symbol)}</span>
    <span class="ename">${esc(e.name)}</span>
    <span class="mass">${esc(e.mass)}</span>
   </button>
  `;
 });

 $("periodicGrid").innerHTML=html;
}
