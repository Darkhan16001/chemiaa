<style>

<script>
"use strict";

/* 1. СЛАЙД ЖҮЙЕСІ */

const $=id=>document.getElementById(id);
const slides=[];
let page=0;

function add(title,section,html){
 slides.push({title,section,html});
}
function dynamic(title,section,render){
 slides.push({title,section,render});
}
function draw(){
 const s=slides[page];
 if(!s)return;
 $("slide").innerHTML=s.render?s.render():s.html;
 $("sectionName").textContent=s.section;
 $("counter").textContent=(page+1)+" / "+slides.length;
 $("prev").disabled=page===0;
 $("next").disabled=page===slides.length-1;
 $("main").scrollTop=0;
}
function go(title){
 const n=slides.findIndex(s=>s.title===title);
 if(n>=0){page=n;draw();}
}
$("prev").onclick=()=>{
 if(page>0){page--;draw();}
};
$("next").onclick=()=>{
 if(page<slides.length-1){page++;draw();}
};

/* 2. САҚТАУ */

const STORE="chemistry86_darkhan_v1";
function initialState(){
 return{
  levels:{},oral:0,oralShow:false,
  game:0,choice:null,scores:[0,0,0],
  home:false,molecule:0
 };
}
let state=initialState();
try{
 const saved=JSON.parse(localStorage.getItem(STORE));
 if(saved&&Array.isArray(saved.scores)
    &&saved.scores.length===3){
  state={...initialState(),...saved};
 }
}catch(e){console.warn(e);}
function save(){
 try{
  localStorage.setItem(STORE,JSON.stringify(state));
 }catch(e){console.warn(e);}
}

/* 3. КӨРНЕКІЛІК */

function diagram(){
 return `
 <div class="visual">

    <line x1="135" y1="112" x2="215" y2="112"/>
    <line x1="278" y1="112" x2="360" y2="112"/>
    <line x1="105" y1="82" x2="105" y2="50"/>
    <line x1="105" y1="143" x2="105" y2="177"/>
   </g>
   <g fill="#22526e" stroke="#95e3ff" stroke-width="4">
    <circle cx="105" cy="112" r="33"/>
    <circle cx="246" cy="112" r="33"/>
   </g>
   <circle cx="394" cy="112" r="39"
    fill="#17755f" stroke="#94efc7" stroke-width="4"/>
   <g fill="#fff" text-anchor="middle"
    font-size="30" font-weight="bold">
    <text x="105" y="122">C</text>
    <text x="246" y="122">C</text>
    <text x="394" y="122">OH</text>
   </g>
   <g fill="#ffda91" font-size="23"
    text-anchor="middle" font-weight="bold">
    <text x="280" y="40">Гидроксил тобы</text>
    <text x="280" y="210">CH₃–CH₂–OH</text>
   </g>
  </svg>
  <strong>–OH — функционалдық топ</strong>
  <p>Спирттерді сипаттайтын негізгі белгі</p>
 </div>
 `;
}

/* 4. КІРІСПЕ */

dynamic("Кіріспе","Кіріспе · 5 минут",()=>`
 <div class="grid2">
  <div>
   <div class="eyebrow">§86 · ОРГАНИКАЛЫҚ ХИМИЯ</div>
   <h1>Спирттердің жіктелуі және химиялық қасиеттері</h1>
   <p>
    Спирттердің гидроксил тобын,
    біратомды және көпатомды спирттерді,
    біріншілік, екіншілік, үшіншілік түрлерін
    және олардың химиялық қасиеттерін үйренеміз.
   </p>
   <div class="formula">R–OH · Гидроксил тобы</div>
   <div class="actions">
    <button class="btn good" data-action="start">
     ▶ Сабақты бастау
    </button>
    <button class="btn gold" data-action="reset-time">
     ↺ Таймерді жаңарту
    </button>
   </div>
  </div>

`);

add("Сабақ мақсаты","Кіріспе",`
 <h2>Сабақтың мақсаты</h2>
 <div class="grid2">
  <div class="card">
   <h3>Білімдік мақсат</h3>
   <p>

    екіншілік және үшіншілік спирттерді ажырату.
   </p>
  </div>
  <div class="card">
   <h3>Практикалық мақсат</h3>
   <p>
    Спирттердің формуласын жазу,
    құрылымдық изомерлерін салыстыру,
    теориялық реакция теңдеулерін талдау
    және молярлық массаға есеп шығару.
   </p>
  </div>
 </div>
 <div class="note">
  <p>
   80 минут: кіріспе — 5, теория — 20,
   конспект — 8, деңгейлік жұмыс — 10,
   жеке жұмыс — 20, командалық ойын — 12,
   қорытынды — 5 минут.

 </div>

/* 5. 15 ТЕОРИЯЛЫҚ БЕТ */

const TIMER_KEY=STORE+"_timer";

function tick(){

  ?4800
  :Math.max(0,Math.ceil((deadline-Date.now())/1000));

 $("timer").textContent=
  String(Math.floor(seconds/60)).padStart(2,"0")+

  }).format(new Date());
}
function startTimer(){
 if(deadline!==null){
  alert("Таймер іске қосылған.");return;
 }
 deadline=Date.now()+4800000;
 try{
  localStorage.setItem(TIMER_KEY,String(deadline));
 }catch(e){}

}
function resetTimer(){
 if(!confirm("80 минуттық таймерді жаңартамыз ба?")){
  return;
 }
 deadline=null;
 try{localStorage.removeItem(TIMER_KEY);}catch(e){}

const keys=[
 "7","8","9","/",
 "4","5","6","*",
 "1","2","3","-",
 "C","0",".","+",
 "(",")","⌫","="
];
$("calcKeys").innerHTML=keys.map(k=>`
 <button type="button" data-key="${k}">
  ${k==="/"?"÷":k==="*"?"×":k}

let calcText="";

function calculate(input){
 let i=0;
 function factor(){
  if(input[i]==="+"){i++;return factor();}
  if(input[i]==="-"){i++;return -factor();}
  if(input[i]==="("){
   i++;
   const result=sum();
   if(input[i]!==")")throw Error("Жақша қатесі");
   i++;
   return result;
  }
  const m=/^(?:\d+\.?\d*|\.\d+)/
   .exec(input.slice(i));
  if(!m)throw Error("Сан қатесі");
  i+=m[0].length;
  return Number(m[0]);
 }
 function product(){
  let v=factor();
  while(input[i]==="*"||input[i]==="/"){
   const op=input[i++];
   const next=factor();
   v=op==="*"?v*next:v/next;
  }
  return v;
 }
 function sum(){
  let v=product();
  while(input[i]==="+"||input[i]==="-"){
   const op=input[i++];
   const next=product();
   v=op==="+"?v+next:v-next;
  }
  return v;
 }
 if(!/^[0-9+*/().-]+$/.test(input)){
  throw Error("Таңба қатесі");
 }
 const value=sum();
 if(i!==input.length||!Number.isFinite(value)){
  throw Error("Өрнек қатесі");
 }
 return Number(value.toPrecision(12));
}

$("calcKeys").addEventListener("click",e=>{
 const b=e.target.closest("[data-key]");
 if(!b)return;
 const key=b.dataset.key;

 if(key==="C")calcText="";
 else if(key==="⌫")calcText=calcText.slice(0,-1);
 else if(key==="="){
  try{calcText=String(calculate(calcText));}
  catch(e){calcText="Қате";}
 }else{
  if(calcText==="Қате")calcText="";
  calcText+=key;
 }
 $("calcDisplay").value=calcText;
});

/* 16. ЖЫЛЖЫМАЛЫ КАЛЬКУЛЯТОР */

function clamp(v,min,max){
 return Math.max(min,Math.min(max,v));
}
function fitCalculator(){
 if(calculator.hidden)return;
 const r=calculator.getBoundingClientRect();
 calculator.style.left=clamp(
  r.left,0,Math.max(0,innerWidth-r.width)
 )+"px";
 calculator.style.top=clamp(
  r.top,0,Math.max(0,innerHeight-r.height)
 )+"px";
}
let drag=null;
let blockClickUntil=0;

calculator.querySelector(".calc-head")
 .addEventListener("pointerdown",e=>{
  if(drag||(e.pointerType==="mouse"&&e.button!==0)){
   return;
  }
  const r=calculator.getBoundingClientRect();
  drag={
   id:e.pointerId,x:e.clientX,y:e.clientY,
   left:r.left,top:r.top,moved:false
  };
  calculator.setPointerCapture(e.pointerId);
 });

calculator.addEventListener("pointermove",e=>{
 if(!drag||drag.id!==e.pointerId)return;
 const dx=e.clientX-drag.x;
 const dy=e.clientY-drag.y;
 if(Math.hypot(dx,dy)>6)drag.moved=true;
 if(!drag.moved)return;
 calculator.classList.add("dragging");
 calculator.style.left=clamp(
  drag.left+dx,0,
  Math.max(0,innerWidth-calculator.offsetWidth)
 )+"px";
 calculator.style.top=clamp(
  drag.top+dy,0,
  Math.max(0,innerHeight-calculator.offsetHeight)
 )+"px";
});
calculator.addEventListener("pointerup",e=>{
 if(!drag||drag.id!==e.pointerId)return;
 if(drag.moved)blockClickUntil=performance.now()+300;
 drag=null;
 calculator.classList.remove("dragging");
 if(calculator.hasPointerCapture(e.pointerId)){
  calculator.releasePointerCapture(e.pointerId);
 }
});
calculator.addEventListener("pointercancel",()=>{
 drag=null;
 calculator.classList.remove("dragging");
});
calculator.addEventListener("click",e=>{
 if(performance.now()>blockClickUntil)return;
 e.preventDefault();
 e.stopImmediatePropagation();
 blockClickUntil=0;
},true);
window.addEventListener("resize",fitCalculator);

const elements=elementData.trim()
 .split(/\s+/).map((entry,i)=>{
  const [symbol,name]=entry.split("|");

const groups=[
 [1,18],
 [1,2,13,14,15,16,17,18],
 [1,2,13,14,15,16,17,18],
 Array.from({length:18},(_,i)=>i+1),
 Array.from({length:18},(_,i)=>i+1)
];

function position(z){
 if(z<=54){
  let k=z-1;
  for(let p=0;p<5;p++){
   if(k<groups[p].length){
    return{row:p+1,col:groups[p][k]};
   }
   k-=groups[p].length;
  }
 }
 if(z<=56)return{row:6,col:z-54};
 if(z<=71)return{row:9,col:z-53};
 if(z<=86)return{row:6,col:z-68};
 if(z<=88)return{row:7,col:z-86};
 if(z<=103)return{row:10,col:z-85};
 return{row:7,col:z-100};
}

function buildTable(){
 let html="";
 for(let g=1;g<=18;g++){
  html+=`<span class="period-label"
   style="grid-row:1;grid-column:${g+1}">${g}</span>`;
 }
 for(let p=1;p<=7;p++){
  html+=`<span class="period-label"
   style="grid-row:${p+1};grid-column:1">${p}</span>`;
 }
 html+=`
  <span class="period-label"
   style="grid-row:10;grid-column:1">La–Lu</span>
  <span class="period-label"
   style="grid-row:11;grid-column:1">Ac–Lr</span>
  <span class="period-label"
   style="grid-row:7;grid-column:4">57–71</span>
  <span class="period-label"
   style="grid-row:8;grid-column:4">89–103</span>
 `;
 for(const el of elements){
  const p=position(el.z);
  const f=(el.z>=57&&el.z<=71)
      ||(el.z>=89&&el.z<=103);
  const featured=["H","C","O","N"].includes(el.symbol);
  html+=`
   <button class="element ${f?"fblock":featured?"featured":""}"
    data-z="${el.z}"
    style="grid-row:${p.row+1};grid-column:${p.col+1}">
    <i>${el.z}</i><b>${el.symbol}</b>
    <small>${el.name}</small>
   </button>
  `;
 }
 $("period").innerHTML=html;
}
