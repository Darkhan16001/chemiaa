
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>§67 — Алкандардың химиялық қасиеттері</title>

<style>
:root{
  --bg:#081827;
  --panel:#153950;
  --blue:#8bddff;
  --green:#88ecc0;
  --gold:#ffdc91;
  --red:#ffb2bb;
  --text:#f8fcff;
  --muted:#c2d8e7;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.hidden{
  display:none!important;
}

.blue{color:var(--blue)}
.green{color:var(--green)}
.gold{color:var(--gold)}
.red{color:var(--red)}
.center{text-align:center}

/* НЕГІЗГІ ЭКРАН */

.app{
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 90% 7%,
      #19759c70,
      transparent 43%
    ),
    radial-gradient(
      circle at 5% 93%,
      #16805b60,
      transparent 45%
    ),
    linear-gradient(
      125deg,
      #071625,
      #10374e,
      #081827
    );
}

.topbar{
  min-height:75px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;

  padding:10px 22px;
  background:#071d30;
  border-bottom:1px solid #73a8c5;
}

.brand{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.brand strong{
  color:var(--blue);
  font-size:29px;
  font-weight:900;
}

.brand small{
  color:var(--gold);
  font-size:13px;
  font-weight:900;
}

.topinfo{
  display:flex;
  align-items:center;
  gap:16px;
  font-weight:900;
}

#timer{
  color:var(--gold);
  font-size:31px;
  font-variant-numeric:tabular-nums;
}

#pageCount{
  color:var(--blue);
}

.main{
  flex:1;
  min-height:0;
  overflow-y:auto;

  padding:24px 35px 38px;

  scrollbar-color:#6a9fbb #132d42;
}

.slide{
  width:100%;
  max-width:1490px;
  min-height:100%;

  margin:auto;

  display:flex;
  flex-direction:column;
  justify-content:center;
}

/* МӘТІНДЕР */

h1{
  font-size:clamp(43px,4.5vw,76px);
  line-height:1.12;
  margin:9px 0 20px;
}

h2{
  font-size:clamp(32px,2.9vw,50px);
  line-height:1.2;
  margin:0 0 18px;
}

h3{
  font-size:clamp(25px,2vw,35px);
  color:var(--blue);
  margin:0 0 12px;
}

p,li{
  font-size:clamp(21px,1.7vw,29px);
  line-height:1.48;
}

li{
  margin-bottom:8px;
}

.subtitle{
  color:var(--blue);
  font-size:20px;
  font-weight:900;
  letter-spacing:1px;
  margin-bottom:13px;
}

.big{
  font-size:clamp(45px,5vw,77px);
  font-weight:900;
}

/* КАРТОЧКАЛАР */

.hero,
.grid2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  align-items:center;
  gap:18px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}

.card{
  min-width:0;
  padding:23px 25px;

  background:linear-gradient(
    145deg,
    #1c465f,
    #102c43
  );

  border:1px solid #7caeca;
  border-radius:19px;
  box-shadow:0 12px 30px #0004;
}

.card.green-card{
  background:linear-gradient(
    145deg,
    #175b48,
    #103b34
  );

  border-color:#88ebbc;
}

.card p{
  margin:9px 0;
}

/* ФОРМУЛАЛАР */

.formula{
  margin:15px 0;
  padding:19px;

  color:var(--green);
  background:#104153;

  border:1px solid #75c3d5;
  border-radius:15px;

  text-align:center;
  font-size:clamp(28px,2.7vw,46px);
  font-weight:900;
  overflow-wrap:anywhere;
}

.equation{
  margin:12px 0;
  padding:19px;

  color:var(--gold);
  background:#0a3145;

  border:1px solid #7cb9d4;
  border-radius:14px;

  font-size:clamp(25px,2.35vw,40px);
  font-weight:900;
  text-align:center;
  overflow-wrap:anywhere;
}

.note{
  margin-top:15px;
  padding:17px 20px;

  background:#1c435c;
  border-left:7px solid var(--gold);
  border-radius:12px;

  font-size:clamp(20px,1.55vw,26px);
  line-height:1.5;
}

.step{
  margin-top:8px;
  padding:10px 13px;

  background:#275168;
  border-radius:9px;

  font-size:clamp(19px,1.5vw,25px);
}

/* КӨРНЕКІ МОДЕЛЬ */

.illustration{
  min-height:265px;
  padding:20px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:15px;

  background:#123b51;
  border:1px solid #81b9d4;
  border-radius:19px;
}

.illustration svg{
  display:block;
  width:100%;
  max-width:480px;
  height:170px;
}

.illustration strong{
  color:var(--green);
  font-size:27px;
  text-align:center;
}

.illustration small{
  color:var(--muted);
  font-size:19px;
  text-align:center;
}

.chem-table{
  width:100%;
  border-collapse:collapse;
}

.chem-table th,
.chem-table td{
  padding:13px;
  border-bottom:1px solid #689dbb;

  font-size:clamp(19px,1.48vw,26px);
  text-align:left;
}

.chem-table th{
  color:var(--blue);
}

/* ТАПСЫРМАЛАР */

.task{
  padding:15px 19px;
  margin-bottom:12px;

  background:#174057;
  border:1px solid #70a5c1;
  border-radius:12px;
}

.task p{
  margin:5px 0;
}

.question{
  font-size:clamp(30px,2.85vw,47px);
  font-weight:900;
  line-height:1.43;
}

.answer{
  margin-top:15px;
  padding:19px;

  background:#10533f;
  border:1px solid #82eabd;
  border-radius:15px;

  font-size:clamp(22px,1.85vw,30px);
  line-height:1.5;
}

.answer p{
  margin:8px 0;
}

.number-tag{
  display:inline-block;
  padding:12px 21px;

  background:#69522d;
  border:2px solid var(--gold);
  border-radius:14px;

  color:var(--gold);
  font-size:clamp(26px,2.55vw,42px);
  font-weight:900;
}

.progress{
  height:13px;
  margin-top:14px;

  background:#284b60;
  border-radius:20px;
  overflow:hidden;
}

.progress div{
  height:100%;
  background:linear-gradient(
    90deg,
    #22a6d6,
    #88eabd
  );
}

.problem{
  padding:27px;
  margin-top:18px;

  background:linear-gradient(
    145deg,
    #16536c,
    #10364c
  );

  border:2px solid #83cce8;
  border-radius:19px;
}

.actions{
  margin-top:18px;
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

/* БАТЫРМАЛАР */

.btn{
  padding:12px 19px;

  background:#2a5f7b;
  color:white;

  border:1px solid #86b6d0;
  border-radius:11px;

  font-size:19px;
  font-weight:900;
}

.btn.primary{
  background:#0a91b0;
  border-color:#8ceaff;
}

.btn.success{
  background:#157d5e;
  border-color:#88ebbf;
}

.btn.warning{
  background:#946d33;
  border-color:#ffdc91;
}

/* КОМАНДАЛЫҚ ОЙЫН */

.team{
  padding:18px;

  background:#173e56;
  border:1px solid #79aac7;
  border-radius:17px;

  text-align:center;
}

.team.active{
  outline:4px solid var(--gold);
  box-shadow:0 0 25px #ffda9160;
}

.team .score{
  color:var(--gold);
  font-size:56px;
  font-weight:900;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.option{
  padding:19px 15px;

  background:#255873;
  color:white;

  border:2px solid #7eb6d0;
  border-radius:13px;

  font-size:clamp(21px,1.7vw,29px);
  font-weight:900;
  text-align:left;
}

.option.correct{
  background:#177a59;
  border-color:#9cf3cb;
}

.option.wrong{
  background:#8f4354;
  border-color:#ffb3bd;
}

.home-row{
  margin-bottom:12px;
  padding:15px 19px;

  background:#163e56;
  border-left:6px solid var(--blue);
  border-radius:12px;
}

.home-row p{
  margin:5px 0;
}

/* АСТЫҢҒЫ ПАНЕЛЬ */

.footer{
  min-height:89px;
  flex-shrink:0;

  padding:10px 22px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;

  background:#081d30;
  border-top:1px solid #6d9cba;
}

.navigation{
  display:flex;
  gap:10px;
}

.signature{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.signature strong{
  color:var(--gold);
  font-size:31px;
  font-weight:900;
  letter-spacing:3px;
}

.signature small{
  color:var(--muted);
  font-size:13px;
}

.clock{
  padding:8px 15px;

  background:#12394e;
  border:1px solid #6fa5c0;
  border-radius:12px;

  text-align:center;
}

#clock{
  display:block;
  color:var(--blue);
  font-size:27px;
  font-variant-numeric:tabular-nums;
}

.clock small{
  font-size:12px;
  color:var(--muted);
}

/* СОЛ ЖАҚТАҒЫ ҚҰРАЛДАР */

.tools{
  position:fixed;
  left:10px;
  bottom:109px;
  z-index:50;

  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:7px;
}

.tool-btn{
  padding:10px 12px;

  background:#127f9f;
  color:white;

  border:1px solid #8bdfff;
  border-radius:9px;

  font-size:13px;
  font-weight:900;
}

.tool-btn.green-btn{
  background:#177958;
  border-color:#88eabd;
}

/* ЖЫЛЖЫМАЛЫ КАЛЬКУЛЯТОР */

.calculator{
  position:fixed;
  top:105px;
  left:15px;
  z-index:1200;

  width:210px;
  max-width:calc(100vw - 12px);

  padding:8px;

  background:#103249;
  color:white;

  border:1px solid #85dfff;
  border-radius:13px;

  box-shadow:0 20px 45px #000b;

  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  cursor:grab;
}

.calculator.dragging{
  cursor:grabbing;
}

.calc-head{
  padding:7px;
  margin-bottom:7px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;

  background:#28566e;
  border-radius:8px;

  font-size:12px;
}

.close{
  padding:5px 9px;

  background:#b64959;
  color:white;

  border:0;
  border-radius:6px;
}

#calcDisplay{
  width:100%;
  height:43px;
  padding:7px;

  background:#061c2e;
  color:white;

  border:1px solid #7aadc8;
  border-radius:8px;

  font-size:19px;
  text-align:right;
  pointer-events:none;
}

.calc-grid{
  margin-top:7px;

  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
}

.calc-grid button{
  min-width:0;
  height:38px;
  padding:1px;

  background:#2b5f7b;
  color:white;

  border:1px solid #79adc6;
  border-radius:7px;

  font-size:16px;
  font-weight:900;
  touch-action:none;
}

.calc-grid button:active{
  background:#158eb0;
}

.calc-hint{
  margin-top:7px;

  color:var(--muted);
  font-size:11px;
  text-align:center;
}

/* МЕНДЕЛЕЕВ КЕСТЕСІ */

.overlay{
  position:fixed;
  inset:0;
  z-index:2000;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:12px;
  background:#000d;
}

.periodic-panel{
  width:min(1600px,99vw);
  max-height:97vh;
  overflow:auto;

  padding:17px;

  background:#0e2a40;
  border:1px solid #81afca;
  border-radius:18px;
}

.modal-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

.modal-head p{
  font-size:17px;
}

.periodic-scroll{
  overflow:auto;

  padding:12px;
  background:#061d2e;
  border-radius:12px;
}

.periodic-grid{
  min-width:1840px;

  display:grid;

  grid-template-columns:
    60px repeat(18,minmax(95px,1fr));

  grid-template-rows:
    45px repeat(10,100px);

  gap:5px;
}

.period-label,
.group-label{
  padding:4px;

  display:grid;
  place-items:center;

  background:#1b4d65;
  color:var(--gold);

  border:1px solid #75b6d2;
  border-radius:8px;

  text-align:center;
  font-weight:900;
}

.period-label.small{
  font-size:11px;
}

.element{
  position:relative;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;

  padding:12px 3px 4px;

  background:#246581;
  color:white;

  border:1px solid #91bfd6;
  border-radius:8px;
}

.element .number{
  position:absolute;
  top:4px;
  left:5px;
  font-size:12px;
}

.element .symbol{
  font-size:28px;
  font-weight:900;
}

.element .ename{
  font-size:12px;
  text-align:center;
}

.element .mass{
  font-size:12px;
  color:#dfedff;
}

.element.important{
  background:#975273;
}

.element.noble{
  background:#6953a2;
}

.element.lanth{
  background:#347d8d;
}

.element.act{
  background:#86576d;
}

.element-info{
  padding:15px;
  margin-top:12px;

  background:#194860;
  border-radius:11px;

  font-size:21px;
  line-height:1.5;
}

/* ҰЯЛЫ ТЕЛЕФОН */

@media(max-width:950px){
  .hero,
  .grid2,
  .grid3{
    grid-template-columns:1fr;
  }
}

@media(max-width:700px){
  .topbar{padding:9px}
  .brand strong{font-size:18px}
  .brand small,#sectionName{display:none}
  .topinfo{gap:8px;font-size:13px}
  #timer{font-size:21px}

  .main{padding:13px}

  h1{font-size:35px}
  h2{font-size:29px}
  h3{font-size:24px}
  p,li{font-size:19px}

  .card{padding:16px}
  .problem{padding:16px}

  .footer{
    min-height:79px;
    padding:7px;
  }

  .navigation{gap:4px}
  .signature strong{
    font-size:16px;
    letter-spacing:0;
  }
  .signature small{display:none}

  .clock{padding:5px 6px}
  #clock{font-size:16px}
  .clock small{font-size:10px}

  .btn{
    padding:8px;
    font-size:13px;
  }

  .tools{
    left:8px;
    bottom:94px;
  }

  .tool-btn{
    padding:8px;
    font-size:12px;
  }

  .options{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">

    <div class="brand">
      <strong>⚗ CHEMISTRY PRO</strong>

      <small>
        §67 · АЛКАНДАРДЫҢ ХИМИЯЛЫҚ ҚАСИЕТТЕРІ
      </small>
    </div>

    <div class="topinfo">

      <span id="sectionName">
        Кіріспе
      </span>

      <strong id="timer">
        80:00
      </strong>

      <span id="pageCount">
        1 / 1
      </span>

    </div>

  </header>

  <main id="main" class="main">
    <section id="slide" class="slide"></section>
  </main>

  <footer class="footer">

    <div class="navigation">
      <button id="prev" class="btn">
        ← Артқа
      </button>

      <button id="next" class="btn primary">
        Келесі →
      </button>
    </div>

    <div class="signature">
      <strong>BY DARKHAN</strong>
      <small id="slideTitle">§67</small>
    </div>

    <div class="clock">
      <strong id="clock">00:00:00</strong>
      <small>Алматы уақыты</small>
    </div>

  </footer>

</div>

<div class="tools">

  <button id="calcOpen" class="tool-btn">
    🧮 Калькулятор
  </button>

  <button id="tableOpen" class="tool-btn green-btn">
    ⚛ Менделеев кестесі
  </button>

</div>

<!-- КАЛЬКУЛЯТОР -->

<div id="calculator" class="calculator hidden">

  <div class="calc-head">
    <strong>🧮 Калькулятор</strong>

    <button
      id="calcClose"
      class="close"
      type="button"
    >
      ✕
    </button>
  </div>

  <input
    id="calcDisplay"
    readonly
    aria-label="Есептеу нәтижесі"
  >

  <div id="calcKeys" class="calc-grid"></div>

  <div class="calc-hint">
    Батырманы бас — есепте.
    Ұстап жылжыт — қозға.
  </div>

</div>

<!-- ПЕРИОДТЫҚ КЕСТЕ -->

<div id="periodicModal" class="overlay hidden">

  <div class="periodic-panel">

    <div class="modal-head">

      <div>
        <h2>Менделеевтің периодтық кестесі</h2>
        <p>118 элемент · 7 период · 18 топ</p>
      </div>

      <button
        id="tableClose"
        class="close"
        type="button"
      >
        ✕
      </button>

    </div>

    <div class="periodic-scroll">
      <div
        id="periodicGrid"
        class="periodic-grid"
      ></div>
    </div>

    <div
      id="elementInfo"
      class="element-info"
    >
      Элементті таңдап, мәліметін қара.
    </div>

  </div>

</div>

<script>
"use strict";

/* =========================================
   §67
   АЛКАНДАРДЫҢ ХИМИЯЛЫҚ ҚАСИЕТТЕРІ
========================================= */

/* КӨМЕКШІ ФУНКЦИЯЛАР */

const $ = id => document.getElementById(id);

function safe(value){
  return String(value).replace(
    /[&<>"']/g,
    char=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char])
  );
}

/* =========================================
   ДЕРЕКТЕРДІ САҚТАУ
========================================= */

const STORAGE_KEY="darkhan_chem67_rebuilt_v2";
const TIMER_KEY=STORAGE_KEY+"_timer";

function initialState(){
  return{
    levels:{},
    individualIndex:0,
    individualAnswer:false,
    gameIndex:0,
    chosenAnswer:null,
    scores:[0,0,0],
    homeworkAnswer:false
  };
}

let state=initialState();

try{
  const saved=JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  );

  if(
    saved &&
    Array.isArray(saved.scores) &&
    saved.scores.length===3
  ){
    state={
      ...initialState(),
      ...saved
    };
  }
}catch(error){
  console.warn(error);
}

function saveState(){
  try{
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(state)
    );
  }catch(error){
    console.warn(error);
  }
}

/* =========================================
   80 МИНУТТЫҚ ТАЙМЕР
========================================= */

const savedTime=localStorage.getItem(TIMER_KEY);

let deadline=savedTime===null
  ?null
  :Number(savedTime);

if(
  deadline!==null &&
  !Number.isFinite(deadline)
){
  deadline=null;
}

function remainingSeconds(){
  if(deadline===null){
    return 4800;
  }

  return Math.max(
    0,
    Math.ceil((deadline-Date.now())/1000)
  );
}

function updateTime(){
  const seconds=remainingSeconds();

  const minutes=String(
    Math.floor(seconds/60)
  ).padStart(2,"0");

  const rest=String(
    seconds%60
  ).padStart(2,"0");

  $("timer").textContent=
    minutes+":"+rest;

  $("timer").style.color=
    seconds===0
      ?"#ffb2bb"
      :"#ffdc91";

  $("clock").textContent=
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone:"Asia/Almaty",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hourCycle:"h23"
      }
    ).format(new Date());
}

function startTimer(){
  if(deadline!==null){
    if(remainingSeconds()>0){
      return;
    }

    alert(
      "80 минут аяқталды. " +
      "Таймерді қайта бастау үшін жаңарт."
    );

    return;
  }

  deadline=Date.now()+4800000;

  localStorage.setItem(
    TIMER_KEY,
    String(deadline)
  );

  updateTime();
  render();
}

function resetTimer(){
  if(!confirm(
    "80 минуттық таймерді қайта бастаймыз ба?"
  )){
    return;
  }

  deadline=null;

  localStorage.removeItem(TIMER_KEY);

  updateTime();
  render();
}

setInterval(updateTime,1000);

/* =========================================
   СЛАЙД ЖҮЙЕСІ
========================================= */

const slides=[];
let page=0;

function addSlide(title,section,html){
  slides.push({
    title,
    section,
    html
  });
}

function addDynamicSlide(title,section,renderer){
  slides.push({
    title,
    section,
    renderer
  });
}

function render(){
  const current=slides[page];

  if(!current)return;

  $("slide").innerHTML=current.renderer
    ?current.renderer()
    :current.html;

  $("sectionName").textContent=current.section;
  $("slideTitle").textContent=current.title;

  $("pageCount").textContent=
    `${page+1} / ${slides.length}`;

  $("prev").disabled=page===0;

  $("next").disabled=
    page===slides.length-1;

  $("main").scrollTop=0;
}

function goTo(title){
  const index=slides.findIndex(
    slide=>slide.title===title
  );

  if(index>=0){
    page=index;
    render();
  }
}

$("prev").addEventListener("click",()=>{
  if(page>0){
    page--;
    render();
  }
});

$("next").addEventListener("click",()=>{
  if(page<slides.length-1){
    page++;
    render();
  }
});

        Жауап берілгеннен кейін
        келесі командаға кезек беріледі.
      </div>
    `}
  `;
}

function chooseAnswer(index){
  if(state.chosenAnswer!==null){
    return;
  }

  state.chosenAnswer=index;

  const current=game[state.gameIndex];

  if(index===current.answer){
    const team=state.gameIndex%3;

    state.scores[team]+=10;
  }

  saveState();
  render();
}

function nextGame(){
  if(state.chosenAnswer===null){
    return;
  }

  state.gameIndex++;
  state.chosenAnswer=null;

  saveState();
  render();
}

function restartGame(){
  if(!confirm(
    "Командалық ойынды қайта бастаймыз ба?"
  )){
    return;
  }

  state.gameIndex=0;
  state.chosenAnswer=null;
  state.scores=[0,0,0];

  saveState();
  render();
}

/* КАЛЬКУЛЯТОР ЕСЕПТЕУ ЖҮЙЕСІ */

function calculate(source){
  if(!/^[0-9+\-*/(). ]+$/.test(source)){
    throw Error("Қате өрнек");
  }

  let position=0;

  function skipSpaces(){
    while(source[position]===" "){
      position++;
    }
  }

  function factor(){
    skipSpaces();

    if(source[position]==="+"){
      position++;
      return factor();
    }

    if(source[position]==="-"){
      position++;
      return -factor();
    }

    if(source[position]==="("){
      position++;

      const value=expression();

      skipSpaces();

      if(source[position]!==")"){
        throw Error("Жақша қатесі");
      }

      position++;
      return value;
    }

    const match=/^(?:\d+\.?\d*|\.\d+)/
      .exec(source.slice(position));

    if(!match){
      throw Error("Сан қатесі");
    }

    position+=match[0].length;

    return Number(match[0]);
  }

  function term(){
    let value=factor();

    while(true){
      skipSpaces();

      const operator=source[position];

      if(
        operator!=="*" &&
        operator!=="/"
      ){
        break;
      }

      position++;

      const next=factor();

      if(operator==="*"){
        value*=next;
      }else{
        value/=next;
      }
    }

    return value;
  }

  function expression(){
    let value=term();

    while(true){
      skipSpaces();

      const operator=source[position];

      if(
        operator!=="+" &&
        operator!=="-"
      ){
        break;
      }

      position++;

      const next=term();

      if(operator==="+"){
        value+=next;
      }else{
        value-=next;
      }
    }

    return value;
  }

  const result=expression();

  skipSpaces();

  if(
    position!==source.length ||
    !Number.isFinite(result)
  ){
    throw Error("Есептеу қатесі");
  }

  return Number(result.toPrecision(12));
}

function pressCalculatorKey(key){
  if(key==="C"){
    calcText="";
  }else if(key==="⌫"){
    calcText=calcText.slice(0,-1);
  }else if(key==="="){
    try{
      const normalized=calcText
        .replaceAll("×","*")
        .replaceAll("÷","/")
        .replaceAll("−","-");

      calcText=String(
        calculate(normalized)
      );
    }catch(error){
      calcText="Қате";
    }
  }else{
    if(calcText==="Қате"){
      calcText="";
    }

    calcText+=key;
  }

  calcDisplay.value=calcText;
}

function clamp(value,min,max){
  return Math.max(
    min,
    Math.min(value,max)
  );
}

function keepCalculatorInside(){
  if(calculator.classList.contains("hidden")){
    return;
  }

  const rect=calculator.getBoundingClientRect();

  calculator.style.left=clamp(
    rect.left,
    0,
    Math.max(
      0,
      window.innerWidth-rect.width
    )
  )+"px";

  calculator.style.top=clamp(
    rect.top,
    0,
    Math.max(
      0,
      window.innerHeight-rect.height
    )
  )+"px";
}

let dragState=null;

/*
  Батырманы қысқа басу:
  бір рет есептейді.

  Калькуляторды жылжыту:
  ешбір батырманы іске қоспайды.
*/

calculator.addEventListener(
  "pointerdown",
  event=>{
    if(
      event.pointerType==="mouse" &&
      event.button!==0
    ){
      return;
    }

    if(dragState!==null){
      return;
    }

    const rect=calculator.getBoundingClientRect();

    const keyButton=event.target.closest(
      "[data-key]"
    );

    dragState={
      id:event.pointerId,

      startX:event.clientX,
      startY:event.clientY,

      left:rect.left,
      top:rect.top,

      moved:false,

      key:keyButton
        ?keyButton.dataset.key
        :null
    };
  }
);

window.addEventListener(
  "pointermove",
  event=>{
    if(
      !dragState ||
      event.pointerId!==dragState.id
    ){
      return;
    }

    const dx=event.clientX-dragState.startX;
    const dy=event.clientY-dragState.startY;

    if(
      !dragState.moved &&
      Math.hypot(dx,dy)>8
    ){
      dragState.moved=true;

      calculator.classList.add(
        "dragging"
      );
    }

    if(!dragState.moved){
      return;
    }

    if(event.cancelable){
      event.preventDefault();
    }

    calculator.style.left=clamp(
      dragState.left+dx,
      0,
      Math.max(
        0,
        window.innerWidth-calculator.offsetWidth
      )
    )+"px";

    calculator.style.top=clamp(
      dragState.top+dy,
      0,
      Math.max(
        0,
        window.innerHeight-calculator.offsetHeight
      )
    )+"px";
  },
  {passive:false}
);

window.addEventListener(
  "pointerup",
  event=>{
    if(
      !dragState ||
      event.pointerId!==dragState.id
    ){
      return;
    }

    const previous=dragState;

    dragState=null;

    calculator.classList.remove(
      "dragging"
    );

    if(
      !previous.moved &&
      previous.key!==null
    ){
      pressCalculatorKey(
        previous.key
      );
    }
  }
);

window.addEventListener(
  "pointercancel",
  event=>{
    if(
      dragState &&
      event.pointerId===dragState.id
    ){
      dragState=null;

      calculator.classList.remove(
        "dragging"
      );
    }
  }
);

}

const importantElements=new Set([
  "H","C","N","O"
]);

const nobleGases=new Set([
  "He","Ne","Ar","Kr","Xe","Rn","Og"
]);

function elementClass(element){
  if(importantElements.has(element.symbol)){
    return"important";
  }

  if(nobleGases.has(element.symbol)){
    return"noble";
  }

  if(element.z>=57 && element.z<=71){
    return"lanth";
  }

  if(element.z>=89 && element.z<=103){
    return"act";
  }

  return"";
}

function buildPeriodicTable(){
  let html="";

  /* Топ нөмірлері */

  for(let group=1;group<=18;group++){
    html+=`
      <div
        class="group-label"
        style="
          grid-row:1;
          grid-column:${group+1}
        "
      >
        ${group}
      </div>
    `;
  }

  /* Период нөмірлері */

  for(let period=1;period<=7;period++){
    html+=`
      <div
        class="period-label"
        style="
          grid-row:${period+1};
          grid-column:1
        "
      >
        ${period}
      </div>
    `;
  }

  /* f-блок */

  html+=`
    <div
      class="period-label small"
      style="grid-row:10;grid-column:1"
    >
      Лантаноидтар
    </div>

    <div
      class="period-label small"
      style="grid-row:11;grid-column:1"
    >
      Актиноидтар
    </div>

    <div
      class="group-label"
      style="grid-row:7;grid-column:4"
    >
      57–71
    </div>

    <div
      class="group-label"
      style="grid-row:8;grid-column:4"
    >
      89–103
    </div>
  `;

  elements.forEach((element,index)=>{
    const position=elementPosition(element.z);

    html+=`
      <button
        class="element ${elementClass(element)}"
        data-element="${index}"
        style="
          grid-row:${position.row+1};
          grid-column:${position.col+1}
        "
      >
        <span class="number">
          ${element.z}
        </span>

        <span class="symbol">
          ${safe(element.symbol)}
        </span>

        <span class="ename">
          ${safe(element.name)}
        </span>

        <span class="mass">
          ${safe(element.mass)}
        </span>
      </button>
    `;
  });

  $("periodicGrid").innerHTML=html;
}

/* ЭЛЕМЕНТТІ ТАҢДАУ */

$("periodicGrid").addEventListener(
  "click",
  event=>{
    const button=event.target.closest(
      "[data-element]"
    );

    if(!button)return;

    const index=Number(
      button.dataset.element
    );

    const element=elements[index];

    if(!element)return;

    const position=elementPosition(element.z);

    const period=position.row===9
      ?6
      :position.row===10
        ?7
        :position.row;

    const group=position.row>7
      ?"f-блок"
      :position.col+"-топ";

    $("elementInfo").innerHTML=`
      <b class="blue">
        ${element.z}.
        ${safe(element.name)}
        (${safe(element.symbol)})
      </b>

      <div>
        ${period}-период · ${group}
      </div>

      <div>
        Атомдық масса немесе
        изотоптың массалық саны:

        <b class="gold">
          ${safe(element.mass)}
        </b>
      </div>
    `;
  }
);

/* КЕСТЕНІ АШУ / ЖАБУ */

$("tableOpen").addEventListener("click",()=>{
  $("periodicModal").classList.remove(
    "hidden"
  );
});

$("tableClose").addEventListener("click",()=>{
  $("periodicModal").classList.add(
    "hidden"
  );
});

$("periodicModal").addEventListener(
  "click",
  event=>{
    if(event.target===$("periodicModal")){
      $("periodicModal").classList.add(
        "hidden"
      );
    }
  }
);

/* =========================================
   ПЕРНЕТАҚТА БАСҚАРУЫ
========================================= */

document.addEventListener(
  "keydown",
  event=>{
    if(event.key==="Escape"){
      $("periodicModal").classList.add(
        "hidden"
      );

      calculator.classList.add(
        "hidden"
      );

      return;
    }

    if(
      event.target.closest(
        "input,textarea"
      )
    ){
      return;
    }

    if(
      !$("periodicModal").classList.contains(
        "hidden"
      )
    ){
      return;
    }

    if(
      event.key==="ArrowRight" &&
      page<slides.length-1
    ){
      page++;
      render();
    }

    if(
      event.key==="ArrowLeft" &&
      page>0
    ){
      page--;
      render();
    }
  }
);
