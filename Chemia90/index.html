
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>§90 Фенолдың қасиеттері мен қолданылуы</title>

<style>
:root{
  --bg:#071827;
  --panel:#173e56;
  --blue:#9ce4ff;
  --green:#9cf0c7;
  --gold:#ffdc95;
  --red:#ff9fae;
  --text:#f7fcff;
  --line:#7eafc9;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:"Segoe UI",Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
[hidden]{display:none!important}
.app{
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 94% 6%,#1684a477,transparent 43%),
    radial-gradient(circle at 4% 95%,#19786166,transparent 42%),
    linear-gradient(125deg,#071827,#163c53,#081c2c);
}
header,footer{
  flex-shrink:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;

  background:#081e2f;
}
header{border-bottom:1px solid var(--line)}
footer{border-top:1px solid var(--line)}
.brand{
  font-size:27px;
  font-weight:900;
  color:var(--blue);
}
.brand small{
  display:block;
  font-size:14px;
  color:var(--gold);
  margin-top:4px;
}
.status{
  display:flex;
  align-items:center;
  gap:15px;
  font-size:19px;
  font-weight:900;
}
#timer{
  color:var(--gold);
  font-size:30px;
  font-variant-numeric:tabular-nums;
}
#counter{color:var(--blue)}
#clock{
  color:var(--blue);
  font-size:22px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}
.signature{
  color:var(--gold);
  font-size:24px;
  font-weight:900;
}
main{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:24px 35px 46px;
}
.slide{
  max-width:1500px;
  min-height:100%;
  margin:auto;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
h1{
  font-size:clamp(43px,4.5vw,78px);
  line-height:1.15;
  margin:10px 0 20px;
}
h2{
  font-size:clamp(33px,3vw,53px);
  line-height:1.2;
  margin:0 0 19px;
}
h3{
  color:var(--blue);
  font-size:clamp(24px,2vw,36px);
  margin:0 0 13px;
}
p,li{
  font-size:clamp(22px,1.75vw,30px);
  line-height:1.49;
}
li{margin:8px 0}
.eyebrow{
  color:var(--blue);
  font-size:21px;
  font-weight:900;
  margin-bottom:12px;
}
.grid2,.grid3{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  align-items:center;
  gap:18px;
}
.grid3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}
.card{
  padding:24px;
  min-width:0;
  background:linear-gradient(145deg,#1c4a63,#102e46);
  border:1px solid var(--line);

.formula{
  padding:19px;

}

.warning{border-left-color:var(--red)}

.btn{
  padding:12px 18px;

.btn.primary{background:#0a8bab}
.btn.good{background:#147e60}

.actions{

  gap:10px;

.task{
  padding:15px 19px;
  margin:10px 0;

  border:1px solid #81b6d1;

}
.task p{margin:5px 0}
.answer{
  margin-top:16px;
  padding:18px;
  background:#15533f;
  border:1px solid #86eab9;
  border-radius:12px;
}
.answer p{margin:8px 0}
.big{
  font-size:clamp(31px,2.9vw,48px);
  font-weight:900;

.tag{
  display:inline-block;

  background:#705632;

  border:2px solid var(--gold);

}
.progress{
  height:14px;
  background:#32536b;

  overflow:hidden;
  margin:17px 0;
}
.progress span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#15a6d3,#94efc4);
}
.team{
  padding:17px;
  text-align:center;
  background:#1b455d;
  border:1px solid #88b8d0;
  border-radius:14px;
}
.team.active{outline:4px solid var(--gold)}
.score{

  font-weight:900;
  color:var(--gold);
}
.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;

}
.option{
  padding:19px;
  background:#2d637f;
  color:white;
  border:2px solid #8bbad0;
  border-radius:12px;
  text-align:left;
  font-size:clamp(20px,1.75vw,29px);

}
.option.correct{background:#147e5d}

.visual{

  background:#103b51;

  border-radius:17px;

}

}

}
.choice{
  display:block;
  width:100%;

  background:#2c607c;
  color:white;

  border-radius:12px;

  font-size:24px;

}
.choice.active{
  background:#14705e;

}
.choice small{
  display:block;
  margin-top:5px;

}

/* ҚҰРАЛДАР */
.tools{
  position:fixed;
  z-index:40;

  bottom:97px;

}
.tool{

/* КАЛЬКУЛЯТОР */
.calculator{
  position:fixed;
  z-index:160;
  top:105px;

  width:240px;
  max-width:calc(100vw - 12px);
  padding:10px;

#calcDisplay{

  margin:9px 0;

  background:#061c2f;

  border:1px solid #87b6cd;

.calc-keys{
  display:grid;

.calc-keys button{
  height:44px;
  min-width:0;

  border:1px solid #89b5ca;

}
.calc-hint{

  padding-top:8px;

/* МЕНДЕЛЕЕВ КЕСТЕСІ */
.overlay{
  position:fixed;
  inset:0;
  z-index:300;
  display:grid;
  place-items:center;
  background:#000e;
  padding:10px;
}
.modal{
  width:min(1560px,99vw);
  max-height:97vh;
  overflow:auto;
  padding:17px;
  background:#0e2c43;
  border:1px solid #85b8d0;

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

.period-scroll{

  padding:12px;

}

.period-label{

  flex-direction:column;

  padding:13px 2px 3px;

.element i{
  position:absolute;

.element b{font-size:26px}
.element small{font-size:10px}
.element.fblock{background:#348082}
.element.featured{background:#955571}

@media(max-width:850px){

  main{padding:13px}

  .brand small,#sectionName{display:none}
  .status{font-size:13px;gap:7px}
  #timer{font-size:20px}

  .signature{font-size:14px}
  .btn{font-size:14px;padding:9px}
  .tools{bottom:77px}
}
</style>
</head>

<body>
<div class="app">
<header>
  <div class="brand">
    ⚗ CHEMISTRY PRO
    <small>§90 · ФЕНОЛДЫҢ ҚАСИЕТТЕРІ МЕН ҚОЛДАНЫЛУЫ</small>
  </div>
  <div class="status">
    <span id="sectionName">Кіріспе</span>
    <span id="timer">80:00</span>
    <span id="counter">1 / 29</span>
  </div>
</header>

<main id="main">
  <section id="slide" class="slide"></section>
</main>

<footer>
  <div class="actions" style="margin:0">
    <button class="btn" id="prev">← Артқа</button>
    <button class="btn primary" id="next">Келесі →</button>
  </div>
  <strong class="signature">BY DARKHAN</strong>
  <span id="clock">00:00:00</span>
</footer>
</div>

<div class="tools">
  <button id="showCalc" class="tool">🧮 Калькулятор</button>
  <button id="showTable" class="tool">⚛ Менделеев кестесі</button>
</div>

<div id="calculator" class="calculator" hidden>
  <div class="calc-head">
    <strong>🧮 Калькулятор</strong>
    <button id="closeCalc">✕</button>
  </div>
  <input id="calcDisplay" readonly>
  <div id="calcKeys" class="calc-keys"></div>
  <div class="calc-hint">Жоғарғы панельден жылжыт</div>
</div>

<div id="tableOverlay" class="overlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2>Менделеев кестесі</h2>
      <button id="closeTable" class="btn">Жабу ✕</button>
    </div>
    <p>118 элемент · 18 топ · 7 период</p>
    <div class="period-scroll">
      <div class="period" id="period"></div>
    </div>
    <div id="elementInfo">Элементті таңда.</div>
  </div>
</div>

<script>
"use strict";

/* 1. СЛАЙД ЖҮЙЕСІ */

const $=id=>document.getElementById(id);
const slides=[];
let page=0;

function add(title,section,html){
  slides.push({title,section,html});
}
function dynamic(title,section,render){
  slides.push({title,section,render});
}
function draw(){
  const s=slides[page];
  if(!s)return;

  $("slide").innerHTML=s.render?s.render():s.html;
  $("sectionName").textContent=s.section;
  $("counter").textContent=
    `${page+1} / ${slides.length}`;

  $("prev").disabled=page===0;
  $("next").disabled=page===slides.length-1;
  $("main").scrollTop=0;
}
function go(title){
  const n=slides.findIndex(s=>s.title===title);
  if(n>=0){
    page=n;
    draw();
  }
}
$("prev").onclick=()=>{
  if(page>0){page--;draw();}
};
$("next").onclick=()=>{
  if(page<slides.length-1){page++;draw();}
};

/* 2. ПРОГРЕСТІ САҚТАУ */

const STORE="darkhan_chem90_phenol_v1";

function fresh(){
  return{
    visual:0,
    levels:{},
    oral:0,
    oralShow:false,
    game:0,
    choice:null,
    scores:[0,0,0],
    home:false
  };
}

let state=fresh();

try{
  const saved=JSON.parse(
    localStorage.getItem(STORE)
  );
  if(
    saved &&
    Array.isArray(saved.scores) &&
    saved.scores.length===3
  ){
    state={...fresh(),...saved};
  }
}catch(error){
  console.warn(error);
}

function save(){
  try{
    localStorage.setItem(
      STORE,
      JSON.stringify(state)
    );
  }catch(error){
    console.warn(error);
  }
}

/* 3. ФЕНОЛ СЫЗБАСЫ */

function phenolPicture(){
  return `
    <div class="visual">
      <svg viewBox="0 0 560 260">
        <polygon
          points="
            195,38 274,82 274,170
            195,214 116,170 116,82"
          fill="none"
          stroke="#9ce4ff"
          stroke-width="5"
        />

        <circle
          cx="195" cy="126" r="63"
          fill="none"
          stroke="#9ce4ff"
          stroke-width="3"
          opacity=".65"
        />

        <line
          x1="274" y1="82"
          x2="351" y2="45"
          stroke="#9cf0c7"
          stroke-width="5"
        />

        <circle
          cx="390" cy="29" r="40"
          fill="#17705d"
          stroke="#9cf0c7"
          stroke-width="4"
        />

        <g fill="white" font-size="30"
          font-weight="bold" text-anchor="middle">
          <text x="390" y="39">OH</text>
        </g>

        <g fill="#ffdc95" font-size="21"
          text-anchor="middle" font-weight="bold">
          <text x="190" y="251">Ароматты сақина</text>
          <text x="430" y="104">Гидроксил тобы</text>
        </g>
      </svg>
      <strong>Фенол — C₆H₅OH</strong>
      <p>
        Сақина мен гидроксил тобы
        фенолдың химиялық қасиеттеріне әсер етеді.
      </p>
    </div>
  `;
}

/* 4. КІРІСПЕ */

dynamic("Кіріспе","Кіріспе · 5 минут",()=>`
  <div class="grid2">
    <div>
      <div class="eyebrow">
        §90 · ОРГАНИКАЛЫҚ ХИМИЯ
      </div>

      <h1>Фенолдың қасиеттері мен қолданылуы</h1>

      <p>
        Фенолдың әлсіз қышқылдық қасиеті,
        феноляттардың түзілуі,
        ароматты сақинадағы өзгерістер,
        фенолдық шайырлар,
        қолданылуы және экология.
      </p>

      <div class="formula">
        C₆H₅OH
      </div>

      <div class="actions">
        <button class="btn good" data-act="start">
          ▶ Сабақты бастау
        </button>

        <button class="btn gold" data-act="reset-time">
          ↺ Таймерді жаңарту
        </button>
      </div>
    </div>

    ${phenolPicture()}
  </div>
`);

add("Сабақ мақсаты","Кіріспе",`
  <h2>Сабақтың мақсаты</h2>

  <div class="grid2">
    <div class="card">
      <h3>Білімдік мақсат</h3>
      <p>
        Фенолдың молекулалық құрылысын,
        қышқылдық қасиетін,
        феноляттардың түзілуін,
        ароматты сақинаға тән өзгерістерді
        және қолданылуын түсіну.
      </p>
    </div>

    <div class="card">
      <h3>Практикалық мақсат</h3>
      <p>
        Теориялық реакция теңдеулерін
        талдау, өнімдерді анықтау,
        спиртпен салыстыру,
        молярлық массаға есептер шығару
        және экологиялық қауіптерді бағалау.
      </p>
    </div>
  </div>

  <div class="note">
    <p>
      80 минут: кіріспе — 5,
      түсіндірме — 20,
      конспект — 8,
      деңгейлік жұмыс — 10,
      жеке жұмыс — 20,
      командалық ойын — 12,
      қорытынды — 5 минут.
    </p>
  </div>
`);

/* 5. 15 ТЕОРИЯЛЫҚ БЕТ */

const theory=[
 [
  "Фенолдың құрылысын қайталау",
  "Фенол — гидроксил тобы ароматты сақинамен тікелей байланысқан органикалық қосылыс. Оның қысқаша формуласы C₆H₅OH. Фенол молекуласының химиялық қасиеттері гидроксил тобы мен ароматты жүйенің өзара электрондық әсерімен байланысты.",
  "C₆H₅OH",
  "Фенолдағы –OH тобы ароматты сақинаға тікелей байланысқан."
 ],
 [
  "Фенолдың молярлық массасы",
  "Фенолдың молекулалық формуласы C₆H₆O. Ондағы көміртектің салыстырмалы массаларының қосындысы 72, сутектің массасы 6, оттектің массасы 16 болады. Барлығын қосқанда фенолдың молярлық массасы 94 г/моль.",
  "M(C₆H₆O)=94 г/моль",
  "Фенолдың бір молінің массасы — 94 грамм."
 ],
 [
  "Фенолдың физикалық күйі",
  "Таза фенол қалыпты бөлме температурасында кристалды қатты зат болуы мүмкін. Оның физикалық қасиеттері молекулалық құрылымына тәуелді. Фенолдың уыттылығы және күйдіргіш әсері бар, сондықтан оны жай тұрмыстық зат деп қарастыруға болмайды.",
  "Кристалды · Уытты",
  "Фенолмен байланысты тәжірибелер арнайы қауіпсіздік шараларын талап етеді."
 ],

$("slide").addEventListener("click",event=>{
  const b=event.target.closest("[data-act]");
  if(!b)return;

  const action=b.dataset.act;
  const i=Number(b.dataset.i);

  switch(action){
    case "start":
      startTimer();
      break;

    case "reset-time":
      resetTimer();
      break;

    case "visual":
      state.visual=i;
      break;

    case "level":
      state.levels[i]=!state.levels[i];
      break;

    case "oral-show":
      state.oralShow=!state.oralShow;
      break;

    case "oral-next":
      state.oral=Math.min(
        oral.length,state.oral+1
      );
      state.oralShow=false;
      break;

    case "oral-reset":
      state.oral=0;
      state.oralShow=false;
      break;

    case "to-game":
      go("Командалық ойын");
      break;

    case "answer":
      if(state.choice!==null)return;
      if(i<0||i>3)return;

      state.choice=i;

      if(i===quiz[state.game][2]){
        state.scores[state.game%3]+=10;
      }
      break;

    case "game-next":
      if(state.choice===null)return;
      state.game++;
      state.choice=null;
      break;

    case "game-reset":
      state.game=0;
      state.choice=null;
      state.scores=[0,0,0];
      break;

    case "home":
      state.home=!state.home;
      break;
  }

  save();
  draw();
});

const TIMER_KEY=STORE+"_timer";
let deadline=null;

try{
  const saved=localStorage.getItem(TIMER_KEY);

  if(
    saved!==null &&
    Number.isFinite(Number(saved))
  ){
    deadline=Number(saved);
  }
}catch(error){
  console.warn(error);
}

function tick(){
  const seconds=deadline===null
    ?4800
    :Math.max(
        0,
        Math.ceil(
          (deadline-Date.now())/1000
        )
      );

  $("timer").textContent=
    String(Math.floor(seconds/60))
      .padStart(2,"0")+
    ":"+
    String(seconds%60).padStart(2,"0");

  $("clock").textContent=
    new Intl.DateTimeFormat("en-GB",{
      timeZone:"Asia/Almaty",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hourCycle:"h23"
    }).format(new Date());
}

function startTimer(){
  if(deadline!==null){
    alert("Таймер іске қосылған.");
    return;
  }

  deadline=Date.now()+4800000;

  try{
    localStorage.setItem(
      TIMER_KEY,String(deadline)
    );
  }catch(error){
    console.warn(error);
  }

  tick();
}

function resetTimer(){
  if(!confirm(
    "80 минуттық таймерді жаңартамыз ба?"
  ))return;

  deadline=null;

  try{
    localStorage.removeItem(TIMER_KEY);
  }catch(error){
    console.warn(error);
  }

  tick();
}

setInterval(tick,1000);

const keys=[
  "7","8","9","/",
  "4","5","6","*",
  "1","2","3","-",
  "C","0",".","+",
  "(",")","⌫","="
];

$("calcKeys").innerHTML=keys.map(k=>`
  <button type="button" data-key="${k}">
    ${k==="/"?"÷":k==="*"?"×":k}
  </button>
`).join("");

let calcText="";

function calculate(input){
  let i=0;

  function factor(){
    if(input[i]==="+"){
      i++;
      return factor();
    }

    if(input[i]==="-"){
      i++;
      return -factor();
    }

    if(input[i]==="("){
      i++;
      const value=sum();

      if(input[i]!==")"){
        throw Error("Жақша қатесі");
      }

      i++;
      return value;
    }

    const match=/^(?:\d+\.?\d*|\.\d+)/
      .exec(input.slice(i));

    if(!match){
      throw Error("Сан қатесі");
    }

    i+=match[0].length;
    return Number(match[0]);
  }

  function product(){
    let value=factor();

    while(
      input[i]==="*" ||
      input[i]==="/"
    ){
      const op=input[i++];
      const next=factor();

      value=op==="*"
        ?value*next
        :value/next;
    }

    return value;
  }

  function sum(){
    let value=product();

    while(
      input[i]==="+" ||
      input[i]==="-"
    ){
      const op=input[i++];
      const next=product();

      value=op==="+"
        ?value+next
        :value-next;
    }

    return value;
  }

  if(!/^[0-9+*/().-]+$/.test(input)){
    throw Error("Таңба қатесі");
  }

  const result=sum();

  if(
    i!==input.length ||
    !Number.isFinite(result)
  ){
    throw Error("Өрнек қатесі");
  }

  return Number(result.toPrecision(12));
}

$("calcKeys").addEventListener("click",event=>{
  const b=event.target.closest("[data-key]");
  if(!b)return;

  const k=b.dataset.key;

  if(k==="C"){
    calcText="";
  }else if(k==="⌫"){
    calcText=calcText.slice(0,-1);
  }else if(k==="="){
    try{
      calcText=String(calculate(calcText));
    }catch(error){
      calcText="Қате";
    }
  }else{
    if(calcText==="Қате"){
      calcText="";
    }
    calcText+=k;
  }

  $("calcDisplay").value=calcText;
});

/* 16. КАЛЬКУЛЯТОРДЫ ЖЫЛЖЫТУ */

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function fitCalculator(){
  if(calculator.hidden)return;

  const r=calculator.getBoundingClientRect();

  calculator.style.left=clamp(
    r.left,
    0,
    Math.max(0,innerWidth-r.width)
  )+"px";

  calculator.style.top=clamp(
    r.top,
    0,
    Math.max(0,innerHeight-r.height)
  )+"px";
}

let drag=null;
let suppressUntil=0;

calculator.querySelector(".calc-head")
.addEventListener("pointerdown",event=>{
  if(event.target.closest("button"))return;
  if(drag)return;

  if(
    event.pointerType==="mouse" &&
    event.button!==0
  )return;

  const r=calculator.getBoundingClientRect();

  drag={
    id:event.pointerId,
    x:event.clientX,
    y:event.clientY,
    left:r.left,
    top:r.top,
    moved:false
  };

  calculator.setPointerCapture(event.pointerId);
});

calculator.addEventListener("pointermove",event=>{
  if(
    !drag ||
    drag.id!==event.pointerId
  )return;

  const dx=event.clientX-drag.x;
  const dy=event.clientY-drag.y;

  if(Math.hypot(dx,dy)>6){
    drag.moved=true;
  }

  if(!drag.moved)return;

  calculator.classList.add("dragging");

  calculator.style.left=clamp(
    drag.left+dx,
    0,
    Math.max(
      0,
      innerWidth-calculator.offsetWidth
    )
  )+"px";

  calculator.style.top=clamp(
    drag.top+dy,
    0,
    Math.max(
      0,
      innerHeight-calculator.offsetHeight
    )
  )+"px";
});

calculator.addEventListener("pointerup",event=>{
  if(
    !drag ||
    drag.id!==event.pointerId
  )return;

  if(drag.moved){
    suppressUntil=performance.now()+300;
  }

  drag=null;
  calculator.classList.remove("dragging");

  if(
    calculator.hasPointerCapture(
      event.pointerId
    )
  ){
    calculator.releasePointerCapture(
      event.pointerId
    );
  }
});

calculator.addEventListener("pointercancel",()=>{
  drag=null;
  calculator.classList.remove("dragging");
});

calculator.addEventListener("click",event=>{
  if(performance.now()>suppressUntil)return;

  event.preventDefault();
  event.stopImmediatePropagation();
  suppressUntil=0;
},true);

window.addEventListener("resize",fitCalculator);

const elements=elementData.trim()
  .split(/\s+/)
  .map((entry,i)=>{
    const [symbol,name]=entry.split("|");
    return{z:i+1,symbol,name};
  });

const rowGroups=[
  [1,18],
  [1,2,13,14,15,16,17,18],
  [1,2,13,14,15,16,17,18],
  Array.from({length:18},(_,i)=>i+1),
  Array.from({length:18},(_,i)=>i+1)
];

function position(z){
  if(z<=54){
    let k=z-1;

    for(let p=0;p<5;p++){
      if(k<rowGroups[p].length){
        return{
          row:p+1,
          col:rowGroups[p][k]
        };
      }
      k-=rowGroups[p].length;
    }
  }

  if(z<=56)return{row:6,col:z-54};
  if(z<=71)return{row:9,col:z-53};
  if(z<=86)return{row:6,col:z-68};
  if(z<=88)return{row:7,col:z-86};
  if(z<=103)return{row:10,col:z-85};

  return{row:7,col:z-100};
}

function buildTable(){
  let html="";

  for(let g=1;g<=18;g++){
    html+=`
      <span class="period-label"
        style="
          grid-row:1;
          grid-column:${g+1}
        ">
        ${g}
      </span>
    `;
  }

  for(let p=1;p<=7;p++){
    html+=`
      <span class="period-label"
        style="
          grid-row:${p+1};
          grid-column:1
        ">
        ${p}
      </span>
    `;
  }

  html+=`
    <span class="period-label"
      style="grid-row:10;grid-column:1">La–Lu</span>
    <span class="period-label"
      style="grid-row:11;grid-column:1">Ac–Lr</span>
    <span class="period-label"
      style="grid-row:7;grid-column:4">57–71</span>
    <span class="period-label"
      style="grid-row:8;grid-column:4">89–103</span>
  `;

  for(const el of elements){
    const p=position(el.z);

    const f=
      (el.z>=57&&el.z<=71) ||
      (el.z>=89&&el.z<=103);

    const special=
      ["H","C","O","Na"].includes(
        el.symbol
      );

    html+=`
      <button
        class="element ${
          f?"fblock":
          special?"featured":""
        }"
        data-z="${el.z}"
        style="
          grid-row:${p.row+1};
          grid-column:${p.col+1}
        ">
        <i>${el.z}</i>
        <b>${el.symbol}</b>
        <small>${el.name}</small>
      </button>
    `;
  }

  $("period").innerHTML=html;
}

$("period").addEventListener("click",event=>{
  const b=event.target.closest("[data-z]");
  if(!b)return;

  const z=Number(b.dataset.z);
  const el=elements[z-1];
  const p=position(z);

  const period=p.row===9?6:p.row===10?7:p.row;
  const group=p.row>7?"f-блок":p.col+"-топ";

  $("elementInfo").textContent=
    `${z}. ${el.name} (${el.symbol}) · `+
    `${period}-период · ${group}`;
});

$("showTable").onclick=()=>{
  $("tableOverlay").hidden=false;
};

$("closeTable").onclick=()=>{
  $("tableOverlay").hidden=true;
};

$("tableOverlay").onclick=event=>{
  if(event.target===$("tableOverlay")){
    $("tableOverlay").hidden=true;
  }
};

/* 18. ПЕРНЕТАҚТАМЕН БАСҚАРУ */

document.addEventListener("keydown",event=>{
  if(event.key==="Escape"){
    $("tableOverlay").hidden=true;
    calculator.hidden=true;
    return;
  }

  if(!$("tableOverlay").hidden)return;

  if(event.target.closest("input,textarea")){
    return;
  }

  if(
    event.key==="ArrowRight" &&
    page<slides.length-1
  ){
    page++;
    draw();
  }else if(
    event.key==="ArrowLeft" &&
    page>0
  ){
    page--;
    draw();
  }
});
