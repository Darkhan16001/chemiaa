
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>§82 Таскөмірді кокстеу — CHEMISTRY PRO</title>
<style>
:root{
 --bg:#071827;--card:#173e56;
 --cyan:#96e2ff;--mint:#94efc2;
 --gold:#ffdc94;--white:#f7fcff;
 --line:#7aabc6;
}
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 background:var(--bg);color:var(--white);
 font-family:"Segoe UI",Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
[hidden]{display:none!important}
.app{
 height:100vh;height:100dvh;
 display:flex;flex-direction:column;
 background:
 radial-gradient(circle at 90% 8%,#167c9d70,transparent 44%),
 radial-gradient(circle at 5% 93%,#1a77585a,transparent 43%),
 linear-gradient(130deg,#071827,#153d53,#081c2d);
}
header,footer{
 flex-shrink:0;
 display:flex;align-items:center;
 justify-content:space-between;gap:12px;
 background:#081d2e;padding:12px 20px;
}
header{border-bottom:1px solid var(--line)}
footer{border-top:1px solid var(--line)}
.brand{
 font-size:27px;font-weight:900;color:var(--cyan)
}
.brand small{
 display:block;margin-top:4px;
 font-size:14px;color:var(--gold)
}
.status{
 display:flex;align-items:center;
 gap:15px;font-size:18px;font-weight:900
}
#timer{
 font-size:29px;color:var(--gold);
 font-variant-numeric:tabular-nums
}
#counter{color:var(--cyan)}
#clock{
 color:var(--cyan);font-size:22px;
 font-weight:900;font-variant-numeric:tabular-nums
}
.signature{
 color:var(--gold);font-size:24px;font-weight:900
}
main{
 flex:1;min-height:0;overflow-y:auto;
 padding:24px 35px 42px
}
.slide{
 max-width:1480px;min-height:100%;margin:auto;
 display:flex;flex-direction:column;
 justify-content:center
}
h1{
 font-size:clamp(43px,4.5vw,76px);
 line-height:1.15;margin:10px 0 20px
}
h2{
 font-size:clamp(32px,3vw,51px);
 line-height:1.2;margin:0 0 20px
}
h3{
 color:var(--cyan);
 font-size:clamp(24px,2vw,35px);
 margin:0 0 13px
}
p,li{
 font-size:clamp(21px,1.7vw,29px);
 line-height:1.5
}
li{margin:8px 0}
.eyebrow{
 font-size:21px;color:var(--cyan);
 font-weight:900;margin-bottom:12px
}
.grid2,.grid3,.grid4{
 display:grid;gap:17px;align-items:center;
 grid-template-columns:repeat(2,minmax(0,1fr))
}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{
 min-width:0;
 padding:23px;
 background:linear-gradient(145deg,#1c4962,#102e45);
 border:1px solid var(--line);border-radius:17px
}
.card p{margin:9px 0}
.formula{
 margin:15px 0;padding:19px;
 color:var(--mint);background:#104653;
 border:1px solid #82d0c5;border-radius:14px;
 text-align:center;
 font-size:clamp(26px,2.55vw,43px);
 font-weight:900;overflow-wrap:anywhere
}
.note{
 background:#20465e;border-left:6px solid var(--gold);
 border-radius:11px;padding:17px 21px;
 margin-top:16px
}
.note p{margin:7px 0}
.btn{
 background:#29607d;color:#fff;
 border:1px solid #88b9d0;
 padding:12px 18px;border-radius:10px;
 font-size:18px;font-weight:900
}
.btn.primary{background:#0b8bad}
.btn.good{background:#137f5c}
.btn.gold{background:#926a34}
.actions{
 display:flex;flex-wrap:wrap;gap:10px;
 margin-top:18px
}
.task{
 background:#1b435b;border:1px solid #77adc9;
 border-radius:11px;margin:10px 0;
 padding:14px 19px
}
.task p{margin:5px 0}
.answer{
 background:#15523e;border:1px solid #85ebba;
 border-radius:12px;padding:18px;margin-top:16px
}
.answer p{margin:8px 0}
.big{
 font-size:clamp(30px,2.8vw,46px);
 font-weight:900;line-height:1.42
}
.tag{
 display:inline-block;
 padding:12px 20px;
 background:#6e5530;color:var(--gold);
 border:2px solid var(--gold);
 border-radius:12px;font-size:29px;font-weight:900
}
.progress{
 height:13px;background:#31536b;
 border-radius:20px;overflow:hidden;margin:17px 0
}
.progress span{
 display:block;height:100%;
 background:linear-gradient(90deg,#18a7d4,#97efc2)
}
.team{
 background:#19445c;border:1px solid #85b4ce;
 border-radius:14px;padding:17px;text-align:center
}
.team.active{outline:4px solid var(--gold)}
.score{
 font-size:55px;color:var(--gold);font-weight:900
}
.options{
 display:grid;grid-template-columns:1fr 1fr;
 gap:12px;margin-top:16px
}
.option{
 padding:18px;text-align:left;
 background:#2b617d;color:white;
 border:2px solid #86b8d0;border-radius:11px;
 font-size:clamp(20px,1.7vw,29px);
 font-weight:900
}
.option.correct{background:#147d5b}
.option.wrong{background:#96465c}
.visual{
 padding:19px;background:#103b50;
 border:1px solid #82bad1;border-radius:17px;
 text-align:center
}
.visual svg{width:100%;height:245px}
.visual strong{font-size:30px;color:var(--mint)}
.product-button{
 width:100%;text-align:left;padding:16px 19px;
 margin:6px 0;
 background:#285b77;color:white;
 border:2px solid #8dbbd1;border-radius:12px;
 font-weight:900;font-size:24px
}
.product-button.active{
 background:#136e61;border-color:var(--gold)
}
.product-button small{
 display:block;color:#d9ecf5;

/* ҚҰРАЛДАР */

.tools{
 position:fixed;left:10px;bottom:99px;
 z-index:35;display:flex;flex-direction:column;
 align-items:flex-start;gap:8px
}
.tool{
 background:#0a819f;color:white;
 border:1px solid #8cdef0;border-radius:8px;
 padding:11px 13px;font-size:13px;font-weight:900
}

/* КАЛЬКУЛЯТОР */

.calculator{
 position:fixed;top:105px;left:16px;z-index:150;
 width:234px;max-width:calc(100vw - 12px);
 padding:10px;background:#113149;
 border:2px solid #90def6;border-radius:15px;
 box-shadow:0 18px 45px #000a;
 touch-action:none;user-select:none;
 -webkit-user-select:none;cursor:grab

.calculator.dragging{cursor:grabbing}
.calculator *{touch-action:none}
.calc-head{
 display:flex;justify-content:space-between;

 background:#295970;padding:8px;
 border-radius:8px;font-size:13px

.calc-head button{
 background:#a8495b;color:white;
 border:0;border-radius:6px;padding:5px 9px
}
#calcDisplay{
 width:100%;height:47px;margin:9px 0;
 padding:7px;text-align:right;
 background:#061e31;color:white;
 border:1px solid #87b4cb;border-radius:8px;
 font-size:22px;pointer-events:none
}
.calc-keys{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:5px
}
.calc-keys button{
 height:44px;min-width:0;padding:0;
 color:white;background:#2d657f;
 border:1px solid #88b7cf;
 border-radius:7px;font-size:17px
}
.calc-hint{
 text-align:center;color:#c8dce8;
 font-size:11px;padding-top:8px
}

/* МЕНДЕЛЕЕВ КЕСТЕСІ */

.overlay{
 position:fixed;inset:0;z-index:300;
 display:grid;place-items:center;
 padding:10px;background:#000e
}
.modal{
 width:min(1550px,99vw);max-height:97vh;
 overflow:auto;padding:16px;
 background:#0d2d44;border:1px solid #86b6d0;
 border-radius:15px
}
.modal-head{
 display:flex;justify-content:space-between;
 align-items:center;gap:12px
}
.period-scroll{
 overflow:auto;padding:12px;
 background:#071c2e;border-radius:11px
}
.period{
 display:grid;
 grid-template-columns:65px repeat(18,89px);
 grid-template-rows:38px repeat(10,89px);
 gap:4px;width:max-content
}
.period-label{
 display:grid;place-items:center;
 background:#1b4861;color:var(--gold);
 border:1px solid #7aa9c0;border-radius:6px;
 font-size:12px;font-weight:900;text-align:center
}
.element{
 position:relative;display:flex;
 align-items:center;justify-content:center;
 flex-direction:column;gap:3px;
 padding:13px 2px 3px;
 color:white;background:#2a627b;
 border:1px solid #87b7d0;border-radius:6px

.element i{

 font-size:11px;font-style:normal
}
.element b{font-size:26px}
.element small{font-size:11px}
.element.fblock{background:#337e83}
.element.featured{background:#955572}
#elementInfo{
 margin-top:12px;padding:15px;
 background:#1b4960;border-radius:10px;
 font-size:20px
}
@media(max-width:850px){
 .grid2,.grid3,.grid4,.options{
  grid-template-columns:1fr
 }
 main{padding:13px}
 header,footer{padding:8px}
 .brand{font-size:18px}
 .brand small,#sectionName{display:none}
 .status{gap:7px;font-size:13px}
 #timer{font-size:20px}
 #clock{font-size:16px}
 .signature{font-size:15px}
 .btn{padding:9px;font-size:14px}
 .tools{bottom:78px}
}
</style>
</head>
<body>

<div class="app">
<header>
 <div class="brand">
  ⚗ CHEMISTRY PRO
  <small>§82 · ТАСКӨМІРДІ КОКСТЕУ</small>

  <span id="sectionName">Кіріспе</span>
  <span id="timer">80:00</span>
  <span id="counter">1 / 29</span>

</header>

<main id="main">
 <section class="slide" id="slide">

 </section>
</main>

  </div>
  <p style="font-size:17px">
   118 элемент · 18 топ · 7 период
  </p>
  <div class="period-scroll">
   <div id="period" class="period"></div>

  <div id="elementInfo">Элементті таңда.</div>
 </div>

<script>
"use strict";

/* 1. СЛАЙД ЖҮЙЕСІ */

const $=id=>document.getElementById(id);
const slides=[];
let page=0;

function add(title,section,html){
 slides.push({title,section,html});
}
function dynamic(title,section,render){
 slides.push({title,section,render});
}
function draw(){
 const s=slides[page];
 if(!s)return;
 $("slide").innerHTML=s.render?s.render():s.html;
 $("sectionName").textContent=s.section;
 $("counter").textContent=
  `${page+1} / ${slides.length}`;
 $("prev").disabled=page===0;
 $("next").disabled=page===slides.length-1;
 $("main").scrollTop=0;
}
function go(title){
 const i=slides.findIndex(s=>s.title===title);
 if(i>=0){page=i;draw();}
}
$("prev").onclick=()=>{
 if(page>0){page--;draw();}
};
$("next").onclick=()=>{
 if(page<slides.length-1){page++;draw();}
};

/* 2. ПРОГРЕСТІ САҚТАУ */

const STORE="darkhan_chem82_coking_v1";

function fresh(){
 return{
  levels:{},
  oral:0,
  oralShow:false,
  game:0,
  choice:null,
  scores:[0,0,0],
  home:false,
  product:0
 };
}
let state=fresh();

try{
 const old=JSON.parse(localStorage.getItem(STORE));
 if(old&&Array.isArray(old.scores)&&old.scores.length===3){
  state={...fresh(),...old};
 }
}catch(error){
 console.warn(error);
}

function save(){
 try{
  localStorage.setItem(STORE,JSON.stringify(state));
 }catch(error){
  console.warn(error);
 }
}

/* 3. КӨРНЕКІ СЫЗБА */

function diagram(){
 return `
  <div class="visual">
   <svg viewBox="0 0 560 240">
    <rect x="10" y="74" width="130" height="96"
     rx="14" fill="#1e455c"
     stroke="#96e2ff" stroke-width="3"/>

    <path d="M30 130 L47 91 L91 88
     L119 128 L97 153 L52 156Z"
     fill="#14181d"
     stroke="#829eb2" stroke-width="3"/>

    <path d="M146 120 H195
     M182 107 L197 120 L182 133"
     fill="none" stroke="#ffdc94"
     stroke-width="5"/>

    <rect x="210" y="65" width="120" height="116"
     rx="14" fill="#275267"
     stroke="#96efc4" stroke-width="3"/>

    <g fill="#fff" font-size="21"
     text-anchor="middle">
     <text x="270" y="113">Өнеркәсіптік</text>
     <text x="270" y="140">өңдеу</text>
    </g>

    <path d="M334 120 H380
     M367 107 L381 120 L367 133"
     fill="none" stroke="#ffdc94"
     stroke-width="5"/>

    <rect x="394" y="18" width="157" height="205"
     rx="14" fill="#1c4660"
     stroke="#96e2ff" stroke-width="3"/>

    <g fill="#96efc4"
     text-anchor="middle" font-size="20">
     <text x="472" y="57">Кокс</text>
     <text x="472" y="99">Кокс газы</text>
     <text x="472" y="141">Шайыр</text>
     <text x="472" y="184">Басқа өнімдер</text>
    </g>
   </svg>
   <strong>Таскөмір → Кокстеу өнімдері</strong>
   <p>Процестің оқу мақсатындағы сызбасы</p>
  </div>
 `;
}

/* 4. КІРІСПЕ */

dynamic("Кіріспе","Кіріспе · 5 минут",()=>`
 <div class="grid2">
  <div>
   <div class="eyebrow">
    §82 · ОРГАНИКАЛЫҚ ХИМИЯ
   </div>

   <h1>Таскөмірді кокстеу</h1>

   <p>
    Таскөмірдің құрамын,
    кокстеудің мәнін, негізгі
    өнімдерін, өндірістік маңызын
    және экологиялық әсерін үйренеміз.
   </p>

   <div class="formula">
    Таскөмір → Кокс + Жанама өнімдер
   </div>

   <div class="actions">
    <button class="btn good" data-action="start">
     ▶ Сабақты бастау
    </button>

    <button class="btn gold" data-action="reset-time">
     ↺ Таймерді жаңарту
    </button>
   </div>
  </div>

  ${diagram()}
 </div>
`);

add("Сабақ мақсаты","Кіріспе",`
 <h2>Сабақтың мақсаты</h2>

 <div class="grid2">
  <div class="card">
   <h3>Теориялық мақсат</h3>
   <p>
    Таскөмірдің күрделі құрамын,
    кокстеу процесінің мәнін,
    кокс пен жанама өнімдердің
    ерекшелігін және олардың
    қолданылуын түсіну.
   </p>
  </div>

  <div class="card">
   <h3>Практикалық мақсат</h3>
   <p>
    Өнімдерді салыстыру,
    кокстеудің жанудан айырмасын
    түсіндіру, көміртекке қатысты
    химиялық теңдеулерді талдау
    және есептер шығару.
   </p>
  </div>
 </div>

 <div class="note">
  <p>
   80 минут: кіріспе — 5;
   теория — 20; конспект — 8;
   деңгейлік тапсырмалар — 10;
   жеке жұмыс — 20; командалық ойын — 12;
   қорытынды — 5 минут.
  </p>
 </div>
`);

/* 5. 15 ТҮСІНДІРМЕ */

const theory=[
 [
  "Таскөмір дегеніміз не?",
  "Таскөмір — ежелгі өсімдік қалдықтарының ұзақ геологиялық өзгеруі нәтижесінде түзілген қатты қазба. Оның құрамында көміртекке бай күрделі органикалық құрылымдар, сондай-ақ басқа элементтер мен минералдық қоспалар болады. Сондықтан таскөмірдің бір ғана молекулалық формуласы жоқ.",
  "Таскөмір — күрделі қатты қазба",
  "Таскөмір таза көміртек те, бір ғана көмірсутек те емес."
 ],
 [
  "Таскөмірдің құрамы",
  "Таскөмірдің құрамында көміртекпен қатар сутек, оттек, күкірт, азот және минералдық компоненттер кездесуі мүмкін. Әртүрлі көмір кен орындарының құрамы бірдей емес. Көмірдің қасиеттері оның пайда болу жағдайына және құрамындағы компоненттерге тәуелді.",
  "C · H · O · N · S",
  "Таскөмір құрамында бірнеше химиялық элемент болады."
 ],
 [
  "Кокстеу дегеніміз не?",
  "Кокстеу — таскөмірді ауаның қатысуын шектеген жағдайда өнеркәсіптік термиялық өңдеу процесі. Мұнда көмірдің органикалық құрылымдары өзгеріп, қатты көміртекке бай кокс және әртүрлі жанама өнімдер түзіледі. Бұл процесс қарапайым жанумен бірдей емес.",
  "Көмір → Кокс + Газ + Басқа өнімдер",
  "Кокстеу — өнеркәсіптік химиялық өңдеу процесі."
 ],
 [
  "Кокстеу мен жанудың айырмашылығы",
  "Жануда зат оттекпен әрекеттесіп, тотығу өнімдерін түзеді. Ал кокстеуде негізгі мақсат — көмірдің термиялық өзгеруінен пайдалы өнімдер алу. Сондықтан жану мен кокстеудің химиялық мәні және алынатын өнімдері бірдей болмайды.",
  "Жану ≠ Кокстеу",
  "Кокстеуді көмірдің толық жануы деп түсіндіруге болмайды."
 ],
 [
  "Кокс дегеніміз не?",
  "Кокс — кокстеуден алынатын көміртекке бай, кеуекті қатты материал. Оның құрамында көміртек басым болғанымен, басқа компоненттер мен қалдық қоспалар да болуы мүмкін. Кокстың қасиеттері бастапқы көмір құрамына және өнеркәсіптік өңдеуге байланысты.",

 ],

 switch(action){
  case "start":
   startTimer();
   break;

  case "reset-time":
   resetTimer();
   break;

  case "product":
   state.product=i;
   break;

  case "level":
   state.levels[i]=!state.levels[i];
   break;

  case "oral-show":
   state.oralShow=!state.oralShow;
   break;

  case "oral-next":
   state.oral=Math.min(oral.length,state.oral+1);
   state.oralShow=false;
   break;

  case "oral-reset":
   state.oral=0;
   state.oralShow=false;
   break;

  case "go-game":
   go("Командалық ойын");
   break;

  case "game-answer":
   if(state.choice!==null)return;
   if(i<0||i>3)return;

   state.choice=i;

   if(i===quiz[state.game][2]){
    state.scores[state.game%3]+=10;
   }
   break;

  case "game-next":
   if(state.choice===null)return;
   state.game++;
   state.choice=null;
   break;

  case "game-reset":
   state.game=0;
   state.choice=null;
   state.scores=[0,0,0];
   break;

  case "home":
   state.home=!state.home;
   break;
 }

 save();
 draw();
});

/* 14. 80 МИНУТТЫҚ ТАЙМЕР */

const TIMER_KEY=STORE+"_timer";
let deadline=null;

try{
 const saved=localStorage.getItem(TIMER_KEY);
 if(saved!==null&&Number.isFinite(Number(saved))){
  deadline=Number(saved);
 }
}catch(error){
 console.warn(error);
}

function tick(){
 const seconds=deadline===null
  ?4800
  :Math.max(
   0,
   Math.ceil((deadline-Date.now())/1000)
  );

 $("timer").textContent=
  String(Math.floor(seconds/60)).padStart(2,"0")+
  ":"+
  String(seconds%60).padStart(2,"0");

 $("clock").textContent=
  new Intl.DateTimeFormat("en-GB",{
   timeZone:"Asia/Almaty",
   hour:"2-digit",
   minute:"2-digit",
   second:"2-digit",
   hourCycle:"h23"
  }).format(new Date());
}

function startTimer(){
 if(deadline!==null){
  alert("Таймер бұрын іске қосылған.");
  return;
 }

 deadline=Date.now()+4800000;

 try{
  localStorage.setItem(TIMER_KEY,String(deadline));
 }catch(error){
  console.warn(error);
 }

 tick();
}

function resetTimer(){
 if(!confirm("Таймерді жаңартамыз ба?"))return;

 deadline=null;

 try{
  localStorage.removeItem(TIMER_KEY);
 }catch(error){
  console.warn(error);
 }

 tick();
}

setInterval(tick,1000);

const keys=[
 "7","8","9","/",
 "4","5","6","*",
 "1","2","3","-",
 "C","0",".","+",
 "(",")","⌫","="
];

 <button type="button" data-key="${k}">
  ${k==="/"?"÷":k==="*"?"×":k}
 </button>
`).join("");

let calcText="";

function calculate(input){
 let i=0;

 function factor(){
  if(input[i]==="+"){
   i++;
   return factor();
  }

  if(input[i]==="-"){
   i++;
   return -factor();
  }

  if(input[i]==="("){
   i++;
   const result=sum();

   if(input[i]!==")"){
    throw Error("Жақша қатесі");
   }

   i++;
   return result;
  }

  const match=/^(?:\d+\.?\d*|\.\d+)/
   .exec(input.slice(i));

  if(!match)throw Error("Сан қатесі");

  i+=match[0].length;
  return Number(match[0]);
 }

 function product(){
  let value=factor();

  while(input[i]==="*"||input[i]==="/"){
   const op=input[i++];
   const next=factor();

   value=op==="*"
    ?value*next
    :value/next;
  }

  return value;
 }

 function sum(){
  let value=product();

  while(input[i]==="+"||input[i]==="-"){
   const op=input[i++];
   const next=product();

   value=op==="+"
    ?value+next
    :value-next;
  }

  return value;
 }

 if(!/^[0-9+*/().-]+$/.test(input)){
  throw Error("Таңба қатесі");
 }

 const result=sum();

 if(
  i!==input.length ||
  !Number.isFinite(result)
 ){
  throw Error("Өрнек қатесі");
 }

 return Number(result.toPrecision(12));
}

$("calcKeys").addEventListener("click",event=>{
 const button=event.target.closest("[data-key]");
 if(!button)return;

 const k=button.dataset.key;

 if(k==="C"){
  calcText="";
 }else if(k==="⌫"){
  calcText=calcText.slice(0,-1);
 }else if(k==="="){
  try{
   calcText=String(calculate(calcText));
  }catch(error){
   calcText="Қате";
  }
 }else{
  if(calcText==="Қате")calcText="";
  calcText+=k;
 }

 $("calcDisplay").value=calcText;
});

/* 16. КАЛЬКУЛЯТОРДЫ ЖЫЛЖЫТУ */

function clamp(v,min,max){
 return Math.max(min,Math.min(max,v));
}

function fitCalculator(){
 if(calculator.hidden)return;

 const r=calculator.getBoundingClientRect();

 calculator.style.left=clamp(
  r.left,0,Math.max(0,innerWidth-r.width)
 )+"px";

 calculator.style.top=clamp(
  r.top,0,Math.max(0,innerHeight-r.height)
 )+"px";
}

let drag=null;
let suppressClick=false;

calculator.addEventListener("pointerdown",event=>{
 if(
  drag ||
  (event.pointerType==="mouse"&&event.button!==0)
 )return;

 const r=calculator.getBoundingClientRect();

 drag={
  id:event.pointerId,
  x:event.clientX,
  y:event.clientY,
  left:r.left,
  top:r.top,
  moved:false
 };

 calculator.setPointerCapture(event.pointerId);
});

calculator.addEventListener("pointermove",event=>{
 if(!drag||drag.id!==event.pointerId)return;

 const dx=event.clientX-drag.x;
 const dy=event.clientY-drag.y;

 if(!drag.moved&&Math.hypot(dx,dy)>7){
  drag.moved=true;
  calculator.classList.add("dragging");
 }

 if(!drag.moved)return;

 calculator.style.left=clamp(
  drag.left+dx,
  0,
  Math.max(0,innerWidth-calculator.offsetWidth)
 )+"px";

 calculator.style.top=clamp(
  drag.top+dy,
  0,
  Math.max(0,innerHeight-calculator.offsetHeight)
 )+"px";
});

calculator.addEventListener("pointerup",event=>{
 if(!drag||drag.id!==event.pointerId)return;

 suppressClick=drag.moved;
 drag=null;
 calculator.classList.remove("dragging");

 if(calculator.hasPointerCapture(event.pointerId)){
  calculator.releasePointerCapture(event.pointerId);
 }
});

calculator.addEventListener("pointercancel",()=>{
 drag=null;
 calculator.classList.remove("dragging");
});

calculator.addEventListener("click",event=>{
 if(!suppressClick)return;

 event.preventDefault();
 event.stopImmediatePropagation();
 suppressClick=false;
},true);

window.addEventListener("resize",fitCalculator);

const elements=elementData.trim()
 .split(/\s+/)
 .map((entry,i)=>{
  const [symbol,name]=entry.split("|");

  return{
   z:i+1,
   symbol,
   name
  };
 });

const rowGroups=[
 [1,18],
 [1,2,13,14,15,16,17,18],
 [1,2,13,14,15,16,17,18],
 Array.from({length:18},(_,i)=>i+1),
 Array.from({length:18},(_,i)=>i+1)
];

function position(z){
 if(z<=54){
  let k=z-1;

  for(let p=0;p<5;p++){
   if(k<rowGroups[p].length){
    return{
     row:p+1,
     col:rowGroups[p][k]
    };
   }

   k-=rowGroups[p].length;
  }
 }

 if(z<=56)return{row:6,col:z-54};
 if(z<=71)return{row:9,col:z-53};
 if(z<=86)return{row:6,col:z-68};
 if(z<=88)return{row:7,col:z-86};
 if(z<=103)return{row:10,col:z-85};

 return{row:7,col:z-100};
}

function buildTable(){
 let html="";

 for(let g=1;g<=18;g++){
  html+=`
   <span class="period-label"
    style="grid-row:1;grid-column:${g+1}">
    ${g}
   </span>
  `;
 }

 for(let p=1;p<=7;p++){
  html+=`
   <span class="period-label"
    style="grid-row:${p+1};grid-column:1">
    ${p}
   </span>
  `;
 }

 html+=`
  <span class="period-label"
   style="grid-row:10;grid-column:1">
   La–Lu
  </span>

  <span class="period-label"
   style="grid-row:11;grid-column:1">
   Ac–Lr
  </span>

  <span class="period-label"
   style="grid-row:7;grid-column:4">
   57–71
  </span>

  <span class="period-label"
   style="grid-row:8;grid-column:4">
   89–103
  </span>
 `;

 for(const e of elements){
  const p=position(e.z);

  const cls=
   (e.z>=57&&e.z<=71)||
   (e.z>=89&&e.z<=103)
    ?"fblock"
    :["H","C","N","O"].includes(e.symbol)
     ?"featured":"";

  html+=`
   <button
    class="element ${cls}"
    data-z="${e.z}"
    style="
     grid-row:${p.row+1};
     grid-column:${p.col+1}
    "
   >
    <i>${e.z}</i>
    <b>${e.symbol}</b>
    <small>${e.name}</small>
   </button>
  `;
 }

 $("period").innerHTML=html;
}

$("period").addEventListener("click",event=>{

 const z=Number(button.dataset.z);
 const e=elements[z-1];
 const p=position(z);

 const period=p.row===9?6:p.row===10?7:p.row;
 const group=p.row>7?"f-блок":p.col+"-топ";

 $("elementInfo").textContent=
  `${z}. ${e.name} (${e.symbol}) · `+
  `${period}-период · ${group}`;
});

document.addEventListener("keydown",event=>{
 if(event.key==="Escape"){
  $("tableOverlay").hidden=true;
  calculator.hidden=true;
  return;
 }

 if(!$("tableOverlay").hidden)return;
 if(event.target.closest("input,textarea"))return;

 if(event.key==="ArrowRight"&&page<slides.length-1){
  page++;draw();
 }else if(event.key==="ArrowLeft"&&page>0){
  page--;draw();
 }
});

/* 19. ТЕКСЕРУ ЖӘНЕ БАСТАУ */

try{
 const checks=[
  [theory.length===15,"15 түсіндірме"],
  [notes.length===3,"3 конспект"],
  [levels.length===4,"4 деңгей"],
  [oral.length===25,"25 жеке тапсырма"],
  [quiz.length===15,"15 ойын сұрағы"],
  [slides.length===29,"29 бет"],
  [elements.length===118,"118 элемент"],
  [calculate("7*3")===21,"Көбейту"],
  [calculate("(2+3)*4")===20,"Жақша"],
  [calculate("36/12")===3,"Есеп"]
 ];

 for(const [ok,name] of checks){
  if(!ok)throw Error(name+" тексеру қатесі");
 }

 buildTable();
 tick();
 draw();

 console.log("§82: бастапқы тексерулер өтті");
}catch(error){
 console.error(error);

 const box=document.createElement("div");
 box.className="note";
 box.textContent="Сайт қатесі: "+error.message;
 $("slide").appendChild(box);
}
