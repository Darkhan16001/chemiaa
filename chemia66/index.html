
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081a2b">
<title>§66 — Алкандардың номенклатурасы мен изомерленуі</title>

<style>
:root{
  --bg:#081a2b;
  --panel:#143b56;
  --blue:#87ddff;
  --green:#86f0bd;
  --gold:#ffda8f;
  --red:#ffabb8;
  --white:#f7fcff;
  --muted:#bed9e9;
}
*{box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  margin:0;
  background:var(--bg);
  color:var(--white);
  font-family:"Segoe UI",Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.blue{color:var(--blue)}
.green{color:var(--green)}
.gold{color:var(--gold)}
.red{color:var(--red)}
.center{text-align:center}
.app{
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:
    radial-gradient(circle at 92% 5%,#14789680,transparent 43%),
    radial-gradient(circle at 5% 95%,#197d5b70,transparent 42%),
    linear-gradient(130deg,#071725,#11364e,#081a2b);
}
header{
  flex-shrink:0;
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:10px 22px;
  background:#071c2e;
  border-bottom:1px solid #6ea5c2;
}
.brand{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.brand strong{
  font-size:29px;
  font-weight:900;
  color:var(--blue);
}
.brand small{
  color:var(--gold);
  font-size:13px;
  font-weight:800;
}
.top-right{
  display:flex;
  align-items:center;
  gap:16px;
  font-weight:900;
}
#timer{
  color:var(--gold);
  font-size:30px;
  font-variant-numeric:tabular-nums;
}
#counter{color:var(--blue)}
main{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:23px 35px 32px;
  scrollbar-color:#6196b4 #102c42;
}
.slide{
  width:100%;
  max-width:1500px;
  min-height:100%;
  margin:auto;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
h1{
  font-size:clamp(41px,4.5vw,74px);
  line-height:1.12;
  margin:9px 0 20px;
}
h2{
  font-size:clamp(32px,2.9vw,48px);
  line-height:1.2;
  margin:0 0 18px;
}
h3{
  color:var(--blue);
  font-size:clamp(25px,2vw,34px);
  margin:0 0 12px;
}
p,li{
  font-size:clamp(21px,1.7vw,28px);
  line-height:1.48;
}
li{margin-bottom:9px}
.subtitle{
  color:var(--blue);
  font-size:20px;
  font-weight:900;
  letter-spacing:1px;
  margin-bottom:12px;
}
.grid2,.hero{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:17px;
  align-items:center;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.card{
  min-width:0;
  padding:23px 25px;
  background:linear-gradient(145deg,#1b4560,#102c43);
  border:1px solid #7eb2d0;
  border-radius:18px;
  box-shadow:0 11px 29px #0004;
}
.card.green-card{
  background:linear-gradient(145deg,#175b49,#103d34);
  border-color:#82ebbd;
}
.card p{margin:8px 0}
.formula{
  margin:15px 0;
  padding:18px;
  color:var(--green);
  background:#104353;
  border:1px solid #80c7db;
  border-radius:14px;
  font-size:clamp(27px,2.6vw,44px);
  font-weight:900;
  text-align:center;
  overflow-wrap:anywhere;
}
.note{
  margin-top:15px;
  padding:16px 20px;
  background:#1a435d;
  border-left:7px solid var(--gold);
  border-radius:12px;
  font-size:clamp(20px,1.55vw,26px);
  line-height:1.5;
}
.step{
  margin-top:8px;
  padding:10px 13px;
  background:#285269;
  border-radius:8px;
  font-size:clamp(19px,1.5vw,25px);
}
.structure{
  padding:17px;
  margin:12px 0;
  color:var(--gold);
  background:#0c3146;
  border:1px solid #80b9d5;
  border-radius:12px;
  text-align:center;
  font:700 clamp(20px,2vw,32px)/1.5
    Consolas,"Courier New",monospace;
  white-space:pre;
  overflow-x:auto;
}
.diagram{
  min-height:255px;
  padding:17px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:#143c52;
  border:1px solid #80bbd7;
  border-radius:18px;
}
.diagram svg{
  width:100%;

}
.diagram strong{
  color:var(--green);

}
.diagram small{
  color:var(--muted);
  font-size:19px;

}
.chem-table{
  width:100%;
  border-collapse:collapse;
}
.chem-table th,.chem-table td{
  padding:13px;
  border-bottom:1px solid #6197b6;
  text-align:left;
  font-size:clamp(19px,1.5vw,26px);
}
.chem-table th{color:var(--blue)}
.task{
  margin-bottom:12px;
  padding:14px 19px;
  background:#174058;
  border:1px solid #73a9c5;
  border-radius:12px;
}
.task p{margin:5px 0}
.question{
  font-size:clamp(29px,2.85vw,47px);
  font-weight:900;
  line-height:1.43;
}
.answer{

  padding:18px;
  background:#105441;
  border:1px solid #80e9b9;
  border-radius:13px;
  font-size:clamp(22px,1.85vw,29px);
  line-height:1.5;
}
.tag{
  display:inline-block;
  padding:12px 20px;
  color:var(--gold);
  background:#614f30;
  border:2px solid var(--gold);
  border-radius:13px;
  font-size:clamp(24px,2.4vw,40px);

}
.progress{
  height:13px;

  background:#294c61;

  overflow:hidden;
}
.progress div{
  height:100%;

}
.problem{
  margin-top:18px;
  padding:27px;
  background:linear-gradient(140deg,#16516a,#10354b);
  border:2px solid #81cbe6;
  border-radius:19px;
}
.actions{
  margin-top:18px;
  display:flex;
  flex-wrap:wrap;
  gap:11px;
}
.btn{
  padding:12px 18px;
  background:#285d7c;

  border:1px solid #82b5d0;
  border-radius:11px;

}
.btn.primary{background:#078fac;border-color:#8deaff}
.btn.success{background:#147c5d;border-color:#8cf1bf}
.btn.warning{background:#916b34;border-color:#ffdc91}
.team{
  padding:18px;
  background:#163e56;
  border:1px solid #7caac7;
  border-radius:16px;
  text-align:center;
}
.team.active{
  outline:4px solid var(--gold);
  box-shadow:0 0 24px #ffda9170;
}
.team .score{
  color:var(--gold);

}
.options{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));

}
.option{

}
.option.correct{background:#137957;border-color:#99f0c5}
.option.wrong{background:#8b3e4e;border-color:#ffb1ba}
.home-row{
  margin-bottom:11px;

  background:#173e56;
  border-left:6px solid var(--blue);

}
.home-row p{margin:5px 0}
footer{
  flex-shrink:0;
  min-height:88px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;

  background:#081d30;

}
.navigation{display:flex;gap:9px}
.signature{
  display:flex;
  flex-direction:column;
  align-items:center;

}
.signature strong{
  color:var(--gold);
  font-size:31px;
  font-weight:900;
  letter-spacing:3px;
}
.signature small{
  color:var(--muted);
  font-size:13px;
}
.clock{
  padding:8px 14px;
  background:#12394e;
  border:1px solid #70a4c0;
  border-radius:11px;

}
#clock{
  display:block;

  font-size:27px;
  font-variant-numeric:tabular-nums;
}
.clock small{color:var(--muted);font-size:12px}
.tools{
  position:fixed;
  z-index:50;
  bottom:107px;
  left:10px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:7px;
}
.tool-btn{
  padding:10px 12px;
  background:#127fa0;
  color:white;
  border:1px solid #8ce2ff;
  border-radius:9px;
  font-size:13px;
  font-weight:900;
}
.tool-btn.green-btn{
  background:#167b58;
  border-color:#87eabb;
}

/* КАЛЬКУЛЯТОР */

.calculator{
  position:fixed;
  z-index:1200;
  top:100px;
  left:15px;
  width:207px;
  max-width:calc(100vw - 12px);
  padding:8px;
  color:white;
  background:#103249;
  border:1px solid #86dfff;
  border-radius:13px;
  box-shadow:0 20px 45px #000b;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  cursor:grab;
}
.calculator.dragging{cursor:grabbing}
.calc-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px;
  margin-bottom:7px;
  background:#28576e;
  border-radius:8px;
  font-size:13px;
}
.close{
  padding:5px 9px;
  background:#b74c5d;
  color:white;
  border:0;
  border-radius:6px;
}
#calcDisplay{
  width:100%;
  height:43px;
  padding:7px;
  color:white;
  background:#061d2d;
  border:1px solid #83afc9;
  border-radius:8px;
  font-size:19px;
  text-align:right;
  pointer-events:none;
}
.calc-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  margin-top:7px;
}
.calc-grid button{
  min-width:0;
  height:38px;
  padding:1px;
  background:#2c6080;
  color:white;
  border:1px solid #76a8c5;
  border-radius:7px;
  font-size:16px;
  font-weight:900;
  touch-action:none;
}
.calc-grid button:active{background:#1696b7}
.calc-hint{
  padding-top:7px;
  color:var(--muted);
  font-size:11px;
  text-align:center;
}

/* МЕНДЕЛЕЕВ КЕСТЕСІ */

.overlay{
  position:fixed;
  inset:0;
  z-index:2000;
  padding:12px;
  background:#000d;
  display:flex;
  align-items:center;
  justify-content:center;
}
.periodic-panel{
  width:min(1600px,99vw);
  max-height:97vh;
  padding:17px;
  overflow:auto;
  background:#0e2a40;
  border:1px solid #80aec9;
  border-radius:17px;
}
.modal-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.modal-head p{font-size:17px}
.periodic-scroll{
  padding:12px;
  overflow:auto;
  background:#061e30;
  border-radius:12px;
}
.periodic-grid{
  display:grid;
  min-width:1840px;
  grid-template-columns:60px repeat(18,minmax(95px,1fr));
  grid-template-rows:45px repeat(10,98px);
  gap:5px;
}
.period-label,.group-label{
  display:grid;
  place-items:center;
  padding:4px;
  background:#1b4c65;
  color:var(--gold);
  border:1px solid #7bb8d4;
  border-radius:7px;
  font-weight:900;
  text-align:center;
}
.element{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
  padding:12px 3px 4px;
  background:#246481;
  border:1px solid #92c0d6;
  border-radius:7px;
  color:white;
}
.element .number{
  position:absolute;
  top:4px;left:5px;
  font-size:12px;
}
.element .symbol{
  font-size:28px;
  font-weight:900;
}
.element .ename{
  font-size:12px;
  text-align:center;
}
.element .mass{
  font-size:12px;
  color:#e2efff;
}
.element.important{background:#965273}
.element.noble{background:#6652a2}
.element.lanth{background:#347e8a}
.element.act{background:#82566b}
.element-info{
  margin-top:12px;
  padding:15px;
  background:#194760;
  border-radius:10px;
  font-size:22px;
  line-height:1.5;
}
@media(max-width:950px){
  .hero,.grid2,.grid3{grid-template-columns:1fr}
}
@media(max-width:700px){
  header{padding:8px}
  .brand strong{font-size:18px}
  .brand small,#sectionName{display:none}
  .top-right{gap:7px;font-size:13px}
  #timer{font-size:21px}
  main{padding:13px}
  h1{font-size:36px}
  h2{font-size:29px}
  h3{font-size:24px}
  p,li{font-size:19px}
  .card{padding:16px}
  .problem{padding:16px}
  footer{min-height:78px;padding:7px}
  .navigation{gap:4px}
  .signature strong{font-size:15px;letter-spacing:0}
  .signature small{display:none}
  .clock{padding:5px}
  #clock{font-size:16px}
  .clock small{font-size:10px}
  .btn{font-size:13px;padding:8px}
  .tools{bottom:93px;left:8px}
  .option{font-size:20px}
  .options{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">
  <header>
    <div class="brand">
      <strong>⚗ CHEMISTRY PRO</strong>
      <small>§66 · АЛКАНДАРДЫҢ НОМЕНКЛАТУРАСЫ МЕН ИЗОМЕРЛЕНУІ</small>
    </div>

    <div class="top-right">
      <span id="sectionName">Кіріспе</span>
      <strong id="timer">80:00</strong>
      <span id="counter">1 / 1</span>
    </div>
  </header>

  <main id="main">
    <section id="slide" class="slide"></section>
  </main>

  <footer>
    <div class="navigation">
      <button id="prev" class="btn">← Артқа</button>
      <button id="next" class="btn primary">Келесі →</button>
    </div>

    <div class="signature">
      <strong>BY DARKHAN</strong>
      <small id="slideTitle">§66</small>
    </div>

    <div class="clock">
      <strong id="clock">00:00:00</strong>
      <small>Алматы уақыты</small>
    </div>
  </footer>
</div>

<div class="tools">
  <button class="tool-btn" id="calcOpen">
    🧮 Калькулятор
  </button>

  <button class="tool-btn green-btn" id="tableOpen">
    ⚛ Менделеев кестесі
  </button>
</div>

<div id="calculator" class="calculator hidden">
  <div class="calc-head">
    <strong>🧮 Калькулятор</strong>
    <button id="calcClose" class="close" type="button">✕</button>
  </div>

  <input id="calcDisplay" readonly aria-label="Калькулятор экраны">

  <div id="calcKeys" class="calc-grid"></div>

  <div class="calc-hint">
    Бас — есепте · Ұстап жылжыт — қозға
  </div>
</div>

<div id="periodicModal" class="overlay hidden">
  <div class="periodic-panel">
    <div class="modal-head">
      <div>
        <h2>Менделеевтің периодтық кестесі</h2>
        <p>118 элемент · 7 период · 18 топ</p>
      </div>

      <button id="tableClose" class="close">
        ✕
      </button>
    </div>

    <div class="periodic-scroll">
      <div id="periodicGrid" class="periodic-grid"></div>
    </div>

    <div id="elementInfo" class="element-info">
      Элементті басып, мәліметін қара.
    </div>
  </div>
</div>

<script>
"use strict";

/* ========================================
  §66 АЛКАНДАРДЫҢ НОМЕНКЛАТУРАСЫ
  МЕН ИЗОМЕРЛЕНУІ
  ТОЛЫҚ БІР INDEX.HTML
======================================== */

const $=id=>document.getElementById(id);

const escapeHTML=value=>String(value).replace(
  /[&<>"']/g,
  ch=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[ch])
);

/* ЖАД */

const STORAGE_KEY="darkhan_chem66_rebuilt_v3";
const TIMER_KEY=STORAGE_KEY+"_timer";

function freshState(){
  return{
    levels:{},
    boardIndex:0,
    boardAnswer:false,
    gameIndex:0,
    selectedOption:null,
    scores:[0,0,0],
    homeworkAnswer:false
  };
}

let state=freshState();

try{
  const data=JSON.parse(localStorage.getItem(STORAGE_KEY));

  if(data && Array.isArray(data.scores) && data.scores.length===3){
    state={...freshState(),...data};
  }
}catch(error){
  console.warn("Сақталған деректер оқылмады:",error);
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  }catch(error){
    console.warn(error);
  }
}

/* УАҚЫТ */

const storedDeadline=localStorage.getItem(TIMER_KEY);

let deadline=storedDeadline===null
  ?null
  :Number(storedDeadline);

if(deadline!==null&&!Number.isFinite(deadline)){
  deadline=null;
}

function remainingSeconds(){
  if(deadline===null)return 80*60;

  return Math.max(
    0,
    Math.ceil((deadline-Date.now())/1000)
  );
}

function updateTime(){
  const seconds=remainingSeconds();

  const m=String(Math.floor(seconds/60)).padStart(2,"0");
  const s=String(seconds%60).padStart(2,"0");

  $("timer").textContent=m+":"+s;
  $("timer").style.color=seconds===0?"#ffabb8":"#ffda8f";

  $("clock").textContent=
    new Intl.DateTimeFormat("en-GB",{
      timeZone:"Asia/Almaty",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hourCycle:"h23"
    }).format(new Date());
}

function startTimer(){
  if(deadline!==null && remainingSeconds()>0)return;

  if(deadline!==null){
    alert("80 минут аяқталды. Таймерді жаңарту батырмасын бас.");
    return;
  }

  deadline=Date.now()+80*60*1000;
  localStorage.setItem(TIMER_KEY,String(deadline));

  updateTime();
  render();
}

function resetTimer(){
  if(!confirm("Таймерді қайта бастаймыз ба?"))return;

  deadline=null;
  localStorage.removeItem(TIMER_KEY);

  updateTime();
  render();
}

setInterval(updateTime,1000);

/* СЛАЙД ЖҮЙЕСІ */

const slides=[];
let page=0;

function addSlide(title,section,html){
  slides.push({title,section,html});
}

function addDynamicSlide(title,section,renderer){
  slides.push({title,section,renderer});
}

function render(){
  const current=slides[page];
  if(!current)return;

  $("slide").innerHTML=current.renderer
    ?current.renderer()
    :current.html;

  $("sectionName").textContent=current.section;
  $("slideTitle").textContent=current.title;
  $("counter").textContent=(page+1)+" / "+slides.length;

  $("prev").disabled=page===0;
  $("next").disabled=page===slides.length-1;

  $("main").scrollTop=0;
}

function goTo(title){
  const index=slides.findIndex(s=>s.title===title);

  if(index>=0){
    page=index;
    render();
  }
}

$("prev").addEventListener("click",()=>{
  if(page>0){
    page--;
    render();
  }
});

$("next").addEventListener("click",()=>{
  if(page<slides.length-1){
    page++;
    render();
  }
});

/* ========================================
   КӨМІРТЕК ҚАҢҚАЛАРЫ
   SVG — БАЙЛАНЫСТАР МЕН АТОМ ТОПТАРЫ
======================================== */

const models={
  butane:{
    name:"Бутан",
    formula:"C₄H₁₀",
    atoms:[
      ["CH₃",45,120],
      ["CH₂",165,120],
      ["CH₂",285,120],
      ["CH₃",405,120]
    ],
    bonds:[[0,1],[1,2],[2,3]]
  },

function drawMolecule(key){
  const molecule=models[key]||models.butane;

  function atomGap(label){
    if(label==="C")return 20;
    if(label==="CH")return 27;
    return 43;
  }

  const lines=molecule.bonds.map(([i,j])=>{
    const a=molecule.atoms[i];
    const b=molecule.atoms[j];

    const dx=b[1]-a[1];
    const dy=b[2]-a[2];

    const distance=Math.hypot(dx,dy)||1;
    const ux=dx/distance;
    const uy=dy/distance;

    const start=atomGap(a[0]);
    const end=atomGap(b[0]);

    const x1=a[1]+ux*start;
    const y1=a[2]+uy*start;
    const x2=b[1]-ux*end;
    const y2=b[2]-uy*end;

    return `
      <line
        x1="${x1}" y1="${y1}"
        x2="${x2}" y2="${y2}"
        stroke="#86f0bd"
        stroke-width="5"
        stroke-linecap="round"
      />
    `;
  }).join("");

  const atoms=molecule.atoms.map(atom=>`
    <text
      x="${atom[1]}"
      y="${atom[2]+9}"
      font-size="27"
      font-weight="900"
      text-anchor="middle"
      fill="#f7fcff"
    >${escapeHTML(atom[0])}</text>
  `).join("");

  return `
    <div class="diagram">
      <svg
        viewBox="0 0 450 250"
        role="img"
        aria-label="${escapeHTML(molecule.name)} құрылысы"
      >
        ${lines}
        ${atoms}
      </svg>

      <strong>${escapeHTML(molecule.formula)}</strong>
      <small>${escapeHTML(molecule.name)}</small>
    </div>
  `;
}

  if(i>=board.length){

            Командалық ойын →
          </button>
        </div>
      </div>
    `;
  }

  const [question,answer,explanation]=board[i];

  return `
    <div class="subtitle">
      ЖЕКЕ ТАҚТА ТАПСЫРМАСЫ
    </div>

        <p>${escapeHTML(explanation)}</p>
      </div>
    `:""}

    <div class="actions">
      <button class="btn warning"
        onclick="toggleBoardAnswer()">
        ${state.boardAnswer?
          "Жауапты жасыру":
          "Жауапты көру"}
      </button>

      <button class="btn primary"
        onclick="nextBoard()">
        Келесі оқушы →
      </button>
    </div>
  `;
}

function toggleBoardAnswer(){
  state.boardAnswer=!state.boardAnswer;
  saveState();
  render();
}

function nextBoard(){
  state.boardIndex=Math.min(
    state.boardIndex+1,
    board.length
  );

  state.boardAnswer=false;
  saveState();
  render();
}

function restartBoard(){
  if(!confirm("25 тапсырманы қайта бастаймыз ба?"))return;

  state.boardIndex=0;
  state.boardAnswer=false;

  saveState();
  render();
}

  state.selectedOption=j;

function nextGameQuestion(){
  if(state.selectedOption===null)return;

  render();

/* ҚАУІПСІЗ АРИФМЕТИКАЛЫҚ ЕСЕПТЕГІШ */

function calculate(source){
  if(!/^[0-9+\-*/(). ]+$/.test(source)){
    throw Error("Өрнек қатесі");
  }

  let pos=0;

  function skip(){
    while(source[pos]===" ")pos++;
  }

  function factor(){
    skip();

    if(source[pos]==="+"){
      pos++;
      return factor();
    }

    if(source[pos]==="-"){
      pos++;
      return -factor();
    }

    if(source[pos]==="("){
      pos++;
      const result=expression();
      skip();

      if(source[pos]!==")"){
        throw Error("Жақша қатесі");
      }

      pos++;
      return result;
    }

    const match=/^(?:\d+\.?\d*|\.\d+)/
      .exec(source.slice(pos));

    if(!match){
      throw Error("Сан қатесі");
    }

    pos+=match[0].length;
    return Number(match[0]);
  }

  function term(){
    let result=factor();

    while(true){
      skip();
      const op=source[pos];

      if(op!=="*"&&op!=="/")break;

      pos++;
      const next=factor();

      result=op==="*"
        ?result*next
        :result/next;
    }

    return result;
  }

  function expression(){
    let result=term();

    while(true){
      skip();
      const op=source[pos];

      if(op!=="+"&&op!=="-")break;

      pos++;
      const next=term();

      result=op==="+"
        ?result+next
        :result-next;
    }

    return result;
  }

  const result=expression();
  skip();

  if(
    pos!==source.length ||
    !Number.isFinite(result)
  ){
    throw Error("Есептеу қатесі");
  }

  return Number(result.toPrecision(12));
}

function calcPress(key){
  if(key==="C"){
    calcText="";
  }else if(key==="⌫"){
    calcText=calcText.slice(0,-1);
  }else if(key==="="){
    try{
      const normalized=calcText
        .replaceAll("×","*")
        .replaceAll("÷","/")
        .replaceAll("−","-");

      calcText=String(calculate(normalized));
    }catch(error){
      calcText="Қате";
    }
  }else{
    if(calcText==="Қате"){
      calcText="";
    }

    calcText+=key;
  }

  display.value=calcText;
}

function fitCalculator(){
  if(calculator.classList.contains("hidden"))return;

  calculator.style.left=clamp(
    r.left,
    0,
    Math.max(0,innerWidth-r.width)

let dragging=null;

/*
  Калькулятордағы кез келген жерден
  жылжытуға болады.

  Егер қозғалыс 7 пиксельден аспаса,
  кәдімгі click оқиғасы жұмыс істейді.
*/

calculator.addEventListener("pointerdown",event=>{
  if(
    event.pointerType==="mouse" &&
    event.button!==0
  ){
    return;
  }

  if(dragging)return;

  const rect=calculator.getBoundingClientRect();

  dragging={
    id:event.pointerId,
    x:event.clientX,
    y:event.clientY,
    left:rect.left,
    top:rect.top,
    moved:false
  };
});

/* Тек жылжыту кезінде орнын өзгертеміз */

window.addEventListener("pointermove",event=>{
  if(
    !dragging ||
    dragging.id!==event.pointerId
  ){
    return;
  }

  const dx=event.clientX-dragging.x;
  const dy=event.clientY-dragging.y;

  if(!dragging.moved && Math.hypot(dx,dy)>7){
    dragging.moved=true;
    calculator.classList.add("dragging");
  }

  if(!dragging.moved)return;

  if(event.cancelable){
    event.preventDefault();
  }

  calculator.style.left=clamp(
    dragging.left+dx,
    0,
    Math.max(0,innerWidth-calculator.offsetWidth)
  )+"px";

  calculator.style.top=clamp(
    dragging.top+dy,
    0,
    Math.max(0,innerHeight-calculator.offsetHeight)
  )+"px";
},{passive:false});

/*
  Ұстап жылжытудан кейін туатын
  click батырманы басып қоймауы керек.
*/

let suppressNextClick=false;

function finishDragging(event){
  if(
    !dragging ||
    event.pointerId!==dragging.id
  ){
    return;
  }

  if(dragging.moved){
    suppressNextClick=true;

    setTimeout(()=>{
      suppressNextClick=false;
    },120);
  }

  dragging=null;
  calculator.classList.remove("dragging");
}

window.addEventListener("pointerup",finishDragging);
window.addEventListener("pointercancel",finishDragging);

calculator.addEventListener("click",event=>{
  if(!suppressNextClick)return;

  event.preventDefault();
  event.stopImmediatePropagation();

},true);

function elementPosition(z){

        return{
          row:p+1,

      index-=periodColumns[p].length;

  let html="";

  for(let group=1;group<=18;group++){
    html+=`
      <div class="group-label"
        style="grid-row:1;grid-column:${group+1}">
        ${group}
      </div>
    `;
  }

  for(let period=1;period<=7;period++){
    html+=`
      <div class="period-label"
        style="grid-row:${period+1};grid-column:1">
        ${period}
      </div>
    `;
  }

  html+=`
    <div class="period-label"
      style="grid-row:10;grid-column:1;font-size:11px">
      Лантаноидтар
    </div>

    <div class="period-label"
      style="grid-row:11;grid-column:1;font-size:11px">
      Актиноидтар
    </div>

    <div class="group-label"
      style="grid-row:7;grid-column:4">
      57–71
    </div>

    <div class="group-label"
      style="grid-row:8;grid-column:4">
      89–103
    </div>
  `;

  elements.forEach((e,i)=>{
    const pos=elementPosition(e.z);

    html+=`
      <button
        class="element ${elementType(e)}"
        data-index="${i}"
        style="grid-row:${pos.row+1};grid-column:${pos.col+1}"
      >
        <span class="number">${e.z}</span>
        <span class="symbol">${escapeHTML(e.symbol)}</span>
        <span class="ename">${escapeHTML(e.name)}</span>
        <span class="mass">${escapeHTML(e.mass)}</span>
      </button>
    `;
  });

  $("periodicGrid").innerHTML=html;
}

$("periodicGrid").addEventListener("click",event=>{
  const button=event.target.closest("[data-index]");
  if(!button)return;

  const element=elements[Number(button.dataset.index)];
  const position=elementPosition(element.z);

  const period=position.row===9
    ?6
    :position.row===10
      ?7
      :position.row;

  const group=position.row>7
    ?"f-блок"
    :position.col+"-топ";

  $("elementInfo").innerHTML=`
    <b class="blue">
      ${element.z}.
      ${escapeHTML(element.name)}
      (${escapeHTML(element.symbol)})
    </b>

    <div>
      ${period}-период · ${group}
    </div>

    <div>
      Атомдық масса немесе
      изотоптың массалық саны:
      <b class="gold">
        ${escapeHTML(element.mass)}
      </b>
    </div>
  `;
});

$("tableOpen").addEventListener("click",()=>{
  $("periodicModal").classList.remove("hidden");
});

$("tableClose").addEventListener("click",()=>{
  $("periodicModal").classList.add("hidden");
});

$("periodicModal").addEventListener("click",event=>{
  if(event.target===$("periodicModal")){
    $("periodicModal").classList.add("hidden");
  }
});

/* ПЕРНЕТАҚТА АРҚЫЛЫ СЛАЙД АУЫСТЫРУ */

document.addEventListener("keydown",event=>{
  if(event.key==="Escape"){
    $("periodicModal").classList.add("hidden");
    calculator.classList.add("hidden");
    return;
  }

  const active=document.activeElement;

  if(
    active &&
    ["INPUT","TEXTAREA"].includes(active.tagName)
  ){
    return;
  }

  if(!$("periodicModal").classList.contains("hidden")){
    return;
  }

  if(event.key==="ArrowRight"&&page<slides.length-1){
    page++;
    render();
  }

  if(event.key==="ArrowLeft"&&page>0){
    page--;
    render();
  }
});

/* ІСКЕ ҚОСУ */

buildPeriodicTable();
updateTime();
render();

</script>
</body>
</html>
