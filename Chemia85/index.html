<style>

#counter{color:var(--cyan)}
#clock{

main{

h1{

.calc-hint{

/* МЕНДЕЛЕЕВ КЕСТЕСІ */
.overlay{

<div class="app">

<header>

<script>
"use strict";

/* 1. СЛАЙД ЖҮЙЕСІ */

const $=id=>document.getElementById(id);
const slides=[];
let page=0;

function add(title,section,html){
 slides.push({title,section,html});
}

function dynamic(title,section,render){
 slides.push({title,section,render});
}

function draw(){
 const s=slides[page];
 if(!s)return;

 $("slide").innerHTML=s.render?s.render():s.html;
 $("sectionName").textContent=s.section;
 $("counter").textContent=
  (page+1)+" / "+slides.length;

 $("prev").disabled=page===0;
 $("next").disabled=page===slides.length-1;
 $("main").scrollTop=0;
}

function go(title){
 const i=slides.findIndex(s=>s.title===title);
 if(i>=0){page=i;draw();}
}

$("prev").onclick=()=>{
 if(page>0){page--;draw();}
};

$("next").onclick=()=>{
 if(page<slides.length-1){page++;draw();}
};

/* 2. ЖАДЫ */

const STORE="darkhan_chem85_elimination_v1";

function fresh(){
 return{
  levels:{},oral:0,oralShow:false,
  game:0,choice:null,scores:[0,0,0],
  home:false,mechanism:0
 };
}

let state=fresh();

try{
 const saved=JSON.parse(localStorage.getItem(STORE));
 if(saved&&Array.isArray(saved.scores)&&
    saved.scores.length===3){
  state={...fresh(),...saved};
 }
}catch(e){console.warn(e);}

function save(){
 try{
  localStorage.setItem(STORE,JSON.stringify(state));
 }catch(e){console.warn(e);}
}

/* 3. КӨРНЕКІ СЫЗБА */

function diagram(){
 return `

    <circle cx="93" cy="105" r="34"/>
    <circle cx="216" cy="105" r="34"/>
    <circle cx="405" cy="105" r="33"/>
    <circle cx="514" cy="105" r="33"/>
   </g>

   <g fill="none" stroke="#95efc4"
    stroke-width="5" stroke-linecap="round">
    <line x1="128" y1="105" x2="181" y2="105"/>
    <line x1="439" y1="95" x2="480" y2="95"/>
    <line x1="439" y1="110" x2="480" y2="110"/>
   </g>

   <g fill="white" font-size="26"
    text-anchor="middle" font-weight="bold">
    <text x="93" y="115">C</text>
    <text x="216" y="115">C</text>
    <text x="405" y="115">C</text>
    <text x="514" y="115">C</text>
   </g>

   <path d="M270 105 H356 M343 92 L357 105 L343 118"
    fill="none" stroke="#ffdc92" stroke-width="5"/>

   <g fill="#ffdc92" text-anchor="middle"
    font-size="19">
    <text x="155" y="55">Бастапқы қосылыс</text>
    <text x="463" y="55">Алкен</text>
    <text x="310" y="145">Элиминирлеу</text>
   </g>

   <text x="155" y="189" fill="#fff"
    text-anchor="middle" font-size="22">
    CH₃–CH₂Br
   </text>
   <text x="463" y="189" fill="#fff"
    text-anchor="middle" font-size="22">
    CH₂=CH₂
   </text>
  </svg>

  <strong>Галогеналканнан алкен түзілуі</strong>
  <p>Теориялық құрылымдық өзгеріс</p>
 </div>
 `;
}

/* 4. КІРІСПЕ */

dynamic("Кіріспе","Кіріспе · 5 минут",()=>`
 <div class="grid2">
  <div>
   <div class="eyebrow">
    §85 · ОРГАНИКАЛЫҚ ХИМИЯ
   </div>

   <h1>
    Галогеналкандардың
    элиминирлеу реакциялары
   </h1>

   <p>
    Элиминирлеу, қос байланыстың
    түзілуі, β-элиминирлеу,
    E1 және E2 механизмдері,
    орынбасумен айырмашылығы.
   </p>

   <div class="formula">
    Галогеналкан → Алкен
   </div>

   <div class="actions">
    <button class="btn good" data-action="start">
     ▶ Сабақты бастау
    </button>
    <button class="btn gold" data-action="reset-time">
     ↺ Таймерді жаңарту
    </button>
   </div>
  </div>

  ${diagram()}
 </div>
`);

add("Сабақ мақсаты","Кіріспе",`
 <h2>Сабақтың мақсаты</h2>

 <div class="grid2">
  <div class="card">
   <h3>Білімдік мақсат</h3>
   <p>
    Галогеналкандардың элиминирлеу
    реакцияларының мәнін түсіну.
    Алкендердің түзілуін,
    E1 және E2 механизмдерінің
    негізгі айырмашылықтарын ажырату.
   </p>
  </div>

  <div class="card">
   <h3>Практикалық мақсат</h3>
   <p>
    Теориялық реакция теңдеулерін
    талдау, бастапқы қосылыс пен
    өнімді атау, молярлық масса
    бойынша есептер шығару
    және реакцияларды салыстыру.
   </p>
  </div>
 </div>

 <div class="note">

   деңгейлік жұмыс — 10;

   командалық ойын — 12;
   қорытынды — 5 минут.

/* 5. 15 ТҮСІНДІРМЕ */

const theory=[
 [
  "Элиминирлеу дегеніміз не?",
  "Элиминирлеу — органикалық молекуладан екі атомның немесе атомдар тобының бөлініп шығуына байланысты реакция түрі. Галогеналкандарда мұндай өзгеріс нәтижесінде көміртек атомдары арасындағы қос байланыс пайда болуы мүмкін. Реакция өнімін бастапқы қосылыстың құрылымы арқылы түсіндіреміз.",
  "Элиминирлеу → Қос байланыс",
  "Элиминирлеу кезінде молекулада жаңа қанықпаған байланыс түзілуі мүмкін."
 ],
 [
  "Галогеналкандарды еске түсіру",
  "Галогеналкандар — құрамындағы бір немесе бірнеше сутек атомы галоген атомына орынбасқан алкандардың туындылары. Қарапайым бір галогенді туындылар R–X түрінде белгіленеді. Мұнда X — фтор, хлор, бром немесе йод.",
  "R–X",
  "Галогеналкандарда көміртек пен галоген арасында байланыс бар."
 ],
 [
  "Алкендер қалай түзіледі?",
  "Алкендер құрамында көміртек-көміртек қос байланысы болатын қанықпаған көмірсутектер. Кейбір галогеналкандардың элиминирлеу реакцияларында көміртек тізбегінде қос байланыс қалыптасады. Реакцияның өнімі молекуланың құрылысына байланысты.",
  "C–C → C=C",
  "Элиминирлеу өнімдерінің бірі — алкен."
 ],
 [
  "β-элиминирлеу ұғымы",
  "Галогеналкандардағы β-элиминирлеуді түсіну үшін галоген байланысқан көміртек және оған көршілес көміртек атомы ажыратылады. Теориялық модельде көрші көміртектегі сутек пен галогеннің бөлінуі нәтижесінде екі көміртек арасында қос байланыс пайда болады.",
  "β-элиминирлеу → Алкен",
  "Қос байланыс көршілес көміртек атомдарының арасында түзіледі."
 ],
 [
  "Бромэтанның өзгеруі",
  "Бромэтан молекуласындағы екі көміртек атомының арасында бастапқыда дара байланыс болады. Элиминирлеудің шартты жиынтық теңдеуінде бромэтаннан этен және бромсутек бөлінуі көрсетіледі. Бұл реакцияның нақты механизмі мен өнімдері ортаға байланысты.",

  "Этеннің формуласы — C₂H₄."
 ],

dynamic("Командалық ойын","3 команда · 12 минут",()=>{
 const i=state.game;

 if(i>=quiz.length){
  const best=Math.max(...state.scores);
  const winners=state.scores
   .map((s,j)=>s===best?`${j+1}-команда`:null)
   .filter(Boolean);

  return `
   <h1>Командалық ойын аяқталды!</h1>
   <div class="grid3">
    ${state.scores.map((score,j)=>`
     <div class="team">
      <h3>${j+1}-команда</h3>
      <div class="score">${score}</div>
      <p>ұпай</p>
     </div>
    `).join("")}
   </div>

   <div class="note">
    <p>Жеңімпаз: ${winners.join(", ")}</p>
   </div>

   <div class="actions">
    <button class="btn gold"
     data-action="game-reset">
     ↺ Қайта бастау
    </button>
   </div>
  `;
 }

 const [q,options,right]=quiz[i];

 return `
  <div class="eyebrow">
   КОМАНДАЛЫҚ ОЙЫН ${i+1}/15
  </div>
  <h2>${i%3+1}-команданың кезегі</h2>

  <div class="grid3">
   ${state.scores.map((score,j)=>`
    <div class="team ${j===i%3?"active":""}">
     <h3>${j+1}-команда</h3>
     <div class="score">${score}</div>
    </div>
   `).join("")}
  </div>

  <div class="card" style="margin-top:16px">
   <p class="big">${q}</p>
  </div>

  <div class="options">
   ${options.map((option,j)=>`
    <button
     class="option ${
      state.choice===null?""
      :j===right?"correct"
      :j===state.choice?"wrong":""
     }"
     data-action="game-answer"
     data-index="${j}"
     ${state.choice!==null?"disabled":""}>
     ${"ABCD"[j]}. ${option}
    </button>
   `).join("")}
  </div>

  ${state.choice!==null?`
   <div class="answer">
    <h3>
     ${state.choice===right
      ?"Дұрыс! +10 ұпай"
      :"Қате. 0 ұпай"}
    </h3>
    <p>Дұрыс жауап: ${options[right]}</p>

   <div class="actions">
    <button class="btn primary"
     data-action="game-next">
     Келесі команда →
    </button>
   </div>
  `:""}
 `;
});

$("slide").addEventListener("click",e=>{
 const b=e.target.closest("[data-action]");
 if(!b)return;

 const action=b.dataset.action;
 const i=Number(b.dataset.index);

 switch(action){
  case "start":
   startTimer();break;

  case "reset-time":
   resetTimer();break;

  case "mechanism":
   state.mechanism=i;break;

  case "level":
   state.levels[i]=!state.levels[i];break;

  case "oral-show":
   state.oralShow=!state.oralShow;break;

  case "oral-next":
   state.oral=Math.min(oral.length,state.oral+1);
   state.oralShow=false;break;

  case "oral-reset":
   state.oral=0;
   state.oralShow=false;break;

  case "go-game":
   go("Командалық ойын");break;

  case "game-answer":
   if(state.choice!==null)return;
   if(i<0||i>3)return;
   state.choice=i;
   if(i===quiz[state.game][2]){
    state.scores[state.game%3]+=10;
   }
   break;

  case "game-next":
   if(state.choice===null)return;
   state.game++;
   state.choice=null;break;

  case "game-reset":
   state.game=0;
   state.choice=null;
   state.scores=[0,0,0];break;

  case "home":
   state.home=!state.home;break;
 }

 save();
 draw();
});

/* 14. ТАЙМЕР ЖӘНЕ АЛМАТЫ УАҚЫТЫ */

const TIMER_KEY=STORE+"_timer";
let deadline=null;

try{
 const saved=localStorage.getItem(TIMER_KEY);
 if(saved!==null&&Number.isFinite(Number(saved))){
  deadline=Number(saved);
 }
}catch(e){console.warn(e);}

function tick(){
 const seconds=deadline===null
  ?4800
  :Math.max(0,Math.ceil((deadline-Date.now())/1000));

 $("timer").textContent=
  String(Math.floor(seconds/60)).padStart(2,"0")+
  ":"+String(seconds%60).padStart(2,"0");

 $("clock").textContent=
  new Intl.DateTimeFormat("en-GB",{
   timeZone:"Asia/Almaty",
   hour:"2-digit",
   minute:"2-digit",
   second:"2-digit",
   hourCycle:"h23"
  }).format(new Date());
}

function startTimer(){
 if(deadline!==null){
  alert("Таймер іске қосылған.");
  return;
 }
 deadline=Date.now()+4800000;
 try{
  localStorage.setItem(TIMER_KEY,String(deadline));
 }catch(e){console.warn(e);}
 tick();
}

function resetTimer(){
 if(!confirm("80 минуттық таймерді жаңартамыз ба?")){
  return;
 }
 deadline=null;
 try{
  localStorage.removeItem(TIMER_KEY);
 }catch(e){console.warn(e);}
 tick();
}

setInterval(tick,1000);

const calcButtons=[
 "7","8","9","/",
 "4","5","6","*",
 "1","2","3","-",
 "C","0",".","+",
 "(",")","⌫","="
];

$("calcKeys").innerHTML=calcButtons.map(k=>`

  ${k==="/"?"÷":k==="*"?"×":k}
 </button>

let calcText="";

function calculate(input){
 let i=0;

 function factor(){
  if(input[i]==="+"){i++;return factor();}
  if(input[i]==="-"){i++;return -factor();}

  if(input[i]==="("){
   i++;
   const value=sum();
   if(input[i]!==")"){
    throw Error("Жақша қатесі");
   }
   i++;
   return value;
  }

  const m=/^(?:\d+\.?\d*|\.\d+)/
   .exec(input.slice(i));

  if(!m)throw Error("Сан қатесі");

  i+=m[0].length;
  return Number(m[0]);
 }

 function product(){
  let v=factor();
  while(input[i]==="*"||input[i]==="/"){
   const op=input[i++];
   const next=factor();
   v=op==="*"?v*next:v/next;
  }
  return v;
 }

 function sum(){
  let v=product();
  while(input[i]==="+"||input[i]==="-"){
   const op=input[i++];
   const next=product();
   v=op==="+"?v+next:v-next;
  }
  return v;
 }

 if(!/^[0-9+*/().-]+$/.test(input)){
  throw Error("Таңба қатесі");
 }

 const result=sum();
 if(i!==input.length||!Number.isFinite(result)){
  throw Error("Өрнек қатесі");
 }

 return Number(result.toPrecision(12));
}

$("calcKeys").addEventListener("click",e=>{

 const k=b.dataset.key;
 if(k==="C"){
  calcText="";
 }else if(k==="⌫"){
  calcText=calcText.slice(0,-1);
 }else if(k==="="){
  try{
   calcText=String(calculate(calcText));
  }catch(e){
   calcText="Қате";
  }
 }else{
  if(calcText==="Қате")calcText="";
  calcText+=k;
 }
 $("calcDisplay").value=calcText;
});

/* 16. КАЛЬКУЛЯТОРДЫ ЖЫЛЖЫТУ */

function clamp(v,min,max){
 return Math.max(min,Math.min(max,v));
}

function fitCalculator(){
 if(calculator.hidden)return;
 const r=calculator.getBoundingClientRect();

 calculator.style.left=clamp(
  r.left,0,Math.max(0,innerWidth-r.width)
 )+"px";

 calculator.style.top=clamp(
  r.top,0,Math.max(0,innerHeight-r.height)
 )+"px";
}

let drag=null;
let suppressClick=false;

calculator.addEventListener("pointerdown",e=>{
 if(drag||(e.pointerType==="mouse"&&e.button!==0)){
  return;
 }

 const r=calculator.getBoundingClientRect();
 drag={
  id:e.pointerId,
  x:e.clientX,
  y:e.clientY,
  left:r.left,
  top:r.top,
  moved:false
 };

 calculator.setPointerCapture(e.pointerId);
});

calculator.addEventListener("pointermove",e=>{
 if(!drag||drag.id!==e.pointerId)return;

 const dx=e.clientX-drag.x;
 const dy=e.clientY-drag.y;

 if(!drag.moved&&Math.hypot(dx,dy)>7){
  drag.moved=true;
  calculator.classList.add("dragging");
 }
 if(!drag.moved)return;

 calculator.style.left=clamp(
  drag.left+dx,0,
  Math.max(0,innerWidth-calculator.offsetWidth)
 )+"px";

 calculator.style.top=clamp(
  drag.top+dy,0,
  Math.max(0,innerHeight-calculator.offsetHeight)
 )+"px";
});

calculator.addEventListener("pointerup",e=>{
 if(!drag||drag.id!==e.pointerId)return;

 suppressClick=drag.moved;
 drag=null;
 calculator.classList.remove("dragging");

 if(calculator.hasPointerCapture(e.pointerId)){
  calculator.releasePointerCapture(e.pointerId);
 }
});

calculator.addEventListener("pointercancel",()=>{
 drag=null;
 calculator.classList.remove("dragging");
});

calculator.addEventListener("click",e=>{
 if(!suppressClick)return;
 e.preventDefault();
 e.stopImmediatePropagation();
 suppressClick=false;
},true);

window.addEventListener("resize",fitCalculator);

const elements=elementData.trim()
 .split(/\s+/)
 .map((entry,i)=>{
  const [symbol,name]=entry.split("|");
  return{z:i+1,symbol,name};
 });

const rowGroups=[
 [1,18],
 [1,2,13,14,15,16,17,18],
 [1,2,13,14,15,16,17,18],
 Array.from({length:18},(_,i)=>i+1),
 Array.from({length:18},(_,i)=>i+1)
];

function position(z){
 if(z<=54){
  let k=z-1;
  for(let p=0;p<5;p++){
   if(k<rowGroups[p].length){
    return{row:p+1,col:rowGroups[p][k]};
   }
   k-=rowGroups[p].length;
  }
 }

 if(z<=56)return{row:6,col:z-54};
 if(z<=71)return{row:9,col:z-54};
 if(z<=86)return{row:6,col:z-68};
 if(z<=88)return{row:7,col:z-86};
 if(z<=103)return{row:10,col:z-86};
 return{row:7,col:z-100};
}

function buildTable(){
 let html="";

 for(let g=1;g<=18;g++){
  html+=`
   <span class="period-label"
    style="grid-row:1;grid-column:${g+1}">
    ${g}
   </span>
  `;
 }

 for(let p=1;p<=7;p++){
  html+=`
   <span class="period-label"
    style="grid-row:${p+1};grid-column:1">
    ${p}
   </span>
  `;
 }

 html+=`
  <span class="period-label"
   style="grid-row:10;grid-column:1">La–Lu</span>
  <span class="period-label"
   style="grid-row:11;grid-column:1">Ac–Lr</span>
  <span class="period-label"
   style="grid-row:7;grid-column:4">57–71</span>
  <span class="period-label"
   style="grid-row:8;grid-column:4">89–103</span>
 `;

 for(const e of elements){
  const p=position(e.z);

  const cls=
   (e.z>=57&&e.z<=71)||
   (e.z>=89&&e.z<=103)
    ?"fblock"
    :["H","C","N","O","Cl","Br"].includes(e.symbol)
     ?"featured":"";

  html+=`
   <button class="element ${cls}"
    data-z="${e.z}"
    style="grid-row:${p.row+1};grid-column:${p.col+1}">
    <i>${e.z}</i>
    <b>${e.symbol}</b>
    <small>${e.name}</small>
   </button>
  `;
 }

 $("period").innerHTML=html;
}

$("period").addEventListener("click",e=>{

 if(!b)return;

 const z=Number(b.dataset.z);
 const item=elements[z-1];
 const p=position(z);

 const period=p.row===9?6:p.row===10?7:p.row;
 const group=p.row>7?"f-блок":p.col+"-топ";

 $("elementInfo").textContent=
  `${z}. ${item.name} (${item.symbol}) · `+
  `${period}-период · ${group}`;
});

  page++;draw();
 }else if(e.key==="ArrowLeft"&&page>0){
  page--;draw();
 }
});
