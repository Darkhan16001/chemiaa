
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081827">
<title>§64 — Органикалық қосылыстардың номенклатурасы</title>

<style>
:root{
  --bg:#081827;
  --panel:#153950;
  --blue:#89dcff;
  --green:#8cedc0;
  --gold:#ffdc91;
  --red:#ffb0b8;
  --text:#f7fcff;
  --muted:#c1d8e8;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:"Segoe UI",Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.blue{color:var(--blue)}
.green{color:var(--green)}
.gold{color:var(--gold)}
.red{color:var(--red)}
.center{text-align:center}

.app{
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  overflow:hidden;
  background:
    radial-gradient(circle at 88% 8%,#16779a70,transparent 43%),
    radial-gradient(circle at 8% 92%,#177d6070,transparent 44%),
    linear-gradient(125deg,#061522,#10344d,#071827);
}
.topbar{
  min-height:76px;flex-shrink:0;
  padding:10px 24px;
  display:flex;align-items:center;
  justify-content:space-between;gap:14px;
  background:#071e30;
  border-bottom:1px solid #73a4c0;
}
.brand{display:flex;flex-direction:column;gap:4px}
.brand strong{
  color:var(--blue);font-size:29px;font-weight:900;
}
.brand small{
  color:var(--gold);font-size:13px;font-weight:900;
}
.topinfo{
  display:flex;align-items:center;gap:17px;
  font-weight:900;
}
#timer{
  color:var(--gold);font-size:31px;
  font-variant-numeric:tabular-nums;
}
#pageCount{color:var(--blue)}
.main{
  flex:1;min-height:0;
  overflow-y:auto;
  padding:25px 36px 35px;
  scrollbar-color:#6598b5 #112c40;
}
.slide{
  min-height:100%;max-width:1510px;
  margin:auto;
  display:flex;flex-direction:column;
  justify-content:center;
}
h1{
  margin:9px 0 20px;
  font-size:clamp(43px,4.6vw,76px);
  line-height:1.13;
}
h2{
  margin:0 0 18px;
  font-size:clamp(32px,2.9vw,50px);
  line-height:1.2;
}
h3{
  margin:0 0 12px;
  font-size:clamp(25px,2.1vw,35px);
  color:var(--blue);
}
p,li{
  font-size:clamp(21px,1.7vw,29px);
  line-height:1.48;
}
li{margin-bottom:8px}
.subtitle{
  color:var(--blue);font-size:20px;
  font-weight:900;letter-spacing:1px;
  margin-bottom:13px;
}
.big{
  font-size:clamp(46px,5vw,78px);
  font-weight:900;
}
.hero,.grid2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  align-items:center;gap:18px;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}
.card{
  min-width:0;padding:23px 26px;
  border:1px solid #79afca;
  border-radius:19px;
  background:linear-gradient(145deg,#1b465e,#102b41);
  box-shadow:0 12px 30px #0004;
}
.card.green-card{
  background:linear-gradient(145deg,#155a46,#103d35);
  border-color:#83e9bb;
}
.card p{margin:9px 0}
.formula{
  margin:15px 0;padding:19px;
  text-align:center;
  color:var(--green);
  background:#0e4050;
  border:1px solid #74c7d6;
  border-radius:15px;
  font-size:clamp(28px,2.75vw,46px);
  font-weight:900;
  overflow-wrap:anywhere;
}
.note{
  margin-top:15px;padding:17px 20px;
  background:#1c435b;
  border-left:7px solid var(--gold);
  border-radius:12px;
  font-size:clamp(20px,1.55vw,26px);
  line-height:1.5;
}
.step{
  margin-top:8px;padding:10px 14px;
  border-radius:9px;background:#244e65;
  font-size:clamp(19px,1.5vw,25px);
}
.molecule{
  min-height:260px;
  padding:18px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:9px;
  background:#13394f;
  border:1px solid #81bbd5;
  border-radius:18px;
}
.molecule svg{
  width:100%;max-width:480px;height:210px;
}
.molecule strong{
  font-size:29px;color:var(--green);
}
.molecule p{
  margin:0;
  text-align:center;
  color:var(--muted);font-size:18px;
}
.structure{
  margin:12px 0;padding:18px;
  text-align:center;
  white-space:pre;overflow-x:auto;
  color:var(--gold);
  background:#0a2f43;
  border:1px solid #76b7d2;
  border-radius:13px;
  font:700 clamp(20px,2vw,35px)/1.5
    Consolas,"Courier New",monospace;
}
.steps-flow{
  display:flex;flex-wrap:wrap;
  gap:10px;align-items:center;
  justify-content:center;
  padding:19px;
  background:#12394e;
  border:1px solid #78b6d0;
  border-radius:16px;
}
.steps-flow span{
  padding:14px;
  color:var(--green);
  background:#275b6d;
  border-radius:11px;
  font-size:clamp(21px,1.7vw,29px);
  font-weight:900;
}
.steps-flow b{color:var(--gold);font-size:27px}
.chem-table{width:100%;border-collapse:collapse}
.chem-table th,.chem-table td{
  text-align:left;padding:12px;
  border-bottom:1px solid #6d9fbc;
  font-size:clamp(19px,1.5vw,26px);
}
.chem-table th{color:var(--blue)}
.task{
  padding:14px 19px;
  margin-bottom:11px;
  background:#173e57;
  border:1px solid #70a6c0;
  border-radius:12px;
}
.task p{margin:5px 0}
.question{
  font-size:clamp(30px,2.8vw,47px);
  font-weight:900;
  line-height:1.42;
}
.answer{
  margin-top:15px;padding:18px;
  background:#105340;
  border:1px solid #81ecc0;
  border-radius:15px;
  font-size:clamp(22px,1.85vw,30px);
  line-height:1.5;
}
.number-tag{
  display:inline-block;
  padding:12px 21px;
  background:#6b532e;
  border:2px solid var(--gold);
  border-radius:14px;
  font-size:clamp(26px,2.55vw,42px);
  font-weight:900;
}
.progress{
  height:13px;margin-top:14px;
  overflow:hidden;border-radius:20px;
  background:#284c62;
}
.progress div{
  height:100%;
  background:linear-gradient(90deg,#20a6d6,#7debbc);
}
.problem{
  margin-top:18px;padding:27px;
  border:2px solid #81cde8;
  border-radius:19px;
  background:linear-gradient(145deg,#14516a,#10354b);
}
.actions{
  margin-top:18px;
  display:flex;flex-wrap:wrap;gap:12px;
}
.team{
  padding:18px;
  text-align:center;
  border:1px solid #79abc9;
  border-radius:17px;
  background:#173e56;
}
.team .score{
  font-size:56px;
  font-weight:900;color:var(--gold);
}
.team.active{
  outline:4px solid var(--gold);
  box-shadow:0 0 25px #ffdc9160;
}
.options{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.option{
  padding:19px 15px;
  text-align:left;color:white;
  background:#255671;
  border:2px solid #7db6d1;
  border-radius:13px;
  font-size:clamp(21px,1.7vw,29px);
  font-weight:900;
}
.option.correct{
  background:#177958;
  border-color:#a2f6cf;
}
.option.wrong{
  background:#8e4252;
  border-color:#ffb0b8;
}
.home-row{
  padding:15px 19px;
  margin-bottom:12px;
  background:#173e57;
  border-left:6px solid var(--blue);
  border-radius:12px;
}
.home-row p{margin:5px 0}
.footer{
  min-height:90px;flex-shrink:0;
  padding:10px 24px;
  display:flex;align-items:center;
  justify-content:space-between;gap:14px;
  background:#081d30;
  border-top:1px solid #6b9cba;
}
.navigation{display:flex;gap:10px}
.signature{
  display:flex;flex-direction:column;
  align-items:center;gap:4px;
}
.signature strong{
  font-size:32px;
  color:var(--gold);
  font-weight:900;letter-spacing:3px;
}
.signature small{font-size:13px;color:var(--muted)}
.clock{
  padding:8px 15px;
  border:1px solid #6fa4bf;
  border-radius:12px;
  background:#12384e;
  text-align:center;
}
#clock{
  display:block;font-size:28px;
  color:var(--blue);
  font-variant-numeric:tabular-nums;
}
.clock small{color:var(--muted);font-size:12px}
.btn{
  padding:12px 19px;
  background:#295d7b;
  border:1px solid #83b1cd;
  border-radius:11px;
  color:white;
  font-size:19px;font-weight:900;
}
.btn.primary{background:#0b91b0;border-color:#8ce9ff}
.btn.success{background:#147d5e;border-color:#8aefc1}
.btn.warning{background:#956c31;border-color:#ffdb91}
.tools{
  position:fixed;
  left:11px;bottom:110px;z-index:50;
  display:flex;flex-direction:column;
  gap:7px;align-items:flex-start;
}
.tool-btn{
  background:#1282a2;color:white;
  border:1px solid #88dffb;
  border-radius:9px;
  padding:9px 12px;
  font-size:13px;font-weight:900;
}
.tool-btn.green-btn{
  background:#187c5a;
  border-color:#8aebbd;
}

/* ЖЫЛЖЫМАЛЫ КАЛЬКУЛЯТОР */

.calculator{
  position:fixed;z-index:1200;
  left:15px;top:105px;
  width:190px;max-width:calc(100vw - 12px);
  padding:7px;color:white;
  background:#103149;
  border:1px solid #85ddff;
  border-radius:12px;
  box-shadow:0 20px 45px #000b;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  cursor:grab;
}
.calculator *{touch-action:none}
.calculator.dragging{cursor:grabbing}
.calc-head{
  display:flex;align-items:center;
  justify-content:space-between;
  gap:5px;padding:5px;margin-bottom:6px;
  background:#27546c;
  border-radius:7px;font-size:11px;
}
.close{
  padding:4px 8px;
  color:white;background:#b64a5a;
  border:0;border-radius:6px;
}
#calcDisplay{
  width:100%;height:38px;
  padding:5px;
  border:1px solid #7baac6;
  border-radius:7px;
  background:#061b2d;color:white;
  text-align:right;font-size:17px;
}
.calc-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:3px;margin-top:5px;
}
.calc-grid button{
  min-width:0;height:32px;
  padding:1px;background:#2a5e7a;
  border:1px solid #70a4bd;
  border-radius:6px;
  color:white;font-size:14px;font-weight:900;
}
.calc-hint{
  margin-top:5px;
  color:var(--muted);
  font-size:10px;text-align:center;
}

/* ПЕРИОДТЫҚ КЕСТЕ */

.overlay{
  position:fixed;inset:0;z-index:2000;
  display:flex;align-items:center;
  justify-content:center;
  padding:12px;background:#000d;
}
.periodic-panel{
  width:min(1600px,99vw);
  max-height:97vh;overflow:auto;
  padding:17px;
  border:1px solid #79acc8;
  border-radius:18px;
  background:#0e293f;
}
.modal-head{
  display:flex;align-items:flex-start;
  justify-content:space-between;gap:12px;
}
.modal-head p{font-size:17px}
.periodic-scroll{
  overflow:auto;padding:12px;
  background:#061d2e;border-radius:12px;
}
.periodic-grid{
  display:grid;min-width:1840px;
  grid-template-columns:56px repeat(18,minmax(95px,1fr));
  grid-template-rows:45px repeat(10,100px);
  gap:5px;
}
.period-label,.group-label{
  display:grid;place-items:center;
  padding:4px;
  background:#1b4b65;color:var(--gold);
  border:1px solid #74b6d1;
  border-radius:8px;
  font-weight:900;text-align:center;
}
.element{
  position:relative;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;padding:12px 3px 4px;
  background:#246582;color:white;
  border:1px solid #92c2d9;border-radius:8px;
}
.element .number{
  position:absolute;top:3px;left:5px;
  font-size:12px;
}
.element .symbol{font-size:28px;font-weight:900}
.element .ename{font-size:12px;text-align:center}
.element .mass{font-size:12px;color:#def1ff}
.element.highlight{background:#995371}
.element.noble{background:#6a54a2}
.element.lanth{background:#357e8c}
.element.act{background:#85576d}
.element-info{
  margin-top:12px;padding:15px;
  background:#194860;
  border-radius:11px;
  font-size:21px;line-height:1.5;
}

@media(max-width:950px){
  .hero,.grid2,.grid3{grid-template-columns:1fr}
}
@media(max-width:700px){
  .topbar{padding:9px}
  .brand strong{font-size:18px}
  .brand small,#sectionName{display:none}
  .topinfo{gap:8px;font-size:13px}
  #timer{font-size:21px}
  .main{padding:13px}
  h1{font-size:35px}
  h2{font-size:29px}
  h3{font-size:24px}
  p,li{font-size:19px}
  .card{padding:16px}
  .problem{padding:16px}
  .footer{min-height:79px;padding:7px}
  .navigation{gap:4px}
  .signature strong{font-size:16px;letter-spacing:0}
  .signature small{display:none}
  .clock{padding:5px 6px}
  #clock{font-size:16px}
  .clock small{font-size:10px}
  .btn{padding:8px;font-size:13px}
  .tools{left:8px;bottom:94px}
  .tool-btn{padding:8px;font-size:12px}
  .options{grid-template-columns:1fr}
}
</style>
</head>

<div class="app">

  <header class="topbar">

    </div>

    <div class="topinfo">
      <span id="sectionName">Кіріспе</span>

      <small>Алматы уақыты</small>

</div>

    🧮 Калькулятор
  </button>

  <button id="tableOpen" class="tool-btn green-btn">

  </button>
</div>

<div id="calculator" class="calculator hidden">
  <div class="calc-head">
    <strong>🧮 Калькулятор</strong>
    <button id="calcClose" class="close"
      aria-label="Жабу">✕</button>

    aria-label="Есептеу нәтижесі">

  </div>

  <div class="periodic-panel">
    <div class="modal-head">
      <div>
        <h2>Менделеевтің периодтық кестесі</h2>
        <p>118 элемент · 18 топ · 7 период</p>
      </div>

      <button id="tableClose" class="close"
        aria-label="Жабу">✕</button>
    </div>

    <div class="periodic-scroll">
      <div id="periodicGrid" class="periodic-grid"></div>
    </div>

      Элементті таңдап, мәліметін көр.
    </div>

<script>
"use strict";

/* ==========================================
  §64 ОРГАНИКАЛЫҚ ҚОСЫЛЫСТАРДЫҢ
  НОМЕНКЛАТУРАСЫ
  БАРЛЫҒЫ БІР INDEX.HTML ФАЙЛЫНДА
========================================== */

const $=id=>document.getElementById(id);

const esc=value=>String(value).replace(
  /[&<>"']/g,
  c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c])
);

/* САҚТАУ */

const KEY="darkhan_chem64_onefile_v1";
const TIME_KEY=KEY+"_timer";

function initial(){
  return{
    levels:{},
    board:0,
    boardOpen:false,
    game:0,
    gameSelected:null,
    scores:[0,0,0],
    homeOpen:false
  };
}

let state=initial();

try{
  const previous=JSON.parse(localStorage.getItem(KEY));

  if(previous && Array.isArray(previous.scores)){
    state={...initial(),...previous};
  }
}catch(e){
  console.warn(e);
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
  }catch(e){
    console.warn(e);
  }
}

/* 80 МИНУТ ЖӘНЕ АЛМАТЫ УАҚЫТЫ */

let deadline=Number(localStorage.getItem(TIME_KEY))||null;

function remaining(){
  return deadline===null
    ?4800
    :Math.max(0,Math.ceil((deadline-Date.now())/1000));
}

function updateClock(){
  const t=remaining();

  $("timer").textContent=
    String(Math.floor(t/60)).padStart(2,"0")+
    ":"+
    String(t%60).padStart(2,"0");

  $("timer").style.color=
    t===0?"#ffb0b8":"#ffdc91";

  $("clock").textContent=
    new Intl.DateTimeFormat("en-GB",{
      timeZone:"Asia/Almaty",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hourCycle:"h23"
    }).format(new Date());
}

function startTimer(){
  if(deadline && remaining()>0)return;

  deadline=Date.now()+80*60*1000;
  localStorage.setItem(TIME_KEY,String(deadline));

  updateClock();
  render();
}

function resetTimer(){
  if(!confirm("80 минуттық таймерді қайта бастаймыз ба?"))return;

  deadline=null;
  localStorage.removeItem(TIME_KEY);

  updateClock();
  render();
}

setInterval(updateClock,1000);

/* СЛАЙД ЖҮЙЕСІ */

const slides=[];
let page=0;

function add(title,section,html){
  slides.push({title,section,html});
}

function dynamic(title,section,renderer){
  slides.push({title,section,renderer});
}

function render(){
  const s=slides[page];
  if(!s)return;

  $("slide").innerHTML=s.renderer?s.renderer():s.html;
  $("sectionName").textContent=s.section;
  $("slideTitle").textContent=s.title;
  $("pageCount").textContent=`${page+1} / ${slides.length}`;

  $("prev").disabled=page===0;
  $("next").disabled=page===slides.length-1;
  $("main").scrollTop=0;
}

function goTo(title){
  const index=slides.findIndex(s=>s.title===title);

  if(index>=0){
    page=index;
    render();
  }
}

$("prev").onclick=()=>{
  if(page>0){
    page--;
    render();
  }
};

$("next").onclick=()=>{
  if(page<slides.length-1){
    page++;
    render();
  }
};

/* КӨРНЕКІ КӨМІРТЕК ТІЗБЕКТЕРІ */

const structures={
  propane:{
    name:"Пропан",
    formula:"CH₃–CH₂–CH₃",
    atoms:[
      ["CH₃",75,108],
      ["CH₂",225,108],
      ["CH₃",375,108]
    ],
    bonds:[[0,1,1],[1,2,1]]
  },
  methylpropane:{
    name:"2-метилпропан",
    formula:"CH₃–CH(CH₃)–CH₃",
    atoms:[
      ["CH₃",72,133],
      ["CH",225,133],
      ["CH₃",378,133],
      ["CH₃",225,32]
    ],
    bonds:[[0,1,1],[1,2,1],[1,3,1]]
  },
  methylbutane:{
    name:"2-метилбутан",
    formula:"CH₃–CH(CH₃)–CH₂–CH₃",
    atoms:[
      ["CH₃",52,137],
      ["CH",163,137],
      ["CH₂",280,137],
      ["CH₃",404,137],

function structureSVG(key){
  const m=structures[key]||structures.methylpropane;

  const bonds=m.bonds.map(([a,b,order])=>{
    const x=m.atoms[a],y=m.atoms[b];
    const dx=y[1]-x[1];
    const dy=y[2]-x[2];
    const len=Math.hypot(dx,dy)||1;

    const ux=dx/len,uy=dy/len;
    const nx=-uy,ny=ux;

    const gapA=x[0]==="C"?22:40;
    const gapB=y[0]==="C"?22:40;
    const startX=x[1]+ux*gapA;
    const startY=x[2]+uy*gapA;
    const endX=y[1]-ux*gapB;
    const endY=y[2]-uy*gapB;

    const offsets=order===3?[-8,0,8]:
      order===2?[-6,6]:[0];

    return offsets.map(offset=>`
      <line
        x1="${startX+nx*offset}"
        y1="${startY+ny*offset}"
        x2="${endX+nx*offset}"
        y2="${endY+ny*offset}"
        stroke="#89edc0"
        stroke-width="5"
        stroke-linecap="round"
      />
    `).join("");
  }).join("");

  const atoms=m.atoms.map(atom=>`
    <text
      x="${atom[1]}" y="${atom[2]+9}"
      font-size="28"
      font-weight="900"
      fill="#f4fbff"
      text-anchor="middle"
    >${esc(atom[0])}</text>
  `).join("");

  return `
    <div class="molecule">
      <svg viewBox="0 0 460 250"
        role="img"
        aria-label="${esc(m.name)} құрылымы">
        ${bonds}${atoms}
      </svg>

      <strong>${esc(m.name)}</strong>
      <p>${esc(m.formula)}</p>
    </div>
  `;
}

function algorithm(){
  const items=[
    "Негізгі тізбек",
    "Нөмірлеу",
    "Орынбасар",
    "Атау"
  ];

  return `
    <div class="steps-flow">
      ${items.map((item,i)=>`
        ${i?'<b>→</b>':""}
        <span>${item}</span>
      `).join("")}
    </div>
  `;
}

          if(j===question.answer)css="correct";
          else if(j===selected)css="wrong";
        }

        return `
          <button class="option ${css}"

            onclick="chooseAnswer(${j})">

        `;

        onclick="nextGame()">

      </button>
    `:`

const calculator=$("calculator");
const calcDisplay=$("calcDisplay");

let calcText="";

const calcKeys=[
  "7","8","9","÷",
  "4","5","6","×",
  "1","2","3","−",
  "C","0",".","+",
  "(",")","⌫","="
];

`).join("");

$("calcOpen").onclick=()=>{

function calculate(src){
  if(!/^[0-9+\-*/(). ]+$/.test(src)){
    throw Error("Қате өрнек");
  }

  let pos=0;

  function skip(){
    while(src[pos]===" ")pos++;
  }

  function factor(){
    skip();

    if(src[pos]==="+"){
      pos++;
      return factor();
    }

    if(src[pos]==="-"){
      pos++;
      return -factor();
    }

    if(src[pos]==="("){
      pos++;

      const value=expression();
      skip();

      if(src[pos]!==")"){
        throw Error("Жақша қатесі");
      }

      pos++;
      return value;
    }

    const match=/^(?:\d+\.?\d*|\.\d+)/
      .exec(src.slice(pos));

    if(!match)throw Error("Сан қатесі");

    pos+=match[0].length;

    return Number(match[0]);
  }

  function term(){
    let value=factor();

    while(true){
      skip();

      const op=src[pos];
      if(op!=="*"&&op!=="/")break;

      pos++;

      const number=factor();

      value=op==="*"
        ?value*number
        :value/number;
    }

    return value;
  }

  function expression(){
    let value=term();

    while(true){
      skip();

      const op=src[pos];
      if(op!=="+"&&op!=="-")break;

      pos++;

      const number=term();

      value=op==="+"
        ?value+number
        :value-number;
    }

    return value;
  }

  const result=expression();

  skip();

  if(pos!==src.length||!Number.isFinite(result)){
    throw Error("Есептеу қатесі");
  }

  return Number(result.toPrecision(12));
}

$("calcKeys").addEventListener("click",event=>{

  }else if(k==="⌫"){
    calcText=calcText.slice(0,-1);

        .replaceAll("÷","/")

    }

});

const clamp=(v,min,max)=>
  Math.max(min,Math.min(v,max));

function keepCalcInside(){
  if(calculator.classList.contains("hidden"))return;

  const r=calculator.getBoundingClientRect();

  calculator.style.left=clamp(
    r.left,
    0,
    Math.max(0,innerWidth-r.width)
  )+"px";

  calculator.style.top=clamp(
    r.top,
    0,
    Math.max(0,innerHeight-r.height)
  )+"px";

  calculator.style.right="auto";
  calculator.style.bottom="auto";
}

let drag=null;
let suppressClick=false;

calculator.addEventListener("pointerdown",event=>{
  if(event.pointerType==="mouse" && event.button!==0)return;

  const r=calculator.getBoundingClientRect();

  drag={
    id:event.pointerId,
    x:event.clientX,
    y:event.clientY,
    left:r.left,
    top:r.top,
    moved:false
  };

  calculator.setPointerCapture(event.pointerId);
});

calculator.addEventListener("pointermove",event=>{
  if(!drag || drag.id!==event.pointerId)return;

  const dx=event.clientX-drag.x;
  const dy=event.clientY-drag.y;

  if(!drag.moved && Math.hypot(dx,dy)>7){
    drag.moved=true;
    calculator.classList.add("dragging");
  }

  if(!drag.moved)return;

  if(event.cancelable)event.preventDefault();

  calculator.style.left=clamp(
    drag.left+dx,
    0,
    Math.max(0,innerWidth-calculator.offsetWidth)
  )+"px";

  calculator.style.top=clamp(
    drag.top+dy,
    0,
    Math.max(0,innerHeight-calculator.offsetHeight)
  )+"px";

  calculator.style.right="auto";
  calculator.style.bottom="auto";
});

function stopCalcDrag(event){
  if(!drag || drag.id!==event.pointerId)return;

  const moved=drag.moved;
  drag=null;

  calculator.classList.remove("dragging");

  if(moved){
    suppressClick=true;

    setTimeout(()=>{
      suppressClick=false;
    },150);
  }

  if(calculator.hasPointerCapture(event.pointerId)){
    calculator.releasePointerCapture(event.pointerId);
  }
}

calculator.addEventListener("pointerup",stopCalcDrag);
calculator.addEventListener("pointercancel",stopCalcDrag);

calculator.addEventListener("click",event=>{
  if(!suppressClick)return;

  event.preventDefault();
  event.stopImmediatePropagation();
},true);

function elementPosition(z){
  if(z<=54){
    let k=z-1;

    for(let p=0;p<5;p++){
      const columns=periodColumns[p];

      if(k<columns.length){
        return{
          row:p+1,
          col:columns[k]
        };
      }

      k-=columns.length;
    }
  }

  if(z<=56)return{row:6,col:z-54};
  if(z<=71)return{row:9,col:z-53};
  if(z<=86)return{row:6,col:z-68};
  if(z<=88)return{row:7,col:z-86};
  if(z<=103)return{row:10,col:z-85};

  return{row:7,col:z-100};
}

const highlighted=new Set(["C","H","O","N"]);

const noble=new Set([
  "He","Ne","Ar","Kr","Xe","Rn","Og"
]);

function elementClass(e){
  if(highlighted.has(e.symbol))return"highlight";
  if(noble.has(e.symbol))return"noble";
  if(e.z>=57&&e.z<=71)return"lanth";
  if(e.z>=89&&e.z<=103)return"act";

  return"";
}

      89–103
    </div>
  `;

    const p=elementPosition(e.z);

    html+=`
