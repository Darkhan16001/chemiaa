<script>
"use strict";

/* ============================
   1. НЕГІЗГІ ЖҮЙЕ
============================ */

const $=id=>document.getElementById(id);

const slides=[];
let page=0;

function add(title,section,html){
 slides.push({title,section,html});
}

function dynamic(title,section,render){
 slides.push({title,section,render});
}

function draw(){
 const slide=slides[page];
 if(!slide)return;

 $("slide").innerHTML=slide.render
  ?slide.render()
  :slide.html;

 $("sectionName").textContent=slide.section;

 $("counter").textContent=
  `${page+1} / ${slides.length}`;

 $("prev").disabled=page===0;
 $("next").disabled=page===slides.length-1;
 $("main").scrollTop=0;
}

function go(title){
 const index=slides.findIndex(s=>s.title===title);
 if(index>=0){
  page=index;
  draw();
 }
}

$("prev").onclick=()=>{
 if(page>0){
  page--;
  draw();
 }
};

$("next").onclick=()=>{
 if(page<slides.length-1){
  page++;
  draw();
 }
};

/* ============================
   2. ПРОГРЕСТІ САҚТАУ
============================ */

const STORE="darkhan_chem84_nucleophilic_v2";

function fresh(){
 return{
  levels:{},
  oral:0,
  oralShow:false,
  game:0,
  choice:null,
  scores:[0,0,0],
  home:false,
  mechanism:0
 };
}

let state=fresh();

try{
 const old=JSON.parse(
  localStorage.getItem(STORE)
 );

 if(
  old &&
  Array.isArray(old.scores) &&
  old.scores.length===3
 ){
  state={...fresh(),...old};
 }
}catch(error){
 console.warn(error);
}

function save(){
 try{
  localStorage.setItem(
   STORE,
   JSON.stringify(state)
  );
 }catch(error){
  console.warn(error);
 }
}

   3. КӨРНЕКІ СЫЗБА
============================ */

    </g>

    <path d="M245 114 H374"

    <g fill="white" text-anchor="middle"
     font-weight="bold" font-size="26">
     <text x="104" y="123">C</text>

     <text x="427" y="123">C</text>

    </g>

    <g fill="#ffdc92"

   <strong>

   <p>Нуклеофильді орынбасудың теориялық моделі</p>

/* ============================
   4. КІРІСПЕ
============================ */

 {

/* АРИФМЕТИКАЛЫҚ ПАРСЕР */

function calculate(input){
 let i=0;

 function factor(){
  if(input[i]==="+"){
   i++;
   return factor();
  }

  if(input[i]==="-"){
   i++;
   return -factor();
  }

  if(input[i]==="("){
   i++;
   const value=sum();

   if(input[i]!==")"){
    throw Error("Жақша қатесі");
   }

   i++;
   return value;
  }

  const m=/^(?:\d+\.?\d*|\.\d+)/
   .exec(input.slice(i));

  if(!m){
   throw Error("Сан қатесі");
  }

  i+=m[0].length;
  return Number(m[0]);
 }

 function product(){
  let value=factor();

  while(
   input[i]==="*" ||
   input[i]==="/"
  ){
   const op=input[i++];
   const next=factor();

   value=op==="*"
    ?value*next
    :value/next;
  }

  return value;
 }

 function sum(){
  let value=product();

  while(
   input[i]==="+" ||
   input[i]==="-"
  ){
   const op=input[i++];
   const next=product();

   value=op==="+"
    ?value+next
    :value-next;
  }

  return value;
 }

 if(!/^[0-9+*/().-]+$/.test(input)){
  throw Error("Таңба қатесі");
 }

 const result=sum();

 if(
  i!==input.length ||
  !Number.isFinite(result)
 ){
  throw Error("Өрнек қатесі");
 }

 return Number(result.toPrecision(12));
}

 }else if(k==="⌫"){

 }else if(k==="="){

  }catch(error){
   calcText="Қате";
  }
 }else{
  if(calcText==="Қате"){
   calcText="";
  }
  calcText+=k;
 }

 $("calcDisplay").value=calcText;

function clamp(v,min,max){

function fitCalculator(){
 if(calculator.hidden)return;

 const r=calculator.getBoundingClientRect();

 calculator.style.left=clamp(
  r.left,0,
  Math.max(0,innerWidth-r.width)
 )+"px";

 calculator.style.top=clamp(
  r.top,0,
  Math.max(0,innerHeight-r.height)
 )+"px";
}

let drag=null;
let suppressClick=false;

calculator.addEventListener("pointerdown",event=>{
 if(
  drag ||
  (event.pointerType==="mouse"&&event.button!==0)
 )return;

 const r=calculator.getBoundingClientRect();

 drag={
  id:event.pointerId,
  x:event.clientX,
  y:event.clientY,
  left:r.left,
  top:r.top,
  moved:false
 };

 calculator.setPointerCapture(event.pointerId);
});

calculator.addEventListener("pointermove",event=>{
 if(!drag||drag.id!==event.pointerId)return;

 const dx=event.clientX-drag.x;
 const dy=event.clientY-drag.y;

 if(!drag.moved&&Math.hypot(dx,dy)>7){
  drag.moved=true;
  calculator.classList.add("dragging");
 }

 if(!drag.moved)return;

 calculator.style.left=clamp(
  drag.left+dx,0,
  Math.max(
   0,
   innerWidth-calculator.offsetWidth
  )
 )+"px";

 calculator.style.top=clamp(
  drag.top+dy,0,
  Math.max(
   0,
   innerHeight-calculator.offsetHeight
  )
 )+"px";
});

calculator.addEventListener("pointerup",event=>{
 if(!drag||drag.id!==event.pointerId)return;

 suppressClick=drag.moved;
 drag=null;
 calculator.classList.remove("dragging");

 if(calculator.hasPointerCapture(event.pointerId)){
  calculator.releasePointerCapture(event.pointerId);
 }
});

calculator.addEventListener("pointercancel",()=>{
 drag=null;
 calculator.classList.remove("dragging");
});

calculator.addEventListener("click",event=>{
 if(!suppressClick)return;

 event.preventDefault();
 event.stopImmediatePropagation();
 suppressClick=false;
},true);

  html+=`
   <span class="period-label"
    style="grid-row:1;grid-column:${g+1}">
    ${g}
   </span>
  `;
 }

 for(let p=1;p<=7;p++){
  html+=`
   <span class="period-label"
    style="grid-row:${p+1};grid-column:1">
    ${p}
   </span>
  `;
 }

 html+=`
  <span class="period-label"
   style="grid-row:10;grid-column:1">
   La–Lu
  </span>

  <span class="period-label"
   style="grid-row:11;grid-column:1">
   Ac–Lr
  </span>

  <span class="period-label"
   style="grid-row:7;grid-column:4">
   57–71
  </span>

  <span class="period-label"
   style="grid-row:8;grid-column:4">
   89–103
  </span>
 `;

 for(const e of elements){
  const p=position(e.z);

  const cls=
   (e.z>=57&&e.z<=71) ||
   (e.z>=89&&e.z<=103)
    ?"fblock"
    :["H","C","N","O","Cl","Br"].includes(e.symbol)
     ?"featured"
     :"";

  html+=`
   <button
    class="element ${cls}"
    data-z="${e.z}"
    style="
     grid-row:${p.row+1};
     grid-column:${p.col+1}
    "
   >
    <i>${e.z}</i>
    <b>${e.symbol}</b>
    <small>${e.name}</small>
   </button>
  `;
 }

 $("period").innerHTML=html;
}

$("period").addEventListener("click",event=>{
 const b=event.target.closest("[data-z]");
 if(!b)return;

 const z=Number(b.dataset.z);
 const e=elements[z-1];
 const p=position(z);

 const period=p.row===9?6:p.row===10?7:p.row;
 const group=p.row>7?"f-блок":p.col+"-топ";

 $("elementInfo").textContent=
  `${z}. ${e.name} (${e.symbol}) · `+
  `${period}-период · ${group}`;
});

$("showTable").onclick=()=>{
 $("tableOverlay").hidden=false;
};

$("closeTable").onclick=()=>{
 $("tableOverlay").hidden=true;
};

$("tableOverlay").onclick=event=>{
 if(event.target===$("tableOverlay")){
  $("tableOverlay").hidden=true;
 }
};

/* ============================
   18. ПЕРНЕТАҚТАМЕН БАСҚАРУ
============================ */

document.addEventListener("keydown",event=>{
 if(event.key==="Escape"){
  $("tableOverlay").hidden=true;
  calculator.hidden=true;
  return;
 }

 if(!$("tableOverlay").hidden)return;
 if(event.target.closest("input,textarea"))return;

 if(
  event.key==="ArrowRight" &&
  page<slides.length-1
 ){
  page++;
  draw();
 }else if(
  event.key==="ArrowLeft" &&
  page>0
 ){
  page--;
  draw();
 }
});

/* ============================
   19. САЙТТЫ ТЕКСЕРУ
============================ */

try{
 const checks=[
  [theory.length===15,"15 түсіндірме"],
  [notes.length===3,"3 конспект"],
  [levels.length===4,"4 деңгей"],
  [oral.length===25,"25 жеке тапсырма"],
  [quiz.length===15,"15 ойын сұрағы"],
  [slides.length===29,"29 бет"],
  [elements.length===118,"118 элемент"],
  [calculate("7*3")===21,"Көбейту"],
  [calculate("(2+3)*4")===20,"Жақша"],
  [calculate("142.5/95")===1.5,"Бөлшек есеп"]
 ];

 for(const [ok,name] of checks){
  if(!ok){
   throw Error(name+" қатесі");
  }
 }

 buildTable();
 tick();
 draw();

 console.log(
  "§84 — бастапқы тексерулер өтті"
 );
}catch(error){
 console.error(error);

 const box=document.createElement("div");
 box.className="note";
 box.textContent="Сайт қатесі: "+error.message;

 $("slide").appendChild(box);
}
</script>
</body>
</html>
