
<!DOCTYPE html>

<title>§63 | Органикалық қосылыстардың жіктелуі</title>

<style>
:root{
  --bg:#071827;
  --blue:#8bddff;
  --green:#8df0c0;
  --gold:#ffda90;
  --red:#ffadb7;
  --white:#f7fcff;

}

html,body{
  width:100%;height:100%;margin:0;
  background:var(--bg);

  font-family:"Segoe UI",Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}

.green{color:var(--green)}

h1{

/* ЖЫЛЖЫМАЛЫ КАЛЬКУЛЯТОР */

.calculator{
  position:fixed;
  z-index:1200;
  top:105px;
  left:15px;
  width:190px;
  max-width:calc(100vw - 12px);
  padding:7px;

  background:#103149;
  border:1px solid #84ddff;
  border-radius:12px;

}

.calc-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  width:100%;
  height:38px;
  padding:5px;

  border-radius:7px;

  text-align:right;
  font-size:17px;
}

  border-radius:6px;

  position:fixed;

  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  background:#000d;

.periodic-panel{

  border-radius:18px;

  justify-content:space-between;

.period-label,.group-label{
  display:grid;
  place-items:center;

.element{

</style>

<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <strong>⚗ CHEMISTRY PRO</strong>
      <small>§63 · ОРГАНИКАЛЫҚ ҚОСЫЛЫСТАРДЫҢ ЖІКТЕЛУІ</small>
    </div>

    <div class="topinfo">
      <span id="sectionName">Кіріспе</span>
      <strong id="timer">80:00</strong>
      <span id="pageCounter">1 / 1</span>
    </div>
  </header>

  <main id="main" class="main">
    <section id="slide" class="slide"></section>
  </main>

  <footer class="footer">
    <div class="navigation">
      <button id="prev" class="btn">← Артқа</button>
      <button id="next" class="btn primary">Келесі →</button>
    </div>

    <div class="signature">
      <strong>BY DARKHAN</strong>
      <small id="slideTitle">§63 · Жіктелуі</small>
    </div>

    <div class="clock">
      <strong id="clock">00:00:00</strong>
      <small>Алматы уақыты</small>
    </div>
  </footer>
</div>

<div class="tools">
  <button id="calcOpen" class="tool-btn">
    🧮 Калькулятор
  </button>
  <button id="tableOpen" class="tool-btn green-btn">
    ⚛ Менделеев кестесі
  </button>
</div>

<div id="calculator" class="calculator hidden">
  <div class="calc-head">
    <strong>🧮 Калькулятор</strong>
    <button id="calcClose" class="close" aria-label="Жабу">
      ✕
    </button>
  </div>

  <input id="calcDisplay" readonly aria-label="Есептеу нәтижесі">
  <div id="calcKeys" class="calc-grid"></div>

  <div class="calc-hint">
    Кез келген жерінен ұстап жылжыт
  </div>
</div>

<div id="periodicModal" class="overlay hidden">
  <div class="periodic-panel">
    <div class="modal-head">
      <div>
        <h2>Менделеевтің периодтық кестесі</h2>
        <p>118 элемент · 18 топ · 7 период</p>
      </div>
      <button id="tableClose" class="close" aria-label="Жабу">
        ✕
      </button>
    </div>

    <div class="periodic-scroll">
      <div id="periodicGrid" class="periodic-grid"></div>
    </div>

    <div id="elementInfo" class="element-info">
      Элементті таңдап, мәліметін көр.
    </div>
  </div>
</div>

<script>
"use strict";

/* ==========================================
   §63 ОРГАНИКАЛЫҚ ҚОСЫЛЫСТАРДЫҢ ЖІКТЕЛУІ
   80 МИНУТ · BY DARKHAN
========================================== */

const $=id=>document.getElementById(id);

const esc=value=>String(value).replace(
  /[&<>"']/g,
  c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c])
);

/* САҚТАУ */

const KEY="darkhan_chem63_onefile_v1";
const TIME_KEY=KEY+"_timer";

const initialState=()=>({
  levels:{},
  board:0,
  boardAnswer:false,
  game:0,
  selected:null,
  scores:[0,0,0],
  homework:false
});

let state=initialState();

try{
  const old=JSON.parse(localStorage.getItem(KEY));
  if(old && Array.isArray(old.scores)){
    state={...initialState(),...old};
  }
}catch(e){
  console.warn("Жад қатесі:",e);
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
  }catch(e){
    console.warn(e);
  }
}

/* УАҚЫТ */

let deadline=Number(localStorage.getItem(TIME_KEY))||null;

function remaining(){
  return deadline===null
    ?4800
    :Math.max(0,Math.ceil((deadline-Date.now())/1000));
}

function updateClock(){
  const t=remaining();

  $("timer").textContent=
    String(Math.floor(t/60)).padStart(2,"0")+
    ":"+
    String(t%60).padStart(2,"0");

  $("timer").style.color=t===0?"#ffadb7":"#ffda90";

  $("clock").textContent=
    new Intl.DateTimeFormat("en-GB",{
      timeZone:"Asia/Almaty",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hourCycle:"h23"
    }).format(new Date());
}

function startTimer(){
  if(deadline&&remaining()>0)return;

  deadline=Date.now()+80*60*1000;
  localStorage.setItem(TIME_KEY,String(deadline));
  updateClock();
  render();
}

function resetTimer(){
  if(!confirm("Таймерді қайта бастаймыз ба?"))return;

  deadline=null;
  localStorage.removeItem(TIME_KEY);
  updateClock();
  render();
}

setInterval(updateClock,1000);

/* СЛАЙД ЖҮЙЕСІ */

const slides=[];
let page=0;

function add(title,section,html){
  slides.push({title,section,html});
}

function dynamic(title,section,renderer){
  slides.push({title,section,renderer});
}

function render(){
  const s=slides[page];
  if(!s)return;

  $("slide").innerHTML=s.renderer?s.renderer():s.html;
  $("sectionName").textContent=s.section;
  $("slideTitle").textContent=s.title;
  $("pageCounter").textContent=`${page+1} / ${slides.length}`;

  $("prev").disabled=page===0;
  $("next").disabled=page===slides.length-1;
  $("main").scrollTop=0;
}

function goTo(title){
  const i=slides.findIndex(s=>s.title===title);
  if(i>=0){
    page=i;
    render();
  }
}

$("prev").onclick=()=>{
  if(page>0){
    page--;
    render();
  }
};

/* МОЛЕКУЛА СЫЗБАСЫ */

const models={
  methane:{
    title:"Метан",
    formula:"CH₄",
    atoms:[
      ["C",225,99],
      ["H",225,25],
      ["H",225,174],
      ["H",142,99],
      ["H",308,99]
    ],
    bonds:[[0,1],[0,2],[0,3],[0,4]]
  },
  ethene:{
    title:"Этен",
    formula:"C₂H₄",
    atoms:[
      ["C",164,100],
      ["C",286,100],
      ["H",98,44],
      ["H",98,157],
      ["H",352,44],
      ["H",352,157]
    ],
    bonds:[[0,1,2],[0,2,1],[0,3,1],[1,4,1],[1,5,1]]
  },
  ethanol:{
    title:"Этанол",
    formula:"C₂H₅OH",
    atoms:[
      ["C",107,100],
      ["C",206,100],
      ["O",306,100],
      ["H",39,100],
      ["H",107,28],
      ["H",107,172],
      ["H",206,28],
      ["H",206,172],
      ["H",392,100]
    ],
    bonds:[
      [0,1],[1,2],[0,3],[0,4],[0,5],
      [1,6],[1,7],[2,8]
    ]
  },
  ethyne:{
    title:"Этин",
    formula:"C₂H₂",
    atoms:[
      ["H",72,100],
      ["C",173,100],
      ["C",277,100],
      ["H",378,100]
    ],
    bonds:[[0,1,1],[1,2,3],[2,3,1]]
  }
};

function molecule(kind){
  const m=models[kind]||models.methane;

  let lines="";

  for(const bond of m.bonds){
    const a=m.atoms[bond[0]];
    const b=m.atoms[bond[1]];
    const order=bond[2]||1;

    const dx=b[1]-a[1];
    const dy=b[2]-a[2];
    const length=Math.hypot(dx,dy)||1;

    const nx=-dy/length;
    const ny=dx/length;

    const offsets=order===3?[-8,0,8]:
      order===2?[-6,6]:[0];

    for(const o of offsets){
      lines+=`
        <line
          x1="${a[1]+nx*o}"
          y1="${a[2]+ny*o}"
          x2="${b[1]+nx*o}"
          y2="${b[2]+ny*o}"
          stroke="#ffda90"
          stroke-width="5"
          stroke-linecap="round"
        />
      `;
    }
  }

  const atoms=m.atoms.map(a=>{
    const fill=a[0]==="O"?"#ec596c":
      a[0]==="H"?"#e5f6ff":"#263f54";

    const textColor=a[0]==="H"?"#173147":"white";

    return `
      <circle cx="${a[1]}" cy="${a[2]}"
        r="23" fill="${fill}"
        stroke="#8bddff" stroke-width="3"/>

      <text x="${a[1]}" y="${a[2]+8}"
        text-anchor="middle"
        font-size="22" font-weight="900"
        fill="${textColor}">${a[0]}</text>
    `;
  }).join("");

  return `
    <div class="molecule">
      <svg viewBox="0 0 450 200"
        role="img" aria-label="${esc(m.title)} моделі">
        ${lines}${atoms}
      </svg>

      <strong>${m.formula}</strong>
      <p>${m.title} молекуласының көрнекі моделі</p>
    </div>
  `;
}

/* Арифметикалық өрнектерді есептеу */

function calculate(src){
  if(!/^[0-9+\-*/(). ]+$/.test(src)){
    throw Error("Қате өрнек");
  }

  let pos=0;

  function skip(){
    while(src[pos]===" ")pos++;
  }

  function factor(){
    skip();

    if(src[pos]==="+"){
      pos++;
      return factor();
    }

    if(src[pos]==="-"){
      pos++;
      return -factor();
    }

    if(src[pos]==="("){
      pos++;
      const v=expression();
      skip();

      if(src[pos]!==")")throw Error("Жақша қатесі");

      pos++;
      return v;
    }

    const m=/^(?:\d+\.?\d*|\.\d+)/
      .exec(src.slice(pos));

    if(!m)throw Error("Сан қатесі");

    pos+=m[0].length;
    return Number(m[0]);
  }

  function term(){
    let v=factor();

    while(true){
      skip();

      const op=src[pos];
      if(op!=="*"&&op!=="/")break;

      pos++;
      const b=factor();

      v=op==="*"?v*b:v/b;
    }

    return v;
  }

  function expression(){
    let v=term();

    while(true){
      skip();

      const op=src[pos];
      if(op!=="+"&&op!=="-")break;

      pos++;
      const b=term();

      v=op==="+"?v+b:v-b;
    }

    return v;
  }

  const result=expression();
  skip();

  if(pos!==src.length||!Number.isFinite(result)){
    throw Error("Есептеу қатесі");
  }

  return Number(result.toPrecision(12));
}

$("calcKeys").addEventListener("click",event=>{

  }else if(k==="⌫"){
    calcText=calcText.slice(0,-1);
  }else if(k==="="){

        .replaceAll("×","*")
        .replaceAll("÷","/")
        .replaceAll("−","-");

      calcText=String(calculate(exp));

    }
  }else{

  }

});

const clamp=(v,min,max)=>

function keepCalcInside(){
  if(calculator.classList.contains("hidden"))return;

  const r=calculator.getBoundingClientRect();

  calculator.style.left=clamp(
    r.left,0,Math.max(0,innerWidth-r.width)
  )+"px";

  calculator.style.top=clamp(
    r.top,0,Math.max(0,innerHeight-r.height)
  )+"px";
}

let drag=null;
let blockClick=false;

calculator.addEventListener("pointerdown",event=>{
  if(event.pointerType==="mouse"&&event.button!==0)return;

  const r=calculator.getBoundingClientRect();

  drag={
    id:event.pointerId,
    x:event.clientX,
    y:event.clientY,
    left:r.left,
    top:r.top,
    moved:false
  };
});

window.addEventListener("pointermove",event=>{
  if(!drag||drag.id!==event.pointerId)return;

  const dx=event.clientX-drag.x;
  const dy=event.clientY-drag.y;

  if(!drag.moved&&Math.hypot(dx,dy)>7){
    drag.moved=true;
    calculator.classList.add("dragging");
  }

  if(!drag.moved)return;
  if(event.cancelable)event.preventDefault();

  calculator.style.left=clamp(
    drag.left+dx,
    0,
    Math.max(0,innerWidth-calculator.offsetWidth)
  )+"px";

  calculator.style.top=clamp(
    drag.top+dy,
    0,
    Math.max(0,innerHeight-calculator.offsetHeight)
  )+"px";

  calculator.style.right="auto";
  calculator.style.bottom="auto";
},{passive:false});

function stopDrag(event){
  if(!drag||drag.id!==event.pointerId)return;

  const moved=drag.moved;
  drag=null;

  calculator.classList.remove("dragging");

  if(moved){
    blockClick=true;
    setTimeout(()=>blockClick=false,150);
  }
}

window.addEventListener("pointerup",stopDrag);
window.addEventListener("pointercancel",stopDrag);

calculator.addEventListener("click",event=>{
  if(!blockClick)return;

  event.preventDefault();
  event.stopImmediatePropagation();
},true);

  [1,18],
  [1,2,13,14,15,16,17,18],

  Array.from({length:18},(_,i)=>i+1),

function elementPosition(z){
  if(z<=54){
    let i=z-1;

    for(let p=0;p<5;p++){
      const cols=periodColumns[p];

      if(i<cols.length){
        return {row:p+1,col:cols[i]};
      }

      i-=cols.length;
    }
  }

  if(z<=56)return {row:6,col:z-54};
  if(z<=71)return {row:9,col:z-53};
  if(z<=86)return {row:6,col:z-68};

  if(z<=88)return {row:7,col:z-86};
  if(z<=103)return {row:10,col:z-85};

  return {row:7,col:z-100};
}

const highlighted=new Set(["C","H","O","N"]);
const noble=new Set(["He","Ne","Ar","Kr","Xe","Rn","Og"]);

function elementClass(e){
  if(highlighted.has(e.symbol))return "highlight";
  if(noble.has(e.symbol))return "noble";
  if(e.z>=57&&e.z<=71)return "lanth";
  if(e.z>=89&&e.z<=103)return "act";
  return "";
}

    html+=`

    html+=`

        ${p}
      </div>

    html+=`
