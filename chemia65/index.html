
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>§65 — Қаныққан көмірсутектер. Алкандар</title>

<style>
:root{
  --bg:#071827;
  --panel:#153950;
  --blue:#8cddff;
  --green:#87edbd;
  --gold:#ffda91;
  --red:#ffb4bd;
  --text:#f5fbff;
  --muted:#bdd7e7;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.42;cursor:not-allowed}
.hidden{display:none!important}
.blue{color:var(--blue)}
.green{color:var(--green)}
.gold{color:var(--gold)}
.red{color:var(--red)}
.center{text-align:center}

.app{
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:
    radial-gradient(circle at 90% 7%,#146e9675,transparent 43%),
    radial-gradient(circle at 6% 95%,#15795860,transparent 43%),
    linear-gradient(125deg,#071625,#10374e,#071827);
}
.topbar{
  flex-shrink:0;
  min-height:76px;
  padding:10px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  background:#071c2e;
  border-bottom:1px solid #719fbb;
}
.brand{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.brand strong{
  color:var(--blue);
  font-size:29px;
  font-weight:900;
}
.brand small{
  color:var(--gold);
  font-size:14px;
  font-weight:800;
}
.topinfo{
  display:flex;
  align-items:center;
  gap:16px;
  font-weight:900;
}
#timer{
  color:var(--gold);
  font-size:31px;
  font-variant-numeric:tabular-nums;
}
#pageCount{color:var(--blue)}

.main{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:25px 36px 40px;
  scrollbar-color:#5e97b5 #102b40;
}
.slide{
  max-width:1510px;
  min-height:100%;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
h1{
  margin:9px 0 18px;
  font-size:clamp(40px,4.5vw,76px);
  line-height:1.12;
}
h2{
  margin:0 0 17px;
  font-size:clamp(31px,2.9vw,50px);
  line-height:1.2;
}
h3{
  margin:0 0 12px;
  font-size:clamp(24px,2vw,35px);
  color:var(--blue);
}
p,li{
  font-size:clamp(21px,1.7vw,29px);
  line-height:1.5;
}
li{margin-bottom:8px}
.subtitle{
  margin-bottom:12px;
  color:var(--blue);
  font-size:20px;
  letter-spacing:1px;
  font-weight:900;
}
.big{
  font-size:clamp(45px,5vw,76px);
  font-weight:900;
}
.hero,.grid2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
  align-items:center;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}
.card{
  min-width:0;
  padding:23px 25px;
  background:linear-gradient(145deg,#1c455f,#112c42);
  border:1px solid #76abc7;
  border-radius:18px;
  box-shadow:0 10px 30px #0004;
}
.card.green-card{
  background:linear-gradient(145deg,#155a49,#103c35);
  border-color:#83e8b9;
}
.card p{margin:9px 0}
.formula{
  padding:18px;
  margin:15px 0;
  background:#0e4051;
  border:1px solid #78c1d3;
  border-radius:15px;
  color:var(--green);
  font-size:clamp(28px,2.7vw,46px);
  font-weight:900;
  text-align:center;
  overflow-wrap:anywhere;
}
.note{
  margin-top:15px;
  padding:17px 20px;
  background:#1b435c;
  border-left:7px solid var(--gold);
  border-radius:12px;
  font-size:clamp(20px,1.55vw,26px);
  line-height:1.5;
}
.step{
  margin-top:8px;
  padding:9px 13px;
  background:#285168;
  border-radius:9px;
  font-size:clamp(19px,1.5vw,25px);
}
.eq{
  margin:12px 0;
  padding:18px;
  background:#0b3045;
  border:1px solid #7bbed9;
  border-radius:13px;
  color:var(--gold);
  text-align:center;
  font-size:clamp(25px,2.4vw,40px);
  font-weight:900;
  overflow-wrap:anywhere;
}
.chem-table{
  width:100%;
  border-collapse:collapse;
}
.chem-table th,
.chem-table td{
  padding:12px;
  text-align:left;
  border-bottom:1px solid #6899b7;
  font-size:clamp(19px,1.48vw,26px);
}
.chem-table th{color:var(--blue)}

.molecule{
  min-height:270px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:12px;
  padding:18px;
  background:#153a51;
  border:1px solid #7cb5d3;
  border-radius:19px;
}
.molecule svg{
  display:block;
  width:100%;
  max-width:490px;
  height:220px;
}
.molecule strong{
  font-size:31px;
  color:var(--green);
}
.molecule p{
  font-size:19px;
  margin:0;
  color:var(--muted);
  text-align:center;
}
.molecule-legend{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
}
.molecule-legend span{
  padding:5px 10px;
  background:#204b64;
  border-radius:8px;
  font-size:15px;
}

.task{
  margin-bottom:12px;
  padding:15px 19px;
  background:#174058;
  border:1px solid #6ca5c2;
  border-radius:12px;
}
.task p{margin:5px 0}
.question{
  font-size:clamp(29px,2.8vw,46px);
  font-weight:900;
  line-height:1.43;
}
.answer{
  padding:19px;
  margin-top:15px;
  background:#11513e;
  border:1px solid #82e9ba;
  border-radius:15px;
  font-size:clamp(22px,1.85vw,30px);
  line-height:1.5;
}
.number-tag{
  display:inline-block;
  padding:11px 20px;
  background:#6f542c;
  border:2px solid var(--gold);
  border-radius:13px;
  font-size:clamp(25px,2.5vw,42px);
  font-weight:900;
}
.progress{
  height:13px;
  margin-top:14px;
  background:#294b60;
  border-radius:20px;
  overflow:hidden;
}
.progress div{
  height:100%;
  background:linear-gradient(90deg,#24a5d6,#85edbd);
}
.problem{
  margin-top:18px;
  padding:27px;
  background:linear-gradient(145deg,#15516b,#10354a);
  border:2px solid #7bc9e8;
  border-radius:19px;
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:18px;
}
.btn{
  padding:12px 19px;
  color:white;
  background:#285d7a;
  border:1px solid #87b6d2;
  border-radius:11px;
  font-size:19px;
  font-weight:900;
}
.btn.primary{background:#098da9;border-color:#8be8ff}
.btn.success{background:#147f5d;border-color:#8cefc2}
.btn.warning{background:#946c31;border-color:#ffdc91}

.team{
  padding:18px;
  text-align:center;
  background:#173d56;
  border:1px solid #76aac8;
  border-radius:17px;
}
.team .score{
  color:var(--gold);
  font-size:56px;
  font-weight:900;
}
.team.active{
  outline:4px solid var(--gold);
  box-shadow:0 0 25px #ffda9160;
}
.options{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.option{
  padding:18px;
  background:#255872;
  border:2px solid #7bb4d2;
  border-radius:13px;
  color:white;
  font-size:clamp(21px,1.7vw,29px);
  font-weight:800;
  text-align:left;
}
.option.correct{
  background:#167958;
  border-color:#9cf1c9;
}
.option.wrong{
  background:#91404f;
  border-color:#ffb4bd;
}
.home-row{
  padding:15px 19px;
  margin-bottom:12px;
  background:#173e56;
  border-left:6px solid var(--blue);
  border-radius:12px;
}
.home-row p{margin:5px 0}

.footer{
  flex-shrink:0;
  min-height:88px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:10px 22px;
  background:#081d30;
  border-top:1px solid #6c9dbc;
}
.navigation{display:flex;gap:10px}
.signature{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.signature strong{
  font-size:31px;
  color:var(--gold);
  font-weight:900;
  letter-spacing:3px;
}
.signature small{
  font-size:13px;
  color:var(--muted);
}
.clock{
  padding:7px 14px;
  background:#12374e;
  border:1px solid #6fa6bf;
  border-radius:12px;
  text-align:center;
}
#clock{
  display:block;
  color:var(--blue);
  font-size:27px;
  font-variant-numeric:tabular-nums;
}
.clock small{
  font-size:12px;
  color:var(--muted);
}
.tools{
  position:fixed;
  bottom:110px;
  left:10px;
  z-index:50;
  display:flex;
  flex-direction:column;
  gap:7px;
  align-items:flex-start;
}
.tool-btn{
  padding:10px 12px;
  color:white;
  background:#107e9d;
  border:1px solid #87ddfb;
  border-radius:9px;
  font-size:13px;
  font-weight:900;
}
.tool-btn.green-btn{
  background:#177957;
  border-color:#89e9bb;
}

/* КАЛЬКУЛЯТОР */

.calculator{
  position:fixed;
  top:110px;
  left:15px;
  z-index:1200;
  width:215px;
  max-width:calc(100vw - 12px);
  padding:8px;
  background:#102e45;
  color:white;
  border:1px solid #86dfff;
  border-radius:13px;
  box-shadow:0 20px 45px #000b;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  cursor:grab;
}
.calculator.dragging{cursor:grabbing}
.calc-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  padding:7px;
  margin-bottom:7px;
  background:#27536b;
  border-radius:8px;
  font-size:13px;
}
.close{
  padding:5px 9px;
  background:#b6495a;
  color:white;
  border:0;
  border-radius:6px;
}
#calcDisplay{
  width:100%;
  height:43px;
  padding:6px;
  background:#061b2d;
  color:white;
  border:1px solid #7daac4;
  border-radius:7px;
  font-size:19px;
  text-align:right;
  pointer-events:none;
}
.calc-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  margin-top:7px;
}
.calc-grid button{
  min-width:0;
  height:37px;
  padding:1px;
  color:white;
  background:#2a5e7a;
  border:1px solid #6ca3c0;
  border-radius:7px;
  font-size:17px;
  font-weight:900;
  touch-action:none;
}
.calc-grid button:active{
  background:#178bac;
}
.calc-hint{
  padding-top:6px;
  font-size:11px;
  color:var(--muted);
  text-align:center;
}

/* ПЕРИОДТЫҚ КЕСТЕ */

.overlay{
  position:fixed;
  inset:0;
  z-index:2000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000d;
  padding:12px;
}
.periodic-panel{
  width:min(1600px,99vw);
  max-height:97vh;
  padding:17px;
  overflow:auto;
  background:#0e293f;
  border:1px solid #7faeca;
  border-radius:18px;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}
.modal-head p{font-size:17px}
.periodic-scroll{
  padding:12px;
  overflow:auto;
  background:#061c2e;
  border-radius:12px;
}
.periodic-grid{
  display:grid;
  min-width:1840px;
  grid-template-columns:56px repeat(18,minmax(95px,1fr));
  grid-template-rows:45px repeat(10,100px);
  gap:5px;
}
.period-label,.group-label{
  display:grid;
  place-items:center;
  padding:4px;
  background:#1b4b65;
  border:1px solid #77b6d2;
  border-radius:8px;
  color:var(--gold);
  font-size:17px;
  font-weight:900;
  text-align:center;
}
.period-label.small{font-size:11px}
.element{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
  padding:12px 3px 4px;
  color:white;
  background:#246681;
  border:1px solid #8fc0d5;
  border-radius:8px;
}
.element .number{
  position:absolute;
  top:4px;
  left:5px;
  font-size:12px;
}
.element .symbol{
  font-size:28px;
  font-weight:900;
}
.element .ename{
  font-size:12px;
  text-align:center;
}
.element .mass{
  font-size:12px;
  color:#e3f2ff;
}
.element.highlight{background:#985274}
.element.noble{background:#6853a1}
.element.lanth{background:#357d8d}
.element.act{background:#86586c}
.element-info{
  padding:15px;
  margin-top:12px;
  background:#19465e;
  border-radius:11px;
  font-size:22px;
  line-height:1.5;
}

@media(max-width:950px){
  .hero,.grid2,.grid3{
    grid-template-columns:1fr;
  }
}
@media(max-width:700px){
  .topbar{padding:9px}
  .brand strong{font-size:18px}
  .brand small,#sectionName{display:none}
  .topinfo{gap:8px;font-size:13px}
  #timer{font-size:21px}
  .main{padding:13px}
  h1{font-size:35px}
  h2{font-size:29px}
  h3{font-size:24px}
  p,li{font-size:19px}
  .card{padding:16px}
  .problem{padding:16px}
  .footer{min-height:79px;padding:7px}
  .navigation{gap:4px}
  .signature strong{font-size:16px;letter-spacing:0}
  .signature small{display:none}
  .clock{padding:5px 6px}
  #clock{font-size:16px}
  .clock small{font-size:10px}
  .btn{padding:8px;font-size:13px}
  .tools{left:8px;bottom:94px}
  .tool-btn{padding:8px;font-size:12px}
  .options{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <strong>⚗ CHEMISTRY PRO</strong>
      <small>§65 · ҚАНЫҚҚАН КӨМІРСУТЕКТЕР. АЛКАНДАР</small>
    </div>

    <div class="topinfo">
      <span id="sectionName">Кіріспе</span>
      <strong id="timer">80:00</strong>
      <span id="pageCount">1 / 1</span>
    </div>
  </header>

  <main id="main" class="main">
    <section id="slide" class="slide"></section>
  </main>

  <footer class="footer">
    <div class="navigation">
      <button id="prev" class="btn">← Артқа</button>
      <button id="next" class="btn primary">Келесі →</button>
    </div>

    <div class="signature">
      <strong>BY DARKHAN</strong>
      <small id="slideTitle">§65 · Алкандар</small>
    </div>

    <div class="clock">
      <strong id="clock">00:00:00</strong>
      <small>Алматы уақыты</small>
    </div>
  </footer>
</div>

<div class="tools">
  <button id="calcOpen" class="tool-btn">
    🧮 Калькулятор
  </button>
  <button id="tableOpen" class="tool-btn green-btn">
    ⚛ Менделеев кестесі
  </button>
</div>

<div id="calculator" class="calculator hidden">
  <div class="calc-head">
    <strong>🧮 Калькулятор</strong>
    <button id="calcClose" class="close" type="button">
      ✕
    </button>
  </div>

  <input id="calcDisplay"
    type="text" readonly
    aria-label="Есептеу нәтижесі">

  <div id="calcKeys" class="calc-grid"></div>

  <div class="calc-hint">
    Ұстап жылжыт · Батырмалар жұмыс істейді
  </div>
</div>

<div id="periodicModal" class="overlay hidden">
  <div class="periodic-panel">
    <div class="modal-head">
      <div>
        <h2>Менделеевтің периодтық кестесі</h2>
        <p>118 элемент · 18 топ · 7 период</p>
      </div>
      <button id="tableClose" class="close">
        ✕
      </button>
    </div>

    <div class="periodic-scroll">
      <div id="periodicGrid" class="periodic-grid"></div>
    </div>

    <div id="elementInfo" class="element-info">
      Элементті таңдап, оның мәліметін қара.
    </div>
  </div>
</div>

<script>
"use strict";

/* =========================================
   §65 — ҚАНЫҚҚАН КӨМІРСУТЕКТЕР. АЛКАНДАР
   БАРЛЫҒЫ БІР INDEX.HTML ФАЙЛЫНДА
========================================= */

const $=id=>document.getElementById(id);

function esc(value){
  return String(value).replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );
}

/* САҚТАУ */

const STORE="chem65_darkhan_corrected_v2";
const TIMER_STORE=STORE+"_timer";

function defaultState(){
  return{
    levels:{},
    board:0,
    boardOpen:false,
    game:0,
    selected:null,
    scores:[0,0,0],
    homeOpen:false
  };
}

let state=defaultState();

try{
  const saved=JSON.parse(localStorage.getItem(STORE));

  if(saved && Array.isArray(saved.scores)){
    state={...defaultState(),...saved};
  }
}catch(e){
  console.warn("Сақталған дерек оқылмады:",e);
}

function save(){
  try{
    localStorage.setItem(STORE,JSON.stringify(state));
  }catch(e){
    console.warn(e);
  }
}

/* 80 МИНУТТЫҚ ТАЙМЕР */

const savedDeadline=localStorage.getItem(TIMER_STORE);
let deadline=savedDeadline===null
  ?null
  :Number(savedDeadline);

if(deadline!==null&&!Number.isFinite(deadline)){
  deadline=null;
}

function remaining(){
  if(deadline===null)return 4800;

  return Math.max(
    0,
    Math.ceil((deadline-Date.now())/1000)
  );
}

function updateClock(){
  const t=remaining();

  const minutes=String(Math.floor(t/60))
    .padStart(2,"0");

  const seconds=String(t%60)
    .padStart(2,"0");

  $("timer").textContent=minutes+":"+seconds;

  $("timer").style.color=
    t===0?"#ffb4bd":"#ffda91";

  $("clock").textContent=
    new Intl.DateTimeFormat("en-GB",{
      timeZone:"Asia/Almaty",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hourCycle:"h23"
    }).format(new Date());
}

function startTimer(){
  if(deadline!==null){
    if(remaining()>0)return;
    alert("Уақыт аяқталды. Таймерді жаңарту батырмасын бас.");
    return;
  }

  deadline=Date.now()+4800000;

  localStorage.setItem(
    TIMER_STORE,
    String(deadline)
  );

  updateClock();
  render();
}

function resetTimer(){
  if(!confirm("80 минуттық таймерді қайта бастаймыз ба?")){
    return;
  }

  deadline=null;
  localStorage.removeItem(TIMER_STORE);

  updateClock();
  render();
}

setInterval(updateClock,1000);

/* СЛАЙДТАР */

const slides=[];
let currentPage=0;

function add(title,section,html){
  slides.push({
    title,
    section,
    html
  });
}

function dynamic(title,section,renderer){
  slides.push({
    title,
    section,
    renderer
  });
}

function render(){
  const slide=slides[currentPage];
  if(!slide)return;

  $("slide").innerHTML=slide.renderer
    ?slide.renderer()
    :slide.html;

  $("sectionName").textContent=slide.section;
  $("slideTitle").textContent=slide.title;

  $("pageCount").textContent=
    `${currentPage+1} / ${slides.length}`;

  $("prev").disabled=currentPage===0;

  $("next").disabled=
    currentPage===slides.length-1;

  $("main").scrollTop=0;
}

function goTo(title){
  const i=slides.findIndex(s=>s.title===title);

  if(i>=0){
    currentPage=i;
    render();
  }
}

const moleculeModels={
  methane:{
    name:"Метан",
    formula:"CH₄",
    atoms:[
      ["C",225,110],
      ["H",225,24],
      ["H",225,196],
      ["H",135,110],
      ["H",315,110]
    ],
    bonds:[
      [0,1],[0,2],[0,3],[0,4]
    ]
  },

  ethane:{
    name:"Этан",
    formula:"C₂H₆",
    atoms:[
      ["C",163,110],
      ["C",287,110],
      ["H",163,25],
      ["H",163,195],
      ["H",77,110],
      ["H",287,25],
      ["H",287,195],
      ["H",373,110]
    ],
    bonds:[
      [0,1],
      [0,2],[0,3],[0,4],
      [1,5],[1,6],[1,7]
    ]
  },

  propane:{
    name:"Пропан",
    formula:"C₃H₈",
    atoms:[
      ["C",100,110],
      ["C",225,110],
      ["C",350,110],
      ["H",100,25],
      ["H",100,195],
      ["H",30,110],
      ["H",225,25],
      ["H",225,195],
      ["H",350,25],
      ["H",350,195],
      ["H",420,110]
    ],
    bonds:[
      [0,1],[1,2],
      [0,3],[0,4],[0,5],
      [1,6],[1,7],
      [2,8],[2,9],[2,10]
    ]
  },

  butane:{
    name:"Бутан",
    formula:"C₄H₁₀",
    atoms:[
      ["CH₃",50,110],
      ["CH₂",165,110],
      ["CH₂",285,110],
      ["CH₃",405,110]
    ],
    bonds:[
      [0,1],[1,2],[2,3]
    ],
    grouped:true
  }
};

function molecule(kind){
  const m=moleculeModels[kind]||
    moleculeModels.methane;

  const lines=m.bonds.map(([i,j])=>{
    const a=m.atoms[i];
    const b=m.atoms[j];

    const dx=b[1]-a[1];
    const dy=b[2]-a[2];

    const length=Math.hypot(dx,dy)||1;

    const ux=dx/length;
    const uy=dy/length;

    const aGap=m.grouped?45:23;
    const bGap=m.grouped?45:23;

    return `
      <line
        x1="${a[1]+ux*aGap}"
        y1="${a[2]+uy*aGap}"
        x2="${b[1]-ux*bGap}"
        y2="${b[2]-uy*bGap}"
        stroke="#ffda91"
        stroke-width="5"
        stroke-linecap="round"
      />
    `;
  }).join("");

  const atoms=m.atoms.map(a=>{
    if(m.grouped){
      return `
        <text
          x="${a[1]}"
          y="${a[2]+9}"
          font-size="28"
          font-weight="900"
          text-anchor="middle"
          fill="white"
        >${esc(a[0])}</text>
      `;
    }

    const hydrogen=a[0]==="H";

    return `
      <circle
        cx="${a[1]}"
        cy="${a[2]}"
        r="23"
        fill="${hydrogen?"#e9f7ff":"#263d52"}"
        stroke="#8cddff"
        stroke-width="3"
      />

      <text
        x="${a[1]}"
        y="${a[2]+8}"
        text-anchor="middle"
        font-size="22"
        font-weight="900"
        fill="${hydrogen?"#173348":"white"}"
      >${a[0]}</text>
    `;
  }).join("");

  return `
    <div class="molecule">
      <svg
        viewBox="0 0 450 220"
        role="img"
        aria-label="${esc(m.name)} молекуласының сызбасы"
      >
        ${lines}
        ${atoms}
      </svg>

      <strong>${esc(m.formula)}</strong>
      <p>${esc(m.name)} молекуласы</p>

      <div class="molecule-legend">
        <span>⚫ C — көміртек</span>
        <span>⚪ H — сутек</span>
      </div>
    </div>
  `;
}

function renderGame(){
  const i=state.game;

  if(i>=game.length){

          </b>
        </div>

        <button class="btn warning"
          onclick="resetGame()">
          ↺ Ойынды қайта бастау
        </button>
      </div>
    `;
  }

  const item=game[i];
  const team=i%3;
  const selected=state.selected;

  return `
    <div class="subtitle">
      КОМАНДАЛЫҚ ОЙЫН · ${i+1}/15
    </div>

    <h2>${team+1}-команданың кезегі</h2>

    <div class="grid3">
      ${state.scores.map((score,j)=>`
        <div class="team ${j===team?"active":""}">
          <h3>${j+1}-команда</h3>
          <div class="score">${score}</div>
          <p>ұпай</p>
        </div>
      `).join("")}
    </div>

    <div class="card" style="margin-top:18px">
      <h3>Сұрақ</h3>
      <p class="question">${esc(item.q)}</p>
    </div>

    <div class="options" style="margin-top:16px">
      ${item.options.map((option,j)=>{
        let cls="";

        if(selected!==null){
          if(j===item.answer)cls="correct";
          else if(j===selected)cls="wrong";
        }

        return `
          <button
            class="option ${cls}"
            ${selected!==null?"disabled":""}
            onclick="chooseAnswer(${j})"
          >
            ${"ABCD"[j]}. ${esc(option)}
          </button>
        `;
      }).join("")}
    </div>

    ${selected!==null?`
      <div class="answer">
        <b>
          ${selected===item.answer?
            "Дұрыс жауап! +10 ұпай":
            "Қате жауап. 0 ұпай"}

        <p>
          Дұрыс нұсқа:
          <b>
            ${esc(item.options[item.answer])}

      </div>

        <button class="btn primary"
          onclick="nextGame()">
          Келесі команда →
        </button>
      </div>
    `:`
      <div class="note">
        Төрт нұсқаның бірін таңда.
        Жауаптан кейін келесі командаға өт.
      </div>
    `}
  `;
}

function chooseAnswer(j){
  if(state.selected!==null)return;

  state.selected=j;

  if(j===game[state.game].answer){
    state.scores[state.game%3]+=10;
  }

  save();
  render();
}

function nextGame(){
  if(state.selected===null)return;

  state.game++;
  state.selected=null;

  save();
  render();
}

function resetGame(){
  if(!confirm("Ойынды қайта бастаймыз ба?"))return;

  state.game=0;
  state.selected=null;
  state.scores=[0,0,0];

  save();
  render();
}

const calculator=$("calculator");
const calcDisplay=$("calcDisplay");

let calcText="";

const calculatorKeys=[
  "7","8","9","÷",
  "4","5","6","×",
  "1","2","3","−",
  "C","0",".","+",
  "(",")","⌫","="

/* ӨРНЕКТЕРДІ ЕСЕПТЕУ */

function calculate(source){
  if(!/^[0-9+\-*/(). ]+$/.test(source)){
    throw Error("Жарамсыз өрнек");
  }

  let pos=0;

  function skipSpaces(){
    while(source[pos]===" ")pos++;
  }

  function factor(){
    skipSpaces();

    if(source[pos]==="+"){
      pos++;
      return factor();
    }

    if(source[pos]==="-"){
      pos++;
      return -factor();
    }

    if(source[pos]==="("){
      pos++;

      const value=expression();

      skipSpaces();

      if(source[pos]!==")"){
        throw Error("Жақша қатесі");
      }

      pos++;
      return value;
    }

    const match=/^(?:\d+\.?\d*|\.\d+)/
      .exec(source.slice(pos));

    if(!match){
      throw Error("Сан қатесі");
    }

    pos+=match[0].length;
    return Number(match[0]);
  }

  function term(){
    let result=factor();

    while(true){
      skipSpaces();

      const operator=source[pos];

      if(operator!=="*" && operator!=="/"){
        break;
      }

      pos++;
      const next=factor();

      result=operator==="*"
        ?result*next
        :result/next;
    }

    return result;
  }

  function expression(){
    let result=term();

    while(true){
      skipSpaces();

      const operator=source[pos];

      if(operator!=="+" && operator!=="-"){
        break;
      }

      pos++;
      const next=term();

      result=operator==="+"
        ?result+next
        :result-next;
    }

    return result;
  }

  const result=expression();

  skipSpaces();

  if(
    pos!==source.length ||
    !Number.isFinite(result)
  ){
    throw Error("Есептеу қатесі");
  }

  return Number(result.toPrecision(12));
}

  }else if(key==="⌫"){
    calcText=calcText.slice(0,-1);
  }else if(key==="="){
    try{
      const expression=calcText
        .replaceAll("×","*")
        .replaceAll("÷","/")
        .replaceAll("−","-");

      calcText=String(calculate(expression));
    }catch(e){
      calcText="Қате";
    }
  }else{
    if(calcText==="Қате")calcText="";
    calcText+=key;
  }

  calcDisplay.value=calcText;

const clamp=(value,min,max)=>
  Math.max(min,Math.min(value,max));

function keepCalculatorInside(){
  if(calculator.classList.contains("hidden")){
    return;
  }

  const rect=calculator.getBoundingClientRect();

  calculator.style.left=clamp(
    rect.left,
    0,
    Math.max(0,window.innerWidth-rect.width)
  )+"px";

  calculator.style.top=clamp(
    rect.top,
    0,
    Math.max(0,window.innerHeight-rect.height)
  )+"px";
}

let calcDrag=null;
let suppressCalcClick=false;
let releaseClickTimer=null;

calculator.addEventListener("pointerdown",event=>{
  if(
    event.pointerType==="mouse" &&
    event.button!==0
  ){
    return;
  }

  if(calcDrag!==null)return;

  const rect=calculator.getBoundingClientRect();

  calcDrag={
    id:event.pointerId,
    startX:event.clientX,
    startY:event.clientY,
    left:rect.left,
    top:rect.top,
    moved:false
  };
});

/* Pointer capture қолданылмайды:
   калькулятор батырмалары қалыпты басылады. */

window.addEventListener(
  "pointermove",
  event=>{
    if(
      !calcDrag ||
      calcDrag.id!==event.pointerId
    ){
      return;
    }

    const dx=event.clientX-calcDrag.startX;
    const dy=event.clientY-calcDrag.startY;

    if(
      !calcDrag.moved &&
      Math.hypot(dx,dy)>7
    ){
      calcDrag.moved=true;
      calculator.classList.add("dragging");
    }

    if(!calcDrag.moved)return;

    if(event.cancelable){
      event.preventDefault();
    }

    calculator.style.left=clamp(
      calcDrag.left+dx,
      0,
      Math.max(
        0,
        window.innerWidth-calculator.offsetWidth
      )
    )+"px";

    calculator.style.top=clamp(
      calcDrag.top+dy,
      0,
      Math.max(
        0,
        window.innerHeight-calculator.offsetHeight
      )
    )+"px";
  },
  {passive:false}
);

function stopCalculatorDrag(event){
  if(
    !calcDrag ||
    calcDrag.id!==event.pointerId
  ){
    return;
  }

  const moved=calcDrag.moved;

  calcDrag=null;
  calculator.classList.remove("dragging");

  if(moved){
    suppressCalcClick=true;

    clearTimeout(releaseClickTimer);

    releaseClickTimer=setTimeout(()=>{
      suppressCalcClick=false;
    },0);
  }
}

window.addEventListener(
  "pointerup",
  stopCalculatorDrag
);

window.addEventListener(
  "pointercancel",
  stopCalculatorDrag
);

const periodCols=[
  [1,18],
  [1,2,13,14,15,16,17,18],
  [1,2,13,14,15,16,17,18],
  Array.from({length:18},(_,i)=>i+1),
  Array.from({length:18},(_,i)=>i+1)
];

function elementPosition(z){
  if(z<=54){
    let index=z-1;

    for(let p=0;p<5;p++){
      const cols=periodCols[p];

      if(index<cols.length){
        return{
          row:p+1,
          col:cols[index]
        };
      }

      index-=cols.length;
    }
  }

  /* 6-период */

  if(z<=56){
    return{row:6,col:z-54};
  }

  if(z<=71){
    return{row:9,col:z-53};
  }

  if(z<=86){
    return{row:6,col:z-68};
  }

  /* 7-период */

  if(z<=88){
    return{row:7,col:z-86};
  }

  if(z<=103){
    return{row:10,col:z-85};
  }

  return{row:7,col:z-100};
}

const highlighted=new Set([
  "C","H","O","N"
]);

const noble=new Set([
  "He","Ne","Ar","Kr","Xe","Rn","Og"
]);

function elementClass(e){
  if(highlighted.has(e.symbol)){
    return"highlight";
  }

  if(noble.has(e.symbol)){
    return"noble";
  }

  if(e.z>=57&&e.z<=71){
    return"lanth";
  }

  if(e.z>=89&&e.z<=103){
    return"act";
  }

  return"";
}

function buildPeriodic(){
  let html="";

  /* Топ нөмірлері */

  for(let g=1;g<=18;g++){
    html+=`
      <div class="group-label"
        style="grid-row:1;grid-column:${g+1}">
        ${g}
      </div>
    `;
  }

  /* Период нөмірлері */

  for(let p=1;p<=7;p++){
    html+=`
      <div class="period-label"
        style="grid-row:${p+1};grid-column:1">
        ${p}
      </div>
    `;
  }

  html+=`
    <div class="period-label small"
      style="grid-row:10;grid-column:1">
      Лантаноидтар
    </div>

    <div class="period-label small"
      style="grid-row:11;grid-column:1">
      Актиноидтар
    </div>

    <div class="group-label"
      style="grid-row:7;grid-column:4">
      57–71
    </div>

    <div class="group-label"
      style="grid-row:8;grid-column:4">
      89–103
    </div>
  `;

  elements.forEach((e,i)=>{
    const pos=elementPosition(e.z);

    html+=`
      <button
        class="element ${elementClass(e)}"
        data-element="${i}"
        style="
          grid-row:${pos.row+1};
          grid-column:${pos.col+1}
        "

        <span class="symbol">${esc(e.symbol)}</span>
        <span class="ename">${esc(e.name)}</span>
        <span class="mass">${esc(e.mass)}</span>
      </button>
    `;
  });

  $("periodicGrid").innerHTML=html;
}
