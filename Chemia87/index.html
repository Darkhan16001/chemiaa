
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>§87 Этил спиртін өнеркәсіптік өндіру</title>
<style>
:root {
  --bg:#071827;
  --panel:#164157;
  --panel2:#1d5067;
  --text:#f5fbff;
  --blue:#9ee4ff;
  --green:#9af2c7;
  --yellow:#ffdb8d;
  --red:#ff9baa;
  --border:#79b4ce;
}
* {box-sizing:border-box}
html,body {
  margin:0;
  height:100%;
  font-family:"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input {font:inherit}
button {cursor:pointer}
button:disabled {opacity:.4;cursor:default}
[hidden] {display:none!important}

.app {
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 90% 5%,#1684a077,transparent 44%),
    radial-gradient(circle at 7% 95%,#14735b66,transparent 42%),
    linear-gradient(125deg,#071827,#143c53,#081c2c);
}
header,footer {
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  background:#081d2e;
  padding:12px 20px;
}
header {border-bottom:1px solid var(--border)}
footer {border-top:1px solid var(--border)}
.brand {
  font-size:27px;
  font-weight:900;
  color:var(--blue);
}
.brand small {
  display:block;
  font-size:14px;
  color:var(--yellow);
}
.status {
  display:flex;
  align-items:center;
  gap:16px;
  font-weight:900;
  font-size:19px;
}
#timer {
  font-size:30px;
  color:var(--yellow);
  font-variant-numeric:tabular-nums;
}
#counter {color:var(--blue)}
#clock {
  color:var(--blue);
  font-size:23px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}
.signature {
  color:var(--yellow);
  font-size:23px;
  font-weight:900;
}
main {
  flex:1;
  min-height:0;
  overflow:auto;
  padding:24px 35px 45px;
}
.slide {
  max-width:1500px;
  min-height:100%;
  margin:auto;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
h1 {
  font-size:clamp(44px,4.5vw,78px);
  line-height:1.14;
  margin:12px 0 22px;
}
h2 {
  font-size:clamp(33px,3vw,53px);
  line-height:1.2;
  margin:0 0 20px;
}
h3 {
  color:var(--blue);
  font-size:clamp(25px,2vw,36px);
  margin:0 0 14px;
}
p,li {
  font-size:clamp(22px,1.7vw,30px);
  line-height:1.52;
}
li {margin:9px 0}
.eyebrow {
  font-size:21px;
  font-weight:900;
  color:var(--blue);
  margin-bottom:13px;
}
.grid2,.grid3 {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  align-items:center;
  gap:19px;
}
.grid3 {grid-template-columns:repeat(3,minmax(0,1fr))}
.card {
  padding:24px;
  background:linear-gradient(145deg,#1c4b63,#102e46);
  border:1px solid var(--border);
  border-radius:18px;
  min-width:0;
}
.card p {margin:9px 0}
.formula {
  color:var(--green);
  background:#104956;
  border:1px solid #8cd6ca;
  border-radius:14px;
  padding:20px;
  margin:16px 0;
  text-align:center;
  font-size:clamp(27px,2.6vw,44px);
  font-weight:900;
  overflow-wrap:anywhere;
}
.note {
  background:#20475e;
  border-left:6px solid var(--yellow);
  border-radius:11px;
  padding:18px 22px;
  margin-top:16px;
}
.note p {margin:7px 0}
.btn {
  background:#2a617c;
  border:1px solid #8cbdd3;
  color:white;
  border-radius:10px;
  padding:12px 19px;
  font-size:18px;
  font-weight:900;
}
.btn.primary {background:#078dac}
.btn.good {background:#137c5c}
.btn.gold {background:#936d32}
.actions {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}
.task {
  background:#1b455e;
  border:1px solid #7ab0cd;
  border-radius:12px;
  padding:15px 19px;
  margin:11px 0;
}
.task p {margin:5px 0}
.answer {
  margin-top:16px;
  padding:19px;
  background:#14523d;
  border:1px solid #8ceabd;
  border-radius:12px;
}
.answer p {margin:8px 0}
.big {
  font-size:clamp(31px,2.85vw,48px);
  font-weight:900;
}
.tag {
  display:inline-block;
  width:max-content;
  max-width:100%;
  background:#695431;
  border:2px solid var(--yellow);
  color:var(--yellow);
  border-radius:12px;
  padding:13px 21px;
  font-size:29px;
  font-weight:900;
}
.progress {
  height:14px;
  background:#32566d;
  border-radius:30px;
  margin:18px 0;
  overflow:hidden;
}
.progress span {
  display:block;
  height:100%;
  background:linear-gradient(90deg,#12add6,#94f0c4);
}
.team {
  text-align:center;
  padding:18px;
  background:#1b445c;
  border:1px solid var(--border);
  border-radius:15px;
}
.team.active {outline:4px solid var(--yellow)}
.score {
  color:var(--yellow);
  font-size:56px;
  font-weight:900;
}
.options {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
  margin-top:18px;
}
.option {
  background:#2d627d;
  color:white;
  border:2px solid #8ab6cf;
  border-radius:11px;
  text-align:left;
  font-size:clamp(21px,1.75vw,30px);
  padding:19px;
  font-weight:900;
}
.option.correct {background:#137b59}
.option.wrong {background:#984758}
.choice {
  display:block;
  width:100%;
  margin:10px 0;
  padding:17px 20px;
  background:#295d78;
  border:2px solid #86bad2;
  color:white;
  border-radius:12px;
  text-align:left;
  font-size:25px;
  font-weight:900;
}
.choice.active {
  background:#146c62;
  border-color:var(--yellow);
}
.choice small {
  display:block;
  font-size:17px;
  color:#e1edf5;
  margin-top:5px;
}
.blue {color:var(--blue)}
.green {color:var(--green)}
.yellow {color:var(--yellow)}
.red {color:var(--red)}

/* СОЛ ЖАҚ ҚҰРАЛДАР */
.tools {
  position:fixed;
  z-index:40;
  left:10px;
  bottom:100px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:8px;
}
.tool {
  background:#0b83a0;
  border:1px solid #96dff0;
  color:white;
  border-radius:8px;
  padding:11px 13px;
  font-size:13px;
  font-weight:900;
}

/* КАЛЬКУЛЯТОР */
.calculator {
  position:fixed;
  z-index:160;
  left:16px;
  top:105px;
  width:239px;
  max-width:calc(100vw - 12px);
  padding:10px;
  background:#113249;
  border:2px solid #96def5;
  border-radius:15px;
  box-shadow:0 20px 48px #000a;
  touch-action:none;
  user-select:none;
  cursor:grab;
}
.calculator.dragging {cursor:grabbing}
.calc-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px;
  background:#285771;
  border-radius:8px;
  font-size:13px;
}
.calc-head button {
  background:#a54657;
  color:white;
  border:0;
  border-radius:6px;
  padding:6px 10px;
}
#calcDisplay {
  display:block;
  width:100%;
  height:48px;
  background:#061d2f;
  color:white;
  border:1px solid #85b6cd;
  border-radius:8px;
  margin:9px 0;
  padding:7px;
  text-align:right;
  font-size:23px;
  pointer-events:none;
}
.calc-keys {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}
.calc-keys button {
  min-width:0;
  height:44px;
  background:#2d647e;
  border:1px solid #82b6ca;
  border-radius:7px;
  color:white;
  font-size:18px;
  padding:0;
}
.calc-hint {
  text-align:center;
  font-size:11px;
  padding-top:8px;
  color:#d5e7ef;
}

/* МЕНДЕЛЕЕВ КЕСТЕСІ */
.overlay {
  position:fixed;
  inset:0;
  background:#000e;
  z-index:300;
  display:grid;
  place-items:center;
  padding:10px;
}
.modal {
  width:min(1550px,99vw);
  max-height:97vh;
  overflow:auto;
  background:#0d2d43;
  border:1px solid #81b6cb;
  border-radius:15px;
  padding:17px;
}
.modal-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.period-scroll {
  background:#061d30;
  padding:12px;
  border-radius:10px;
  overflow:auto;
}
.period {
  display:grid;
  grid-template-columns:65px repeat(18,88px);
  grid-template-rows:38px repeat(10,85px);
  gap:4px;
  width:max-content;
}
.period-label {
  display:grid;
  place-items:center;
  text-align:center;
  background:#1c485e;
  border:1px solid #77a7c1;
  border-radius:6px;
  color:var(--yellow);
  font-size:12px;
  font-weight:900;
}
.element {
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
  background:#28617b;
  color:white;
  border:1px solid #81b6cf;
  border-radius:6px;
  padding:12px 2px 2px;
}
.element i {
  position:absolute;
  top:3px;
  left:4px;
  font-size:11px;
  font-style:normal;
}
.element b {font-size:26px}
.element small {font-size:10px}
.element.f {background:#327e80}
.element.highlight {background:#905475}
#elementInfo {
  margin-top:13px;
  background:#1b4960;
  padding:15px;
  border-radius:10px;
  font-size:20px;
}
@media(max-width:850px){
  .grid2,.grid3,.options {
    grid-template-columns:1fr;
  }
  main {padding:13px}
  header,footer {padding:8px}
  .brand {font-size:17px}
  .brand small,#sectionName {display:none}
  .status {font-size:13px;gap:7px}
  #timer {font-size:20px}
  #clock {font-size:15px}
  .signature {font-size:14px}
  .btn {font-size:14px;padding:9px}
  .tools {bottom:76px}
}
</style>
</head>

<body>

<div class="app">
<header>
  <div class="brand">
    ⚗ CHEMISTRY PRO
    <small>§87 · ЭТИЛ СПИРТІН ӨНЕРКӘСІПТІК ӨНДІРУ</small>
  </div>
  <div class="status">
    <span id="sectionName">Кіріспе</span>
    <span id="timer">80:00</span>
    <span id="counter">1 / 29</span>
  </div>
</header>

<main id="main">
  <section class="slide" id="slide"></section>
</main>

<footer>
  <div class="actions" style="margin:0">
    <button class="btn" id="prev">← Артқа</button>
    <button class="btn primary" id="next">Келесі →</button>
  </div>
  <strong class="signature">BY DARKHAN</strong>
  <span id="clock">00:00:00</span>
</footer>
</div>

<div class="tools">
  <button class="tool" id="showCalc">
    🧮 Калькулятор
  </button>
  <button class="tool" id="showTable">
    ⚛ Менделеев кестесі
  </button>
</div>

<div class="calculator" id="calculator" hidden>
  <div class="calc-head">
    <strong>🧮 Калькулятор</strong>
    <button id="closeCalc">✕</button>
  </div>
  <input id="calcDisplay" readonly>
  <div id="calcKeys" class="calc-keys"></div>
  <div class="calc-hint">
    Жоғарғы панельден ұстап жылжыт
  </div>
</div>

<div class="overlay" id="tableOverlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2>Менделеев кестесі</h2>
      <button id="closeTable" class="btn">
        Жабу ✕
      </button>
    </div>
    <p>118 элемент · 18 топ · 7 период</p>
    <div class="period-scroll">
      <div class="period" id="period"></div>
    </div>
    <div id="elementInfo">Элементті таңда.</div>
  </div>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const slides=[];
let page=0;

/* 1. БЕТТЕР */

function add(title,section,html){
  slides.push({title,section,html});
}
function dynamic(title,section,render){
  slides.push({title,section,render});
}
function draw(){
  const s=slides[page];
  if(!s)return;
  $("slide").innerHTML=s.render?s.render():s.html;
  $("sectionName").textContent=s.section;
  $("counter").textContent=
    `${page+1} / ${slides.length}`;
  $("prev").disabled=page===0;
  $("next").disabled=page===slides.length-1;
  $("main").scrollTop=0;
}
function go(title){
  const index=slides.findIndex(s=>s.title===title);
  if(index>=0){page=index;draw();}
}
$("prev").onclick=()=>{
  if(page>0){page--;draw();}
};
$("next").onclick=()=>{
  if(page<slides.length-1){page++;draw();}
};

/* 2. ЖАДЫ */

const STORE="chem87_darkhan_v1";

function initialState(){
  return {
    method:0,levels:{},
    oral:0,oralShow:false,
    game:0,choice:null,
    scores:[0,0,0],
    home:false
  };
}
let state=initialState();

try{
  const old=JSON.parse(localStorage.getItem(STORE));
  if(old&&Array.isArray(old.scores)&&
    old.scores.length===3){
    state={...initialState(),...old};
  }
}catch(e){console.warn(e);}

function save(){
  try{
    localStorage.setItem(STORE,JSON.stringify(state));
  }catch(e){console.warn(e);}
}

/* 3. КІРІСПЕ */

dynamic("Кіріспе","Кіріспе · 5 минут",()=>`
  <div class="grid2">
    <div>
      <div class="eyebrow">
        §87 · ОРГАНИКАЛЫҚ ХИМИЯ
      </div>
      <h1>Этил спиртін өнеркәсіптік өндіру</h1>
      <p>
        Этанолдың құрылысын,
        өндірістік алыну жолдарының
        химиялық негіздерін,
        шикізат түрлерін және
        экологиялық мәселелерді үйренеміз.
      </p>
      <div class="formula">
        C₂H₅OH — Этанол
      </div>
      <div class="actions">
        <button class="btn good" data-act="start">
          ▶ Сабақты бастау
        </button>
        <button class="btn gold" data-act="reset">
          ↺ Таймерді жаңарту
        </button>
      </div>
    </div>

    <div class="card">
      <h3>Этанол молекуласының құрылысы</h3>
      <svg width="100%" height="230"
        viewBox="0 0 520 230">
        <g stroke="#9af2c7" stroke-width="5"
          stroke-linecap="round">
          <line x1="122" y1="112" x2="210" y2="112"/>
          <line x1="274" y1="112" x2="346" y2="112"/>
          <line x1="120" y1="78" x2="120" y2="45"/>
          <line x1="120" y1="144" x2="120" y2="173"/>
        </g>
        <g fill="#295a78" stroke="#96e4ff"
          stroke-width="4">
          <circle cx="120" cy="112" r="32"/>
          <circle cx="244" cy="112" r="32"/>
        </g>
        <circle cx="388" cy="112" r="42"
          fill="#16775f" stroke="#9af2c7"
          stroke-width="4"/>
        <g font-size="30" fill="white"
          text-anchor="middle" font-weight="bold">
          <text x="120" y="122">C</text>
          <text x="244" y="122">C</text>
          <text x="388" y="122">OH</text>
        </g>
        <g fill="#ffdb8d" text-anchor="middle"
          font-size="25" font-weight="bold">
          <text x="260" y="35">Гидроксил тобы</text>
          <text x="260" y="215">CH₃–CH₂–OH</text>
        </g>
      </svg>
      <p>
        Екі көміртек атомы бар
        біратомды спирт.
      </p>
    </div>
  </div>
`);

add("Сабақ мақсаты","Кіріспе",`
  <h2>Сабақтың мақсаты</h2>
  <div class="grid2">
    <div class="card">
      <h3>Білімдік мақсат</h3>
      <p>
        Этанолдың формуласын, құрылысын
        және өнеркәсіптік алыну
        жолдарының химиялық мағынасын
        түсіну. Этилен мен глюкозаның
        бастапқы шикізат ретіндегі
        ерекшеліктерін салыстыру.
      </p>
    </div>
    <div class="card">
      <h3>Практикалық мақсат</h3>
      <p>
        Теориялық теңдеулерді түсіндіру,
        көміртек атомдарының сақталуын
        талдау, молярлық масса,
        зат мөлшері және массалық
        үлес бойынша есеп шығару.
      </p>
    </div>
  </div>
  <div class="note">
    <p>
      80 минут: кіріспе — 5;
      түсіндірме — 20; конспект — 8;
      деңгейлік жұмыс — 10;
      жеке жұмыс — 20; командалық ойын — 12;
      қорытынды — 5 минут.
    </p>
  </div>
`);

/* 4. 15 ТҮСІНДІРМЕ */

const theory=[
[
 "Этил спирті дегеніміз не?",
 "Этил спирті немесе этанол — молекулалық формуласы C₂H₆O болатын органикалық қосылыс. Оның қысқаша құрылымдық формуласы C₂H₅OH. Этанолдың құрамында екі көміртек атомы және бір гидроксил тобы бар. Сондықтан ол біратомды спирттерге жатады.",
 "C₂H₅OH",
 "Этанол — екі көміртекті біратомды спирт."
],
[
 "Этанол молекуласының құрылысы",
 "Этанол молекуласында көміртек атомдары дара коваленттік байланыспен қосылған. Молекуладағы оттек атомы гидроксил тобының құрамына кіреді. Этанолдың кейбір қасиеттері дәл осы –OH тобының болуымен түсіндіріледі.",
 "CH₃–CH₂–OH",
 "Этанолдың функционалдық тобы — гидроксил тобы."
],
[
 "Этанолдың молярлық массасы",
 "Этанолдың молярлық массасын оның молекулалық құрамына сүйеніп анықтаймыз. Екі көміртек атомының салыстырмалы массасы 24, алты сутектің массасы 6, бір оттектің массасы 16. Барлығы 46 г/моль болады.",
 "M(C₂H₆O)=46 г/моль",
 "Этанолдың молярлық массасы — 46 г/моль."
],
[
 "Өнеркәсіптік өндіру деген не?",
 "Өнеркәсіптік өндіру дегеніміз — шикізаттарды технологиялық жүйеде өңдеп, белгілі талаптарға сай өнім алу. Химия курсында бұл тақырыпты өнімнің молекулалық құрамы, шикізат көздері, өндірістің экономикалық маңызы және экологиялық әсері арқылы зерттейміз.",
 "Шикізат → Өндіріс → Өнім",
 "Өнеркәсіптік технология бірнеше өзара байланысты кезеңдерден тұрады."

      Math.ceil((deadline-Date.now())/1000)

  $("timer").textContent=
    String(Math.floor(seconds/60)).padStart(2,"0")+
    ":"+

  $("clock").textContent=

      hour:"2-digit",
      minute:"2-digit",

    }).format(new Date());

  if(deadline!==null){
    alert("Таймер іске қосылған.");
    return;

  deadline=Date.now()+4800000;
  try{
    localStorage.setItem(TIMER_KEY,String(deadline));

  if(!confirm("80 минуттық таймерді жаңартамыз ба?")){

const keys=[
  "7","8","9","/",
  "4","5","6","*",
  "1","2","3","-",
  "C","0",".","+",
  "(",")","⌫","="
];

  <button data-key="${k}" type="button">
    ${k==="/"?"÷":k==="*"?"×":k}
  </button>
`).join("");

let calcText="";

function calculate(input){
  let i=0;

  function factor(){
    if(input[i]==="+"){i++;return factor();}
    if(input[i]==="-"){i++;return -factor();}
    if(input[i]==="("){
      i++;
      const value=sum();
      if(input[i]!==")"){
        throw Error("Жақша қатесі");
      }
      i++;
      return value;
    }

    const m=/^(?:\d+\.?\d*|\.\d+)/
      .exec(input.slice(i));
    if(!m)throw Error("Сан қатесі");
    i+=m[0].length;
    return Number(m[0]);
  }

  function product(){
    let value=factor();
    while(input[i]==="*"||input[i]==="/"){
      const op=input[i++];
      const next=factor();
      value=op==="*"
        ?value*next
        :value/next;
    }
    return value;
  }

  function sum(){
    let value=product();
    while(input[i]==="+"||input[i]==="-"){
      const op=input[i++];
      const next=product();
      value=op==="+"
        ?value+next
        :value-next;
    }
    return value;
  }

  if(!/^[0-9+*/().-]+$/.test(input)){
    throw Error("Таңба қатесі");
  }
  const result=sum();

  if(i!==input.length||
     !Number.isFinite(result)){
    throw Error("Өрнек қатесі");
  }

  return Number(result.toPrecision(12));
}

$("calcKeys").onclick=e=>{
  const b=e.target.closest("[data-key]");
  if(!b)return;
  const key=b.dataset.key;

  if(key==="C"){
    calcText="";
  }else if(key==="⌫"){
    calcText=calcText.slice(0,-1);
  }else if(key==="="){
    try{
      calcText=String(calculate(calcText));
    }catch(e){
      calcText="Қате";
    }
  }else{
    if(calcText==="Қате")calcText="";
    calcText+=key;
  }
  $("calcDisplay").value=calcText;
};

function clamp(x,min,max){
  return Math.max(min,Math.min(max,x));
}
function fitCalculator(){
  if(calculator.hidden)return;
  const rect=calculator.getBoundingClientRect();
  calculator.style.left=clamp(
    rect.left,0,
    Math.max(0,innerWidth-rect.width)
  )+"px";
  calculator.style.top=clamp(
    rect.top,0,
    Math.max(0,innerHeight-rect.height)
  )+"px";
}

let drag=null;
let suppress=false;

calculator.querySelector(".calc-head")
.addEventListener("pointerdown",e=>{
  if(drag)return;
  if(e.pointerType==="mouse"&&e.button!==0)return;

  const rect=calculator.getBoundingClientRect();
  drag={
    id:e.pointerId,
    x:e.clientX,
    y:e.clientY,
    left:rect.left,
    top:rect.top,
    moved:false
  };
  calculator.setPointerCapture(e.pointerId);
});

calculator.addEventListener("pointermove",e=>{
  if(!drag||drag.id!==e.pointerId)return;
  const dx=e.clientX-drag.x;
  const dy=e.clientY-drag.y;

  if(Math.hypot(dx,dy)>6){
    drag.moved=true;
  }
  if(!drag.moved)return;

  calculator.classList.add("dragging");
  calculator.style.left=clamp(
    drag.left+dx,0,
    Math.max(0,innerWidth-calculator.offsetWidth)
  )+"px";
  calculator.style.top=clamp(
    drag.top+dy,0,
    Math.max(0,innerHeight-calculator.offsetHeight)
  )+"px";
});

calculator.addEventListener("pointerup",e=>{
  if(!drag||drag.id!==e.pointerId)return;
  suppress=drag.moved;
  drag=null;
  calculator.classList.remove("dragging");
  if(calculator.hasPointerCapture(e.pointerId)){
    calculator.releasePointerCapture(e.pointerId);
  }
});
calculator.addEventListener("pointercancel",()=>{
  drag=null;
  calculator.classList.remove("dragging");
});
calculator.addEventListener("click",e=>{
  if(!suppress)return;
  e.preventDefault();
  e.stopImmediatePropagation();
  suppress=false;
},true);

      </span>`;
  }
  for(let p=1;p<=7;p++){
    html+=`
      <span class="period-label"
        style="grid-row:${p+1};grid-column:1">
        ${p}
      </span>`;
  }

  html+=`
    <span class="period-label"
      style="grid-row:10;grid-column:1">La–Lu</span>
    <span class="period-label"
      style="grid-row:11;grid-column:1">Ac–Lr</span>
    <span class="period-label"
      style="grid-row:7;grid-column:4">57–71</span>
    <span class="period-label"
      style="grid-row:8;grid-column:4">89–103</span>
  `;

  for(const e of elements){
    const pos=position(e.z);
    const f=(e.z>=57&&e.z<=71)||
            (e.z>=89&&e.z<=103);
    const special=["H","C","O"].includes(e.symbol);

    html+=`
      <button class="element
        ${f?"f":special?"highlight":""}"
        data-z="${e.z}"
        style="grid-row:${pos.row+1};
               grid-column:${pos.col+1}">
        <i>${e.z}</i>
        <b>${e.symbol}</b>
        <small>${e.name}</small>
      </button>
    `;
  }

  $("period").innerHTML=html;
}

$("period").onclick=e=>{
  const b=e.target.closest("[data-z]");
  if(!b)return;

  const z=Number(b.dataset.z);
  const el=elements[z-1];
  const pos=position(z);
  const period=pos.row===9?6:pos.row===10?7:pos.row;
  const group=pos.row>7?"f-блок":pos.col+"-топ";

  $("elementInfo").textContent=
    `${z}. ${el.name} (${el.symbol}) · `+
    `${period}-период · ${group}`;
};

$("showTable").onclick=()=>{
  $("tableOverlay").hidden=false;
};
$("closeTable").onclick=()=>{
  $("tableOverlay").hidden=true;
};
$("tableOverlay").onclick=e=>{
  if(e.target===$("tableOverlay")){
    $("tableOverlay").hidden=true;
  }
};

/* 17. ПЕРНЕТАҚТА */

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    $("tableOverlay").hidden=true;
    calculator.hidden=true;
    return;
  }
  if(!$("tableOverlay").hidden)return;
  if(e.target.closest("input,textarea"))return;

  if(e.key==="ArrowRight"&&page<slides.length-1){
    page++;draw();
  }else if(e.key==="ArrowLeft"&&page>0){
    page--;draw();
  }
});

/* 18. САЙТТЫ ІСКЕ ҚОСУ */

try{
  const checks=[
    [theory.length===15,"15 түсіндірме"],
    [notes.length===3,"3 конспект"],
    [levels.length===4,"4 деңгей"],
    [oral.length===25,"25 жеке тапсырма"],
    [quiz.length===15,"15 ойын сұрағы"],
    [slides.length===29,"29 бет"],
    [elements.length===118,"118 элемент"],
    [calculate("7*3")===21,"Көбейту"],
    [calculate("(2+3)*4")===20,"Жақша"],
    [calculate("138/46")===3,"Есеп"]
  ];

  for(const [ok,name] of checks){
    if(!ok)throw Error(name+" қатесі");
  }

  buildTable();
  tick();
  draw();

  console.log("§87: бастапқы тексерулер өтті.");
}catch(error){
  console.error(error);
  $("slide").innerHTML=`
    <h2>Сайт қатесі</h2>
    <p>${error.message}</p>`;
}
