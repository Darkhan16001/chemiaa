<script>
"use strict";

/* 1. БЕТТЕР */

const $=id=>document.getElementById(id);
const slides=[];
let page=0;

function add(title,section,html){
 slides.push({title,section,html});
}

function dynamic(title,section,render){
 slides.push({title,section,render});
}

function draw(){
 const s=slides[page];
 if(!s)return;

 $("slide").innerHTML=s.render?s.render():s.html;
 $("sectionName").textContent=s.section;
 $("counter").textContent=
  `${page+1} / ${slides.length}`;

 $("prev").disabled=page===0;
 $("next").disabled=page===slides.length-1;
 $("main").scrollTop=0;
}

function go(title){
 const i=slides.findIndex(s=>s.title===title);
 if(i>=0){
  page=i;
  draw();
 }
}

$("prev").onclick=()=>{
 if(page>0){page--;draw();}
};

$("next").onclick=()=>{
 if(page<slides.length-1){page++;draw();}
};

/* 2. ПРОГРЕСТІ САҚТАУ */

const STORE="darkhan_chem89_phenols_v1";

function initialState(){
 return{
  molecule:0,
  levels:{},
  oral:0,
  oralShow:false,
  game:0,
  choice:null,
  scores:[0,0,0],
  home:false
 };
}

let state=initialState();

try{
 const old=JSON.parse(
  localStorage.getItem(STORE)
 );

 if(
  old &&
  Array.isArray(old.scores) &&
  old.scores.length===3
 ){
  state={...initialState(),...old};
 }
}catch(error){
 console.warn(error);
}

function save(){
 try{
  localStorage.setItem(
   STORE,JSON.stringify(state)
  );
 }catch(error){
  console.warn(error);
 }
}

/* 3. ФЕНОЛ ҚҰРЫЛЫСЫНЫҢ СЫЗБАСЫ */

    "/>

   <g stroke="#9be5ff" stroke-width="3">

     x2="272" y2="91"/>
    <line x1="273" y1="155"
     x2="215" y2="188"/>
    <line x1="158" y1="91"
     x2="158" y2="155"/>
   </g>

   <line x1="285" y1="83"
    x2="347" y2="49"
    stroke="#9af1c9" stroke-width="5"/>

   <circle cx="381" cy="36" r="37"
    fill="#166e60"
    stroke="#9af1c9" stroke-width="4"/>

   <text x="381" y="46"
    fill="white" font-size="30"
    font-weight="bold" text-anchor="middle">OH</text>

   <g fill="#ffdc92" font-size="22"
    text-anchor="middle" font-weight="bold">
    <text x="215" y="243">Бензол сақинасы</text>
    <text x="422" y="114">Гидроксил тобы</text>
   </g>
  </svg>

  <strong>C₆H₅OH — Фенол</strong>
  <p>

  </p>

}

/* 4. КІРІСПЕ */

dynamic("Кіріспе","Кіріспе · 5 минут",()=>`
 <div class="grid2">
  <div>
   <div class="eyebrow">
    §89 · ОРГАНИКАЛЫҚ ХИМИЯ
   </div>

   <h1>Фенолдар</h1>

   <p>
    Фенолдың молекулалық құрылысы,
    ароматты сақинасы,
    гидроксил тобы,
    спирттерден айырмашылығы,

   </p>

   <div class="formula">
    C₆H₅OH
   </div>

   <div class="actions">
    <button class="btn good" data-act="start">
     ▶ Сабақты бастау
    </button>

    <button class="btn gold"
     data-act="reset-time">

    </button>
   </div>
  </div>

add("Сабақ мақсаты","Кіріспе",`
 <h2>Сабақтың мақсаты</h2>

 <div class="grid2">
  <div class="card">
   <h3>Білімдік мақсат</h3>
   <p>
    Фенолдардың құрылысын,
    гидроксил тобының ароматты
    сақинамен байланысын,
    фенол мен спирттің айырмасын,
    физикалық және химиялық
    қасиеттерін түсіну.
   </p>
  </div>

  <div class="card">
   <h3>Практикалық мақсат</h3>
   <p>
    Формулаларды салыстыру,
    теориялық реакцияларды талдау,
    функционалдық топтарды анықтау,
    молярлық масса есептеу
    және экологиялық мәселелерді бағалау.
   </p>
  </div>
 </div>

 <div class="note">
  <p>
   80 минут: кіріспе — 5;
   түсіндірме — 20;

   командалық ойын — 12;
   қорытынды — 5 минут.

 </div>

/* 5. 15 ТОЛЫҚ ТҮСІНДІРМЕ */

const theory=[
 [
  "Фенолдар дегеніміз не?",

 ],
 [

  "C₆H₆ → Ароматты сақина",

 ],

const TIMER_KEY=STORE+"_timer";
let deadline=null;

try{
 const old=localStorage.getItem(TIMER_KEY);

  deadline=Number(old);

}catch(error){

function tick(){
 const seconds=deadline===null
  ?4800
  :Math.max(
   0,
   Math.ceil((deadline-Date.now())/1000)
  );

 $("timer").textContent=
  String(Math.floor(seconds/60)).padStart(2,"0")+
  ":"+
  String(seconds%60).padStart(2,"0");

 $("clock").textContent=
  new Intl.DateTimeFormat("en-GB",{
   timeZone:"Asia/Almaty",
   hour:"2-digit",
   minute:"2-digit",
   second:"2-digit",
   hourCycle:"h23"
  }).format(new Date());
}

function startTimer(){
 if(deadline!==null){
  alert("Таймер іске қосылған.");
  return;
 }

 deadline=Date.now()+4800000;

 try{
  localStorage.setItem(
   TIMER_KEY,String(deadline)
  );
 }catch(error){
  console.warn(error);
 }
 tick();
}

function resetTimer(){
 if(!confirm(
  "80 минуттық таймерді жаңартамыз ба?"
 ))return;

 deadline=null;

 try{
  localStorage.removeItem(TIMER_KEY);
 }catch(error){
  console.warn(error);
 }
 tick();
}

const keys=[
 "7","8","9","/",
 "4","5","6","*",
 "1","2","3","-",
 "C","0",".","+",
 "(",")","⌫","="
];

 <button type="button" data-key="${k}">
  ${k==="/"?"÷":k==="*"?"×":k}
 </button>

let calcText="";

function calculate(input){
 let i=0;

 function factor(){
  if(input[i]==="+"){
   i++;
   return factor();
  }

  if(input[i]==="-"){
   i++;
   return -factor();
  }

  if(input[i]==="("){
   i++;
   const v=sum();

   if(input[i]!==")"){
    throw Error("Жақша қатесі");
   }

   i++;
   return v;
  }

  const match=/^(?:\d+\.?\d*|\.\d+)/
   .exec(input.slice(i));

  if(!match)throw Error("Сан қатесі");

  i+=match[0].length;
  return Number(match[0]);
 }

 function product(){
  let v=factor();

  while(
   input[i]==="*" ||
   input[i]==="/"
  ){
   const op=input[i++];
   const next=factor();

   v=op==="*"?v*next:v/next;
  }

  return v;
 }

 function sum(){
  let v=product();

  while(
   input[i]==="+" ||
   input[i]==="-"
  ){
   const op=input[i++];
   const next=product();

   v=op==="+"?v+next:v-next;
  }

  return v;
 }

 if(!/^[0-9+*/().-]+$/.test(input)){
  throw Error("Таңба қатесі");
 }

 const result=sum();

 if(
  i!==input.length ||
  !Number.isFinite(result)
 ){
  throw Error("Өрнек қатесі");
 }

 return Number(result.toPrecision(12));
}

 }else if(k==="⌫"){
  calcText=calcText.slice(0,-1);
 }else if(k==="="){
  try{
   calcText=String(calculate(calcText));
  }catch(error){
   calcText="Қате";
  }
 }else{
  if(calcText==="Қате")calcText="";
  calcText+=k;
 }

 $("calcDisplay").value=calcText;
});

function clamp(v,min,max){
 return Math.max(min,Math.min(max,v));
}

function fitCalculator(){
 if(calculator.hidden)return;

 const r=calculator.getBoundingClientRect();

 calculator.style.left=clamp(
  r.left,0,Math.max(0,innerWidth-r.width)
 )+"px";

 calculator.style.top=clamp(
  r.top,0,Math.max(0,innerHeight-r.height)
 )+"px";
}

let drag=null;
let suppressUntil=0;

calculator.querySelector(".calc-head")
.addEventListener("pointerdown",event=>{
 if(event.target.closest("button"))return;

 if(drag)return;
 if(
  event.pointerType==="mouse" &&
  event.button!==0
 )return;

 const r=calculator.getBoundingClientRect();

 drag={
  id:event.pointerId,
  x:event.clientX,
  y:event.clientY,
  left:r.left,
  top:r.top,
  moved:false
 };

 calculator.setPointerCapture(event.pointerId);
});

calculator.addEventListener("pointermove",event=>{
 if(!drag||drag.id!==event.pointerId)return;

 const dx=event.clientX-drag.x;
 const dy=event.clientY-drag.y;

 if(Math.hypot(dx,dy)>6){
  drag.moved=true;
 }

 if(!drag.moved)return;

 calculator.classList.add("dragging");

 calculator.style.left=clamp(
  drag.left+dx,0,
  Math.max(0,innerWidth-calculator.offsetWidth)
 )+"px";

 calculator.style.top=clamp(
  drag.top+dy,0,
  Math.max(0,innerHeight-calculator.offsetHeight)
 )+"px";
});

calculator.addEventListener("pointerup",event=>{
 if(!drag||drag.id!==event.pointerId)return;

 if(drag.moved){
  suppressUntil=performance.now()+300;
 }

 drag=null;
 calculator.classList.remove("dragging");

 if(calculator.hasPointerCapture(event.pointerId)){
  calculator.releasePointerCapture(event.pointerId);
 }
});

calculator.addEventListener("pointercancel",()=>{
 drag=null;
 calculator.classList.remove("dragging");
});

calculator.addEventListener("click",event=>{
 if(performance.now()>suppressUntil)return;

 event.preventDefault();
 event.stopImmediatePropagation();
 suppressUntil=0;
},true);

window.addEventListener("resize",fitCalculator);

const groups=[
 [1,18],
 [1,2,13,14,15,16,17,18],
 [1,2,13,14,15,16,17,18],
 Array.from({length:18},(_,i)=>i+1),

function position(z){
 if(z<=54){
  let k=z-1;

  for(let p=0;p<5;p++){
   if(k<groups[p].length){
    return{
     row:p+1,
     col:groups[p][k]
    };
   }
   k-=groups[p].length;
  }
 }

 if(z<=56)return{row:6,col:z-54};
 if(z<=71)return{row:9,col:z-53};
 if(z<=86)return{row:6,col:z-68};
 if(z<=88)return{row:7,col:z-86};
 if(z<=103)return{row:10,col:z-85};

 return{row:7,col:z-100};
}

  html+=`
   <span class="period-label"
    style="grid-row:1;grid-column:${g+1}">
    ${g}

 for(let p=1;p<=7;p++){
  html+=`
   <span class="period-label"
    style="grid-row:${p+1};grid-column:1">
    ${p}
   </span>
  `;
 }

 html+=`
  <span class="period-label"
   style="grid-row:10;grid-column:1">
   La–Lu
  </span>
  <span class="period-label"
   style="grid-row:11;grid-column:1">
   Ac–Lr
  </span>
  <span class="period-label"
   style="grid-row:7;grid-column:4">
   57–71
  </span>
  <span class="period-label"
   style="grid-row:8;grid-column:4">
   89–103
  </span>
 `;

 for(const el of elements){
  const p=position(el.z);

  const f=
   (el.z>=57&&el.z<=71) ||
   (el.z>=89&&el.z<=103);

  const featured=
   ["H","C","O"].includes(el.symbol);

  html+=`
   <button
    class="element ${
     f?"fblock":featured?"featured":""
    }"
    data-z="${el.z}"
    style="
     grid-row:${p.row+1};
     grid-column:${p.col+1}
    ">
    <i>${el.z}</i>
    <b>${el.symbol}</b>
    <small>${el.name}</small>
   </button>
  `;
 }

 $("period").innerHTML=html;
}

 if(
  event.key==="ArrowRight" &&
  page<slides.length-1
 ){
  page++;
  draw();
 }else if(
  event.key==="ArrowLeft" &&
  page>0
 ){
  page--;
  draw();
 }
});
