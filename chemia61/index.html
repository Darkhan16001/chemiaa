<body>

<div class="app">
 <header class="topbar">

<script>
"use strict";

/* ------------------------------------
   §61 · CHEMISTRY
   Бір файлдық интерактивті сабақ
------------------------------------ */

const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
}[c]));

const KEY="darkhan_chem61_single_v1";

function initial(){
 return{
  levels:{},
  board:0,
  boardOpen:false,
  game:0,
  gameOpen:false,
  scores:[0,0,0],
  homeOpen:false
 };
}

let state=initial();

try{
 const old=JSON.parse(localStorage.getItem(KEY));
 if(old && Array.isArray(old.scores)){
  state={...initial(),...old};
 }
}catch(e){console.warn(e);}

function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(state));
 }catch(e){console.warn(e);}
}

/* УАҚЫТ */

const TIMER_KEY=KEY+"_timer";
let deadline=Number(localStorage.getItem(TIMER_KEY))||null;

function remaining(){
 return deadline===null
  ?4800
  :Math.max(0,Math.ceil((deadline-Date.now())/1000));
}

function updateClock(){
 const t=remaining();

 $("timer").textContent=
  String(Math.floor(t/60)).padStart(2,"0")+
  ":"+String(t%60).padStart(2,"0");

 $("timer").style.color=t===0?"#ffacb5":"#ffdb91";

 $("clock").textContent=
  new Intl.DateTimeFormat("en-GB",{
   timeZone:"Asia/Almaty",
   hour:"2-digit",
   minute:"2-digit",
   second:"2-digit",
   hourCycle:"h23"
  }).format(new Date());
}

function startTimer(){
 if(deadline && remaining()>0)return;
 deadline=Date.now()+80*60*1000;
 localStorage.setItem(TIMER_KEY,String(deadline));
 updateClock();
 render();
}

function resetTimer(){
 if(!confirm("80 минуттық таймерді жаңартамыз ба?"))return;
 deadline=null;
 localStorage.removeItem(TIMER_KEY);
 updateClock();
 render();
}

setInterval(updateClock,1000);

/* СЛАЙДТАР */

const slides=[];
let page=0;

function add(title,section,content){
 slides.push({title,section,content});
}
function dynamic(title,section,content){
 slides.push({title,section,render:content});
}
function render(){
 const s=slides[page];
 if(!s)return;

 $("slide").innerHTML=s.render?s.render():s.content;
 $("sectionName").textContent=s.section;
 $("slideTitle").textContent=s.title;
 $("pageCounter").textContent=
  `${page+1} / ${slides.length}`;

 $("prev").disabled=page===0;
 $("next").disabled=page===slides.length-1;
 $("main").scrollTop=0;
}
function goTo(title){
 const i=slides.findIndex(x=>x.title===title);
 if(i>=0){page=i;render();}
}
$("prev").onclick=()=>{
 if(page>0){page--;render();}
};
$("next").onclick=()=>{
 if(page<slides.length-1){page++;render();}
};

/* МОЛЕКУЛАЛЫҚ СЫЗБА */

function molecule(kind="ethane"){
 const models={
  methane:{
   f:"CH₄",
   name:"Метан",
   atoms:[["C",225,95],["H",225,22],
          ["H",225,168],["H",145,95],["H",305,95]],
   bonds:[[0,1],[0,2],[0,3],[0,4]]
  },
  ethane:{
   f:"C₂H₆",
   name:"Этан",
   atoms:[["C",170,95],["C",280,95],
          ["H",112,48],["H",112,142],
          ["H",170,24],["H",280,24],
          ["H",338,48],["H",338,142]],
   bonds:[[0,1],[0,2],[0,3],[0,4],
          [1,5],[1,6],[1,7]]
  },
  ethene:{
   f:"C₂H₄",
   name:"Этен",
   atoms:[["C",165,95],["C",285,95],
          ["H",104,44],["H",104,146],
          ["H",346,44],["H",346,146]],
   bonds:[[0,1],[0,1],[0,2],[0,3],[1,4],[1,5]]
  },
  methanol:{
   f:"CH₃OH",
   name:"Метанол",
   atoms:[["C",145,95],["O",290,95],
          ["H",77,95],["H",145,24],
          ["H",145,166],["H",375,95]],
   bonds:[[0,1],[0,2],[0,3],[0,4],[1,5]]
  }
 };

 const m=models[kind]||models.ethane;

 const bonds=m.bonds.map((b,i)=>{
  const a=m.atoms[b[0]],c=m.atoms[b[1]];
  const duplicate=m.bonds.findIndex((x,j)=>
   j<i && x[0]===b[0] && x[1]===b[1])>=0;
  const offset=duplicate?7:
   m.bonds.some((x,j)=>j>i &&
     x[0]===b[0] && x[1]===b[1])?-7:0;

  return `<line
   x1="${a[1]}" y1="${a[2]+offset}"
   x2="${c[1]}" y2="${c[2]+offset}"
   stroke="#ffdb91" stroke-width="5"
   stroke-linecap="round"/>`;
 }).join("");

 const atoms=m.atoms.map(a=>`
  <circle cx="${a[1]}" cy="${a[2]}" r="23"
   fill="${a[0]==="O"?"#e6506b":
          a[0]==="H"?"#e9f7ff":"#263b50"}"
   stroke="#8bdfff" stroke-width="3"/>
  <text x="${a[1]}" y="${a[2]+7}"
   fill="${a[0]==="H"?"#17364b":"white"}"
   font-size="22" font-weight="900"
   text-anchor="middle">${a[0]}</text>
 `).join("");

 return `
  <div class="molecule">
   <svg viewBox="0 0 450 190"
    role="img" aria-label="${m.name} моделі">
    ${bonds}${atoms}
   </svg>
   <strong>${m.f}</strong>
   <p>${m.name} молекуласының көрнекі моделі</p>
  </div>
 `;
}

/* КІРІСПЕ */

dynamic("Органикалық химияда қолданылатын формулалар",
 "Кіріспе · 5 минут",()=>`

    </button>
    <button class="btn" onclick="resetTimer()">
     ↺ Таймерді жаңарту
    </button>
   </div>
  </div>

/* КАЛЬКУЛЯТОР */

const calculator=$("calculator");
const calcDisplay=$("calcDisplay");

let calcText="";
const calcButtons=[
 "7","8","9","÷",
 "4","5","6","×",
 "1","2","3","−",
 "C","0",".","+",
 "(",")","⌫","="
];

$("calcKeys").innerHTML=calcButtons.map(k=>`
 <button type="button" data-key="${k}">${k}</button>
`).join("");

$("calcOpen").onclick=()=>{
 calculator.classList.toggle("hidden");
 keepCalcInside();
};
$("calcClose").onclick=()=>{
 calculator.classList.add("hidden");
};

function calculate(src){
 if(!/^[0-9+\-*/(). ]+$/.test(src)){
  throw Error("Қате өрнек");
 }
 let pos=0;
 function skip(){while(src[pos]===" ")pos++;}
 function factor(){
  skip();
  if(src[pos]==="+"){pos++;return factor();}
  if(src[pos]==="-"){pos++;return -factor();}
  if(src[pos]==="("){
   pos++;
   const v=expression();
   skip();
   if(src[pos]!==")")throw Error("Жақша қатесі");
   pos++;
   return v;
  }
  const m=/^(?:\d+\.?\d*|\.\d+)/
   .exec(src.slice(pos));
  if(!m)throw Error("Сан қатесі");
  pos+=m[0].length;
  return Number(m[0]);
 }
 function term(){
  let v=factor();
  while(true){
   skip();
   const op=src[pos];
   if(op!=="*"&&op!=="/")break;
   pos++;
   const b=factor();
   v=op==="*"?v*b:v/b;
  }
  return v;
 }
 function expression(){
  let v=term();
  while(true){
   skip();
   const op=src[pos];
   if(op!=="+"&&op!=="-")break;
   pos++;
   const b=term();
   v=op==="+"?v+b:v-b;
  }
  return v;
 }
 const result=expression();
 skip();
 if(pos!==src.length||!Number.isFinite(result))
  throw Error("Есептеу қатесі");
 return Number(result.toPrecision(12));
}

$("calcKeys").addEventListener("click",e=>{
 const btn=e.target.closest("[data-key]");
 if(!btn)return;

 const k=btn.dataset.key;
 if(k==="C"){
  calcText="";
 }else if(k==="⌫"){
  calcText=calcText.slice(0,-1);
 }else if(k==="="){
  try{
   const expr=calcText.replaceAll("×","*")
    .replaceAll("÷","/").replaceAll("−","-");
   calcText=String(calculate(expr));
  }catch(error){
   calcText="Қате";
  }
 }else{
  if(calcText==="Қате")calcText="";
  calcText+=k;
 }
 calcDisplay.value=calcText;
});

/* КАЛЬКУЛЯТОРДЫ БАРЛЫҚ ЖЕРІНЕН ЖЫЛЖЫТУ */

const clamp=(v,min,max)=>
 Math.max(min,Math.min(v,max));

function keepCalcInside(){
 if(calculator.classList.contains("hidden"))return;
 const r=calculator.getBoundingClientRect();
 calculator.style.left=clamp(
  r.left,0,Math.max(0,innerWidth-r.width)
 )+"px";
 calculator.style.top=clamp(
  r.top,0,Math.max(0,innerHeight-r.height)
 )+"px";
 calculator.style.right="auto";
 calculator.style.bottom="auto";
}

let drag=null;
let suppressClick=false;

calculator.addEventListener("pointerdown",e=>{
 if(e.pointerType==="mouse"&&e.button!==0)return;
 const r=calculator.getBoundingClientRect();
 drag={
  id:e.pointerId,
  x:e.clientX,y:e.clientY,
  left:r.left,top:r.top,
  moved:false
 };
 calculator.setPointerCapture(e.pointerId);
});

calculator.addEventListener("pointermove",e=>{
 if(!drag||drag.id!==e.pointerId)return;
 const dx=e.clientX-drag.x;
 const dy=e.clientY-drag.y;

 if(!drag.moved&&Math.hypot(dx,dy)>7){
  drag.moved=true;
  calculator.classList.add("dragging");
 }
 if(!drag.moved)return;
 if(e.cancelable)e.preventDefault();

 calculator.style.left=clamp(
  drag.left+dx,0,
  Math.max(0,innerWidth-calculator.offsetWidth)
 )+"px";
 calculator.style.top=clamp(
  drag.top+dy,0,
  Math.max(0,innerHeight-calculator.offsetHeight)
 )+"px";
 calculator.style.right="auto";
 calculator.style.bottom="auto";
});

function stopDrag(e){
 if(!drag||drag.id!==e.pointerId)return;
 const moved=drag.moved;
 drag=null;
 calculator.classList.remove("dragging");

 if(moved){
  suppressClick=true;
  setTimeout(()=>{suppressClick=false;},150);
 }
 if(calculator.hasPointerCapture(e.pointerId)){
  calculator.releasePointerCapture(e.pointerId);
 }
}

calculator.addEventListener("pointerup",stopDrag);
calculator.addEventListener("pointercancel",stopDrag);

calculator.addEventListener("click",e=>{
 if(!suppressClick)return;
 e.preventDefault();
 e.stopImmediatePropagation();
},true);

 [1,18],

 [1,2,13,14,15,16,17,18],
 Array.from({length:18},(_,i)=>i+1),
 Array.from({length:18},(_,i)=>i+1)
];

function elementPosition(z){
 if(z<=54){
  let x=z-1;
  for(let p=0;p<5;p++){
   if(x<rows[p].length){
    return{row:p+1,col:rows[p][x]};
   }
   x-=rows[p].length;
  }
 }
 if(z<=56)return{row:6,col:z-54};
 if(z<=71)return{row:9,col:z-54};
 if(z<=86)return{row:6,col:z-68};
 if(z<=88)return{row:7,col:z-86};
 if(z<=103)return{row:10,col:z-86};
 return{row:7,col:z-100};
}

const highlighted=new Set(["H","C","O","N"]);
const noble=new Set(["He","Ne","Ar","Kr","Xe","Rn","Og"]);

function elementClass(e){
 if(highlighted.has(e.symbol))return"highlight";
 if(noble.has(e.symbol))return"noble";
 if(e.z>=57&&e.z<=71)return"lanth";
 if(e.z>=89&&e.z<=103)return"act";
 return"";
}

function buildPeriodic(){
 let html="";

 for(let g=1;g<=18;g++){
  html+=`<div class="group-label"
   style="grid-row:1;grid-column:${g+1}">${g}</div>`;
 }
 for(let p=1;p<=7;p++){
  html+=`<div class="period-label"
   style="grid-row:${p+1};grid-column:1">${p}</div>`;
 }

 html+=`
  <div class="period-label"
   style="grid-row:10;grid-column:1;font-size:11px">
   Лантаноид
  </div>
  <div class="period-label"
   style="grid-row:11;grid-column:1;font-size:11px">
   Актиноид
  </div>
 `;

 elements.forEach((e,i)=>{
  const p=elementPosition(e.z);
  html+=`
   <button class="element ${elementClass(e)}"
    style="grid-row:${p.row+1};grid-column:${p.col+1}"
    data-element="${i}">
    <span class="number">${e.z}</span>
    <span class="symbol">${esc(e.symbol)}</span>
    <span class="ename">${esc(e.name)}</span>
    <span class="mass">${esc(e.mass)}</span>
   </button>
  `;
 });

 $("periodicGrid").innerHTML=html;
}

$("periodicGrid").addEventListener("click",e=>{
 const btn=e.target.closest("[data-element]");
 if(!btn)return;

 const element=elements[Number(btn.dataset.element)];
 const pos=elementPosition(element.z);
 const period=pos.row===9?6:pos.row===10?7:pos.row;
 const group=pos.row>7?"f-блок":pos.col+"-топ";

 $("elementInfo").innerHTML=`
  <b class="blue">
   ${element.z}. ${esc(element.name)}
   (${esc(element.symbol)})
  </b>
  <div>${period}-период · ${group}</div>
  <div>
   Атомдық масса немесе изотоптың массалық саны:
   <b class="gold">${esc(element.mass)}</b>
  </div>
 `;
});
