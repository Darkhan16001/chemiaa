
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071827">
<title>§60 | Органикалық заттардың құрамы</title>

<style>
:root{
  --bg:#071827;
  --panel:#163a52;
  --blue:#8bddff;
  --green:#89eec0;
  --gold:#ffdc94;
  --red:#ffb5ba;
  --text:#f7fcff;
  --muted:#b9d4e6;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.hidden{display:none!important}
.blue{color:var(--blue)}
.green{color:var(--green)}
.gold{color:var(--gold)}
.red{color:var(--red)}
.center{text-align:center}

.app{
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:
    radial-gradient(circle at 90% 8%,#157a9d70,transparent 43%),
    radial-gradient(circle at 7% 93%,#167d5b50,transparent 43%),
    linear-gradient(125deg,#061522,#10334c,#071827);
}
.topbar{
  flex-shrink:0;
  min-height:76px;
  padding:10px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  background:#071b2e;
  border-bottom:1px solid #6ca5c0;
}
.brand{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.brand strong{
  font-size:29px;
  color:var(--blue);
  font-weight:900;
}
.brand small{
  font-size:13px;
  color:var(--gold);
  font-weight:800;
}
.top-info{
  display:flex;
  align-items:center;
  gap:17px;
  font-weight:900;
}
#lessonTimer{
  font-size:31px;
  color:var(--gold);
  font-variant-numeric:tabular-nums;
}
#pageCount{color:var(--blue)}

.main{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:24px 35px 34px;
  scrollbar-color:#6195b2 #102d41;
}
.slide{
  max-width:1510px;
  min-height:100%;
  margin:auto;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
h1{
  margin:8px 0 20px;
  font-size:clamp(42px,4.6vw,76px);
  line-height:1.13;
}
h2{
  margin:0 0 18px;
  font-size:clamp(32px,3vw,50px);
  line-height:1.2;
}
h3{
  color:var(--blue);
  font-size:clamp(25px,2.1vw,35px);
  margin:0 0 12px;
}
p,li{
  font-size:clamp(21px,1.75vw,29px);
  line-height:1.48;
}
li{margin-bottom:8px}
.subtitle{
  font-size:20px;
  font-weight:900;
  letter-spacing:1px;
  color:var(--blue);
  margin-bottom:13px;
}
.big{
  font-size:clamp(44px,5vw,78px);
  font-weight:900;
}

.grid2,.hero,.theory-layout{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
  align-items:center;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}
.card{
  min-width:0;
  padding:23px 26px;
  background:linear-gradient(145deg,#1d4660,#112b42);
  border:1px solid #76acc8;
  border-radius:19px;
  box-shadow:0 12px 32px #0004;
}
.green-card{
  background:linear-gradient(145deg,#175b49,#103c35);
  border-color:#7de6ba;
}
.card p{margin:9px 0}
.formula{
  padding:19px;
  margin:15px 0;
  background:#0f4051;
  color:var(--green);
  border:1px solid #73c4d1;
  border-radius:15px;
  text-align:center;
  font-size:clamp(28px,2.7vw,46px);
  font-weight:900;
  overflow-wrap:anywhere;
}
.note{
  margin-top:15px;
  padding:17px 20px;
  background:#1d425c;
  border-left:7px solid var(--gold);
  border-radius:12px;
  font-size:clamp(20px,1.55vw,26px);
  line-height:1.5;
}
.step{
  padding:9px 14px;
  margin-top:8px;
  border-radius:9px;
  background:#254e65;
  font-size:clamp(19px,1.5vw,25px);
}
.model-card{
  min-height:270px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:11px;
  padding:17px;
  border:1px solid #7fbad5;
  border-radius:19px;
  background:#14394f;
}
.model-card svg{
  width:100%;
  max-width:480px;
  height:195px;
}
.model-card strong{
  color:var(--green);
  font-size:32px;
}
.model-card p{
  font-size:19px;
  margin:0;
  color:var(--muted);
  text-align:center;
}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  font-size:15px;
}
.legend span{
  padding:5px 9px;
  background:#204b61;
  border-radius:8px;
}
.chem-table{
  width:100%;
  border-collapse:collapse;
}
.chem-table th,.chem-table td{
  padding:12px;
  border-bottom:1px solid #689cba;
  text-align:left;
  font-size:clamp(18px,1.5vw,26px);
}
.chem-table th{color:var(--blue)}
.task{
  margin-bottom:12px;
  padding:15px 19px;
  background:#173d57;
  border:1px solid #6fa5c0;
  border-radius:13px;
}
.task p{margin:5px 0}
.question{
  font-size:clamp(30px,2.85vw,47px);
  font-weight:900;
  line-height:1.4;
}
.answer{
  margin-top:16px;
  padding:18px;
  background:#11543f;
  border:1px solid #7ce9b9;
  border-radius:15px;
  font-size:clamp(22px,1.85vw,30px);
  line-height:1.52;
}
.board-number{
  display:inline-block;
  padding:12px 21px;
  border:2px solid var(--gold);
  border-radius:14px;
  background:#6d542e;
  font-size:clamp(26px,2.5vw,42px);
  font-weight:900;
}
.board-progress{
  height:13px;
  margin-top:14px;
  background:#274a60;
  border-radius:20px;
  overflow:hidden;
}
.board-progress div{
  height:100%;
  background:linear-gradient(90deg,#20a5d7,#84ebbc);
}
.board-problem{
  margin-top:18px;
  padding:28px;
  background:linear-gradient(145deg,#17516b,#103349);
  border:2px solid #7bc9e4;
  border-radius:20px;
}
.board-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:19px;
}
.team-card{
  padding:19px;
  text-align:center;
  background:#173d56;
  border:1px solid #76a8c5;
  border-radius:17px;
}
.team-score{
  font-size:56px;
  color:var(--gold);
  font-weight:900;
}
.active-team{
  outline:4px solid var(--gold);
  box-shadow:0 0 26px #ffdb9460;
}
.homework-row{
  margin-bottom:12px;
  padding:15px 19px;
  background:#173e57;
  border-left:6px solid var(--blue);
  border-radius:12px;
}
.homework-row p{margin:5px 0}
.footer{
  flex-shrink:0;
  min-height:90px;
  padding:10px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  background:#081d30;
  border-top:1px solid #699bb8;
}
.navigation{display:flex;gap:10px}
.signature{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.signature strong{
  font-size:32px;
  letter-spacing:3px;
  font-weight:900;
  color:var(--gold);
}
.signature small{
  font-size:13px;
  color:var(--muted);
}
.clock{
  padding:8px 15px;
  background:#12374e;
  border:1px solid #68a2c0;
  border-radius:12px;
  text-align:center;
}
#realClock{
  display:block;
  font-size:28px;
  color:var(--blue);
  font-variant-numeric:tabular-nums;
}
.clock small{font-size:12px;color:var(--muted)}
.btn{
  padding:12px 19px;
  background:#295e7c;
  border:1px solid #81afc9;
  border-radius:11px;
  color:#fff;
  font-size:19px;
  font-weight:900;
}
.btn.primary{background:#0c91ae;border-color:#8ae9ff}
.btn.success{background:#137f5e;border-color:#89edbf}
.btn.warning{background:#926c31;border-color:#f8d48f}

.tools{
  position:fixed;
  z-index:50;
  left:11px;
  bottom:111px;
  display:flex;
  flex-direction:column;
  gap:7px;
  align-items:flex-start;
}
.tool-btn{
  padding:10px 12px;
  color:white;
  font-size:13px;
  font-weight:900;
  border:1px solid #81defc;
  border-radius:9px;
  background:#117f9f;
}
.green-btn{background:#177958;border-color:#82eabb}

/* КАЛЬКУЛЯТОР */
.calculator{
  position:fixed;
  z-index:1200;
  top:105px;
  left:15px;
  width:190px;
  max-width:calc(100vw - 12px);
  padding:7px;
  color:white;
  background:#103049;
  border:1px solid #87dcff;
  border-radius:12px;
  box-shadow:0 20px 45px #000b;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  cursor:grab;
}
.calculator *{touch-action:none}
.calculator.dragging{cursor:grabbing}
.calc-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  padding:5px;
  margin-bottom:6px;
  border-radius:7px;
  background:#27546d;
  font-size:11px;
}
.close{
  padding:4px 8px;
  color:white;
  background:#b84959;
  border:0;
  border-radius:6px;
}
#calcDisplay{
  width:100%;
  height:38px;
  padding:5px;
  text-align:right;
  color:white;
  background:#061b2c;
  border:1px solid #7aaac5;
  border-radius:7px;
  font-size:17px;
}
.calc-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:3px;
  margin-top:5px;
}
.calc-grid button{
  min-width:0;
  height:31px;
  padding:1px;
  color:white;
  background:#2a5f7b;
  border:1px solid #6aa2bd;
  border-radius:6px;
  font-size:14px;
  font-weight:900;
}
.calc-hint{
  margin-top:5px;
  text-align:center;
  font-size:10px;
  color:var(--muted);
}

/* ПЕРИОДТЫҚ КЕСТЕ */
.overlay{
  position:fixed;
  inset:0;
  z-index:2000;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:12px;
  background:#000d;
}
.periodic-panel{
  width:min(1650px,99vw);
  max-height:97vh;
  overflow:auto;
  padding:17px;
  background:#0e293f;
  border:1px solid #79aec9;
  border-radius:18px;
}
.modal-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.modal-head p{font-size:17px}
.periodic-scroll{
  padding:12px;
  overflow:auto;
  background:#061c2e;
  border-radius:11px;
}
.periodic-grid{
  display:grid;
  min-width:1840px;
  grid-template-columns:56px repeat(18,minmax(95px,1fr));
  grid-template-rows:45px repeat(10,101px);
  gap:5px;
}
.group-num,.period-num,.period-corner{
  display:grid;
  place-items:center;
  padding:4px;
  background:#1b4c65;
  border:1px solid #73b7d2;
  border-radius:8px;
  color:var(--gold);
  font-size:19px;
  font-weight:900;
  text-align:center;
}
.period-corner,.period-num.series{font-size:11px}
.element{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:12px 3px 4px;
  color:white;
  background:#246685;
  border:1px solid #92c4d9;
  border-radius:8px;
}
.element .num{
  position:absolute;
  top:4px;
  left:5px;
  font-size:12px;
}
.element .symbol{font-size:28px;font-weight:900}
.element .ename{font-size:12px;text-align:center}
.element .mass{font-size:12px;color:#e4f4ff}
.element.highlight{background:#995172}
.element.noble{background:#6952a2}
.element.lanth{background:#357b8e}
.element.act{background:#83556d}
.element-info{
  padding:15px;
  margin-top:12px;
  background:#194760;
  border-radius:11px;
  font-size:21px;
  line-height:1.5;
}
.series-guide{
  display:grid;
  place-items:center;
  padding:5px;
  color:var(--gold);
  border:1px dashed #a8c6d7;
  border-radius:8px;
  background:#183d54;
  font-size:14px;
  font-weight:bold;
  text-align:center;
}

@media(max-width:950px){
  .grid2,.grid3,.hero,.theory-layout{
    grid-template-columns:1fr;
  }
}
@media(max-width:700px){
  .topbar{padding:9px}
  .brand strong{font-size:18px}
  .brand small,#sectionName{display:none}
  .top-info{gap:9px;font-size:13px}
  #lessonTimer{font-size:21px}
  .main{padding:13px}
  h1{font-size:36px}
  h2{font-size:29px}
  h3{font-size:24px}
  p,li{font-size:19px}
  .card{padding:16px}
  .board-problem{padding:16px}
  .footer{min-height:79px;padding:7px}
  .navigation{gap:4px}
  .signature strong{font-size:16px;letter-spacing:0}
  .signature small{display:none}
  .clock{padding:5px 6px}
  #realClock{font-size:16px}
  .clock small{font-size:10px}
  .btn{padding:8px;font-size:13px}
  .tools{left:8px;bottom:94px}
  .tool-btn{padding:8px;font-size:12px}
}
</style>
</head>

<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <strong>⚗ CHEMISTRY PRO</strong>
      <small>§60 · ОРГАНИКАЛЫҚ ЗАТТАРДЫҢ ҚҰРАМЫ</small>
    </div>

    <div class="top-info">
      <span id="sectionName">Кіріспе</span>
      <strong id="lessonTimer">80:00</strong>
      <span id="pageCount">1 / 1</span>

      <small id="slideTitle">Органикалық заттардың құрамы</small>
    </div>

    <div class="clock">
      <strong id="realClock">00:00:00</strong>
      <small>Алматы уақыты</small>
    </div>

</div>

<div class="tools">
  <button id="calcOpen" class="tool-btn">
    🧮 Калькулятор
  </button>
  <button id="tableOpen" class="tool-btn green-btn">
    ⚛ Менделеев кестесі
  </button>
</div>

<div id="calculator" class="calculator hidden">
  <div class="calc-head">
    <strong>🧮 Калькулятор</strong>
    <button id="calcClose" class="close"
      aria-label="Жабу">✕</button>
  </div>

  <input id="calcDisplay" readonly
    aria-label="Есептеу нәтижесі">

  <div id="calcKeys" class="calc-grid"></div>

  <div class="calc-hint">
    Кез келген жерінен ұстап жылжыт
  </div>
</div>

<div id="periodicModal" class="overlay hidden">
  <div class="periodic-panel">
    <div class="modal-head">
      <div>
        <h2>Менделеевтің периодтық кестесі</h2>
        <p>118 элемент · 18 топ · 7 период</p>
      </div>

      <button id="tableClose" class="close"
        aria-label="Кестені жабу">✕</button>
    </div>

    <div class="periodic-scroll">
      <div id="periodicGrid" class="periodic-grid"></div>
    </div>

    <div id="elementInfo" class="element-info">
      Элементті таңда.
    </div>
  </div>
</div>

<script>
"use strict";

/* =======================================
   §60 ОРГАНИКАЛЫҚ ЗАТТАРДЫҢ ҚҰРАМЫ
   БАРЛЫҚ КОД БІР ФАЙЛДА
======================================= */

const $=id=>document.getElementById(id);

const esc=value=>String(value).replace(
  /[&<>"']/g,
  c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c])
);

/* ЖАДТА САҚТАУ */

const STORAGE="chem60_onefile_darkhan_v1";
const TIMER_KEY=STORAGE+"_timer";

function freshState(){
  return{
    levels:{},
    board:0,
    boardAnswer:false,
    game:0,
    gameAnswer:false,
    scores:[0,0,0],
    homework:false
  };
}

let state=freshState();

try{
  const saved=JSON.parse(localStorage.getItem(STORAGE));
  if(saved && Array.isArray(saved.scores)){
    state={...freshState(),...saved};
  }
}catch(error){
  console.warn(error);
}

function save(){
  try{
    localStorage.setItem(STORAGE,JSON.stringify(state));
  }catch(error){
    console.warn(error);
  }
}

/* 80 МИНУТ ЖӘНЕ АЛМАТЫ САҒАТЫ */

const storedTime=localStorage.getItem(TIMER_KEY);
let deadline=storedTime===null?null:Number(storedTime);

if(deadline!==null &&
   (!Number.isFinite(deadline)||deadline<=0)){
  deadline=null;
}

function remaining(){
  return deadline===null
    ?4800
    :Math.max(0,Math.ceil((deadline-Date.now())/1000));
}

function updateTime(){
  const t=remaining();

  $("lessonTimer").textContent=
    String(Math.floor(t/60)).padStart(2,"0")+
    ":"+String(t%60).padStart(2,"0");

  $("lessonTimer").style.color=
    t===0?"#ffb5ba":"#ffdc94";

  $("realClock").textContent=
    new Intl.DateTimeFormat("en-GB",{
      timeZone:"Asia/Almaty",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hourCycle:"h23"
    }).format(new Date());
}

function startTimer(){
  if(deadline!==null && remaining()>0)return;
  deadline=Date.now()+4800000;
  localStorage.setItem(TIMER_KEY,String(deadline));
  updateTime();
  show();
}

function resetTimer(){
  if(!confirm("Таймерді жаңартамыз ба?"))return;
  deadline=null;
  localStorage.removeItem(TIMER_KEY);
  updateTime();
  show();
}

setInterval(updateTime,1000);

/* СЛАЙД ЖҮЙЕСІ */

const slides=[];
let page=0;

function add(title,section,html){
  slides.push({title,section,html});
}

function dynamic(title,section,render){
  slides.push({title,section,render});
}

function show(){
  const s=slides[page];
  if(!s)return;

  $("slide").innerHTML=s.render?s.render():s.html;
  $("sectionName").textContent=s.section;
  $("slideTitle").textContent=s.title;
  $("pageCount").textContent=`${page+1} / ${slides.length}`;

  $("prevBtn").disabled=page===0;
  $("nextBtn").disabled=page===slides.length-1;
  $("main").scrollTop=0;
}

function goTo(title){
  const i=slides.findIndex(s=>s.title===title);
  if(i>=0){
    page=i;
    show();
  }
}

$("prevBtn").onclick=()=>{
  if(page>0){page--;show();}
};

$("nextBtn").onclick=()=>{
  if(page<slides.length-1){page++;show();}
};

/* МОЛЕКУЛА СЫЗБАЛАРЫ */

const moleculeData={
  CH4:{
    formula:"CH₄",
    atoms:[
      ["C",235,90],["H",235,22],["H",235,158],
      ["H",162,90],["H",308,90]
    ],
    bonds:[[0,1],[0,2],[0,3],[0,4]]
  },
  C2H6:{
    formula:"C₂H₆",
    atoms:[
      ["C",180,90],["C",290,90],
      ["H",126,45],["H",126,135],["H",180,20],
      ["H",290,20],["H",344,45],["H",344,135]
    ],
    bonds:[
      [0,1],[0,2],[0,3],[0,4],
      [1,5],[1,6],[1,7]
    ]
  },
  CH3OH:{
    formula:"CH₃OH",
    atoms:[
      ["C",148,90],["O",285,90],
      ["H",76,90],["H",148,22],["H",148,158],
      ["H",365,90]
    ],
    bonds:[[0,1],[0,2],[0,3],[0,4],[1,5]]

const atomColors={
  C:"#263c50",H:"#eaf7ff",O:"#ed6277",N:"#5489e8"
};

function molecule(key,caption){
  const m=moleculeData[key]||moleculeData.CH4;

  let lines="";

  for(const [a,b] of m.bonds){
    const from=m.atoms[a];
    const to=m.atoms[b];
    lines+=`
      <line
        x1="${from[1]}" y1="${from[2]}"
        x2="${to[1]}" y2="${to[2]}"
        stroke="#ffdc94" stroke-width="6"
        stroke-linecap="round"
      />
    `;
  }

  const atoms=m.atoms.map(a=>`
    <circle cx="${a[1]}" cy="${a[2]}" r="23"
      fill="${atomColors[a[0]]}"
      stroke="#83dbff" stroke-width="3"/>
    <text x="${a[1]}" y="${a[2]+7}"
      text-anchor="middle" font-size="22"
      font-weight="900"
      fill="${a[0]==="H"?"#123146":"white"}">
      ${a[0]}
    </text>
  `).join("");

  return `
    <div class="model-card">
      <svg viewBox="0 0 470 180"
        role="img" aria-label="${esc(caption)}">
        ${lines}${atoms}
      </svg>
      <strong>${m.formula}</strong>
      <p>${esc(caption)}</p>
      <div class="legend">
        <span>⚫ Көміртек</span>
        <span>⚪ Сутек</span>
        <span>🔴 Оттек</span>
      </div>
    </div>
  `;
}

/* ӨРНЕКТЕРДІ ЕСЕПТЕУ */

function calculate(src){
  if(!/^[0-9+\-*/(). ]+$/.test(src)){
    throw Error("Қате өрнек");
  }

  let pos=0;

  function skip(){
    while(src[pos]===" ")pos++;
  }

  function factor(){
    skip();

    if(src[pos]==="+"){
      pos++;
      return factor();
    }

    if(src[pos]==="-"){
      pos++;
      return -factor();
    }

    if(src[pos]==="("){
      pos++;
      const result=expression();
      skip();

      if(src[pos]!==")")throw Error("Жақша қатесі");

      pos++;
      return result;
    }

    const match=/^(?:\d+\.?\d*|\.\d+)/
      .exec(src.slice(pos));

    if(!match)throw Error("Сан қатесі");

    pos+=match[0].length;
    return Number(match[0]);
  }

  function term(){
    let result=factor();

    while(true){
      skip();
      const op=src[pos];

      if(op!=="*" && op!=="/")break;

      pos++;
      const n=factor();
      result=op==="*"?result*n:result/n;
    }

    return result;
  }

  function expression(){
    let result=term();

    while(true){
      skip();
      const op=src[pos];

      if(op!=="+" && op!=="-")break;

      pos++;
      const n=term();
      result=op==="+"?result+n:result-n;
    }

    return result;
  }

  const result=expression();
  skip();

  if(pos!==src.length || !Number.isFinite(result)){
    throw Error("Есептеу қатесі");
  }

  return Number(result.toPrecision(12));
}

  }else if(key==="⌫"){
    calcText=calcText.slice(0,-1);
  }else if(key==="="){
    try{
      calcText=String(calculate(
        calcText
          .replaceAll("×","*")
          .replaceAll("÷","/")
          .replaceAll("−","-")
      ));
    }catch(error){
      calcText="Қате";
    }
  }else{
    if(calcText==="Қате")calcText="";
    calcText+=key;
  }

  calcDisplay.value=calcText;
});

======================================= */

const clamp=(value,min,max)=>
  Math.max(min,Math.min(value,max));

function keepCalculatorInside(){
  if(calculator.classList.contains("hidden"))return;

  const rect=calculator.getBoundingClientRect();

  calculator.style.left=clamp(
    rect.left,0,Math.max(0,innerWidth-rect.width)
  )+"px";

  calculator.style.top=clamp(
    rect.top,0,Math.max(0,innerHeight-rect.height)
  )+"px";

  calculator.style.right="auto";
  calculator.style.bottom="auto";
}

let drag=null;
let ignoreClick=false;

calculator.addEventListener("pointerdown",event=>{
  if(event.pointerType==="mouse"&&event.button!==0)return;

  const r=calculator.getBoundingClientRect();

  drag={
    id:event.pointerId,
    startX:event.clientX,
    startY:event.clientY,
    left:r.left,
    top:r.top,
    moved:false
  };

  calculator.setPointerCapture(event.pointerId);
});

calculator.addEventListener("pointermove",event=>{
  if(!drag || drag.id!==event.pointerId)return;

  const dx=event.clientX-drag.startX;
  const dy=event.clientY-drag.startY;

  if(!drag.moved && Math.hypot(dx,dy)>7){
    drag.moved=true;
    calculator.classList.add("dragging");
  }

  if(!drag.moved)return;

  if(event.cancelable)event.preventDefault();

  calculator.style.left=clamp(
    drag.left+dx,0,
    Math.max(0,innerWidth-calculator.offsetWidth)
  )+"px";

  calculator.style.top=clamp(
    drag.top+dy,0,
    Math.max(0,innerHeight-calculator.offsetHeight)
  )+"px";

  calculator.style.right="auto";
  calculator.style.bottom="auto";
});

function endDrag(event){
  if(!drag || drag.id!==event.pointerId)return;

  const moved=drag.moved;
  drag=null;

  calculator.classList.remove("dragging");

  if(moved){
    ignoreClick=true;
    setTimeout(()=>{ignoreClick=false;},100);
  }

  if(calculator.hasPointerCapture(event.pointerId)){
    calculator.releasePointerCapture(event.pointerId);
  }
}

calculator.addEventListener("pointerup",endDrag);
calculator.addEventListener("pointercancel",endDrag);

calculator.addEventListener("click",event=>{
  if(!ignoreClick)return;
  event.preventDefault();
  event.stopImmediatePropagation();
},true);

window.addEventListener("resize",keepCalculatorInside);

const elements=rawElements.trim()
  .split("\n")
  .map((line,i)=>{
    const [symbol,name,mass]=line.trim().split("|");
    return{
      number:i+1,
      symbol,
      name,
      mass
    };
  });

const periodColumns=[
  [1,18],
  [1,2,13,14,15,16,17,18],
  [1,2,13,14,15,16,17,18],
  Array.from({length:18},(_,i)=>i+1),
  Array.from({length:18},(_,i)=>i+1)
];

function elementPosition(z){
  if(z<=54){
    let index=z-1;

    for(let p=0;p<5;p++){
      const cols=periodColumns[p];

      if(index<cols.length){
        return{row:p+1,col:cols[index]};
      }

      index-=cols.length;
    }
  }

  // 6-период: Cs, Ba, Hf — Rn
  if(z<=56)return{row:6,col:z-54};
  if(z<=71)return{row:9,col:z-54};
  if(z<=86)return{row:6,col:z-68};

  // 7-период: Fr, Ra, Rf — Og
  if(z<=88)return{row:7,col:z-86};
  if(z<=103)return{row:10,col:z-86};
  return{row:7,col:z-100};
}

const important=new Set(["C","H","O","N"]);
const noble=new Set(["He","Ne","Ar","Kr","Xe","Rn","Og"]);

function elementClass(z,symbol){
  if(important.has(symbol))return"highlight";
  if(noble.has(symbol))return"noble";
  if(z>=57&&z<=71)return"lanth";
  if(z>=89&&z<=103)return"act";
  return"";
}

function buildPeriodic(){
  let html=`
    <div class="period-corner"
      style="grid-row:1;grid-column:1">
      Топ/период
    </div>
  `;

  for(let g=1;g<=18;g++){
    html+=`
      <div class="group-num"
        style="grid-row:1;grid-column:${g+1}">
        ${g}
      </div>
    `;
  }

  for(let p=1;p<=7;p++){
    html+=`
      <div class="period-num"
        style="grid-row:${p+1};grid-column:1">
        ${p}
      </div>
    `;
  }

  html+=`
    <div class="period-num series"
      style="grid-row:10;grid-column:1">
      Лантаноидтар
    </div>

    <div class="period-num series"
      style="grid-row:11;grid-column:1">
      Актиноидтар
    </div>

    <div class="series-guide"
      style="grid-row:7;grid-column:4">
      57–71
    </div>

    <div class="series-guide"
      style="grid-row:8;grid-column:4">
      89–103
    </div>
  `;

  elements.forEach((e,i)=>{
    const p=elementPosition(e.number);

    html+=`
      <button class="element ${elementClass(e.number,e.symbol)}"
        style="grid-row:${p.row+1};grid-column:${p.col+1}"
        data-element="${i}">
        <span class="num">${e.number}</span>
        <span class="symbol">${esc(e.symbol)}</span>
        <span class="ename">${esc(e.name)}</span>
        <span class="mass">${esc(e.mass)}</span>
      </button>
    `;
  });

  $("periodicGrid").innerHTML=html;
}

$("periodicGrid").addEventListener("click",event=>{
  const btn=event.target.closest("[data-element]");
  if(!btn)return;

  const e=elements[Number(btn.dataset.element)];
  const p=elementPosition(e.number);

  const period=p.row===9?6:p.row===10?7:p.row;
  const group=p.row>7?"f-блок":p.col+"-топ";

  $("elementInfo").innerHTML=`
    <b class="blue">
      ${e.number}. ${esc(e.name)} (${esc(e.symbol)})
    </b>

    <div>${period}-период · ${group}</div>

    <div>
      Атомдық масса немесе изотоп массалық саны:
      <b class="gold">${esc(e.mass)}</b>
    </div>
  `;
});

    !["INPUT","TEXTAREA"].includes(
      document.activeElement.tagName
    ) &&
    $("periodicModal").classList.contains("hidden")

    if(event.key==="ArrowRight" && page<slides.length-1){
      page++;
      show();
    }else if(event.key==="ArrowLeft" && page>0){
      page--;
      show();
    }
  }
});
